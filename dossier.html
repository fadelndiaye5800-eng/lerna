  .cf-dates li { display: flex; gap: 10px; align-items: baseline; }
  .cf-dates .dt { font-weight: 800; color: var(--brown); white-space: nowrap; min-width: 92px; }

  .cf-sec.compact { padding: 16px 18px; }
  .cf-ro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--cream-dark); font-size: .88rem; }

  .back:hover { color: var(--orange); }

  .ds-prog-top { display: flex; justify-content: space-between; font-size: .86rem; font-weight: 700; margin-bottom: 6px; }
  .ds-prog-top strong { color: var(--orange); }

  .step.done { border-color: var(--olive-bg); background: var(--cream); }
  .step-ck { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--cream-darker); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; transition: all .15s; }
  .step.done .step-ck { background: var(--orange); border-color: var(--orange); }

  .step-body p { font-size: .9rem; color: var(--muted); margin-top: 4px; }

  .step-meta input[type=date] { border: 1.5px solid var(--cream-darker); border-radius: 10px; padding: 5px 8px; background: var(--surface); color: var(--brown); font-size: .84rem; }
  .doc { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border: 1.5px solid var(--cream-dark); border-radius: 14px; background: var(--surface); }
  .doc-name { font-weight: 600; font-size: .94rem; flex: 1; min-width: 180px; }

  .dlist { display: grid; gap: 14px; }

  .dcard h3 { font-size: 1.08rem; }

  .voeu .vn { width: 26px; height: 26px; border-radius: 9px; background: var(--brown); color: var(--cream); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .8rem; flex-shrink: 0; }

  .voeu small { display: block; color: var(--muted); }
  .bcard { margin-top: 18px; }
  .bitem { display: block; text-decoration: none; color: var(--brown); background: var(--surface, var(--white)); border: 1.5px solid var(--cream-dark); border-radius: 14px; padding: 10px 12px; }

  .dcard .next { font-size: .88rem; color: var(--muted); }
  .dcard .next strong { color: var(--brown); }
  .pick { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .pick button { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--cream-dark); background: var(--surface); text-align: left; font-weight: 600; }
  .pick button:hover { border-color: var(--orange); }
  .pick .flg { width: 30px; height: 30px; }
  .pick small { display: block; color: var(--muted); font-weight: 500; }
  .free-note { font-size: .82rem; color: var(--muted); margin-top: 10px; }
  @media print {
    body * { visibility: hidden !important; }
    .cv-sheet, .cv-sheet * { visibility: visible !important; }
    .cv-sheet { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; }
  }
</style>

(function () {

  if (!TABS.some(function (x) { return x[0] === tab; })) tab = 'etapes';
  function country() { return Lerna.country(); }

  function guide(d) {

  }
  /* Avis IA du jour : 3 gratuits par jour (illimité en Premium, et tout ouvert avant le lancement) */

    if (Lerna.isPremium()) return Infinity;

  function bump(kind) { var q = store.get('lerna_coach', null) || {}; if (q.d !== Lerna.today()) q = { d: Lerna.today() }; q[kind] = (q[kind] || 0) + 1; store.set('lerna_coach', q); }

    });
    var fav = Lerna.favs.list().filter(function (x) { return window.LERNA_SCHOOL(x) && ids.indexOf(x) === -1; });

  }
  /* Démarrer un dossier depuis une école recommandée qui n'a pas de fiche LERNA */
  function fromReco(i) {

      var parts = String(r.nom).split(' — ');

  }
  function startAny(x) {
    if (!x) return;

        var s = window.LERNA_DOSSIER_SCHOOL(sid), d = Lerna.dossiers.get(sid), g = window.LERNA_GUIDE_FOR(s, country(), answers);
        if (d.guide && window.LERNA_GUIDES[d.guide]) g = window.LERNA_GUIDES[d.guide];
        var p = progress(d, g), next = g.steps.filter(function (x) { return !(d.steps && d.steps[x.id] && d.steps[x.id].done); })[0];

          '<div class="ds-prog-top"><span>' + t('ds.stepsDone', { n: p.done, t: p.total }) + '</span><strong>' + p.pct + '%</strong></div><div class="bar"><span style="width:' + p.pct + '%"></span></div>' +
          '<p class="next">' + (next ? t('ds.nextStep', { s: '<strong>' + esc(L(next.title)) + '</strong>' }) : t('ds.allDone')) + '</p><span class="btn-link">' + t('ds.open') + '</span></a>';

    var mine = firstYear(s) || Infinity, doms = s.domaines || [];
    return (window.LERNA_SCHOOLS || []).filter(function (x) {
      if (x.id === s.id || !(x.domaines || []).some(function (d) { return doms.indexOf(d) !== -1; })) return false;
      var fee = window.LERNA_FEE_FOR(x, country()), fy = firstYear(x);
      return fee !== null && fy !== null && fee <= max && fy < mine;
    }).sort(function (a, b) { return firstYear(a) - firstYear(b); }).slice(0, 3);
  }
  function pBudget() {
    var s = school();
    var h = '<h2 style="font-size:1.3rem">' + t('bg.title') + '</h2><p class="muted small" style="margin:6px 0 14px">' + t('bg.sub') + '</p>';
    if (!Lerna.isPremium()) {
      return h + '<section class="card bg-lock">' + Lerna.sticker('money-bag', 'stk-sm') + '<h3 style="margin-top:8px">' + t('bg.lockTitle') + '</h3><p class="muted" style="margin:6px 0 16px">' + t('bg.lockText') + '</p>' +
        '<div class="bg-blur" aria-hidden="true"><div class="bg-row"><span>' + t('bg.tuition') + '</span><strong>' + Lerna.money(budgetDefaults(s).tuition || 4000) + '</strong></div><div class="bg-row"><span>' + t('bg.total') + '</span><strong>' + Lerna.money(9000) + '</strong></div></div>' +
        '<a class="btn btn-primary" style="margin-top:16px" href="premium.html?src=budget&plan=pack">' + t('bg.lockBtn') + ' →</a></section>';
    }
    var v = budgetVals(), T = budgetTotals(v), r = rate();
    var field = function (k, lbl) { return '<div class="field"><label for="bg_' + k + '">' + t(lbl) + '</label><div class="bg-in"><input class="input" type="number" min="0" step="any" inputmode="decimal" id="bg_' + k + '" data-bg="' + k + '" value="' + niceNum(v[k] * r) + '"><span>' + curLbl() + '</span></div></div>'; };
    if (window.LERNA_FEE_FOR(s, country()) === null) h += '<div class="notice" style="margin-bottom:12px">' + Lerna.icon('info') + '<div>' + t('bg.noFee') + '</div></div>';
    h += '<section class="card"><p class="label">' + t('bg.yearly') + '</p><div class="cv-grid">' + field('tuition', 'bg.tuition') + field('housing', 'bg.housing') + field('living', 'bg.living') + '</div>' +
      '<p class="label" style="margin-top:16px">' + t('bg.once') + '</p><div class="cv-grid">' + field('visa', 'bg.visa') + field('flight', 'bg.flight') + field('other', 'bg.other') + '</div>' +
      '<div class="bg-total"><span>' + t('bg.total') + '</span><strong id="bgTotal">' + Lerna.money(T.total) + '</strong></div><div id="bgVerdict">' + verdictHTML(v) + '</div>' +
      '<p class="small muted" style="margin-top:12px">' + t('bg.note') + ' ' + Lerna.moneyNote() + '</p></section>';
    var B = planB(s);
    h += '<section class="card" style="margin-top:16px"><h3>' + t('bg.planB') + '</h3><p class="muted small" style="margin:6px 0 12px">' + t('bg.planBSub') + '</p>';
    h += B.length ? '<div class="bg-plan">' + B.map(function (x) {
      return '<div class="bg-alt">' + Lerna.flag(x.pays) + '<div style="flex:1;min-width:0"><strong>' + esc(x.nom) + '</strong><small>' + esc(x.ville + ', ' + window.LERNA_COUNTRY_NAME(x.pays)) + ' · ' + t('bg.from', { m: Lerna.money(firstYear(x)) }) + '</small></div><a class="btn btn-ghost btn-sm" href="ecole.html?id=' + x.id + '">' + t('bg.see') + '</a></div>';
    }).join('') + '</div>' : '<p class="muted">' + t('bg.noPlanB') + '</p>';
    return h + '</section>';
  }
  function verdictHTML(v) {
    var max = answers && BUDGET_MAX[answers.q17];
    if (!max || max === Infinity) return '';
    var over = v.tuition - max;
    return '<p class="small" style="margin-top:8px">' + t('bg.yourBudget', { m: Lerna.money(max) }) + ' <strong class="' + (over > 0 ? 'orange' : '') + '">' + (over > 0 ? t('bg.over', { m: Lerna.money(over) }) : t('bg.ok')) + '</strong></p>';
  }

  /* Suivi */
  var STATUS = [['prep', 'ds.sPrep', 'memo'], ['sent', 'ds.sSent', 'envelope'], ['interview', 'ds.sInterview', 'mic'], ['waiting', 'ds.sWaiting', 'hourglass'], ['accepted', 'ds.sAccepted', 'party'], ['refused', 'ds.sRefused', 'seedling']];
  function pTrack() {
    var d = dossier();
    return '<h2 style="font-size:1.3rem">' + t('ds.trackTitle') + '</h2><div class="status-pills" style="margin-top:14px">' + STATUS.map(function (x) {
      return '<button type="button" class="' + (d.status === x[0] ? 'on' : '') + '" data-status="' + x[0] + '">' + Lerna.sticker(x[2], 'stk-xs') + t(x[1]) + '</button>';
    }).join('') + '</div>' +
      '<div class="cv-grid" style="margin-top:16px"><div class="field"><label for="sentOn">' + t('ds.sentOn') + '</label><input class="input" type="date" id="sentOn" data-track="sentOn" value="' + esc(d.sentOn || '') + '"></div>' +
      '<div class="field"><label for="answerBy">' + t('ds.answerBy') + '</label><input class="input" type="date" id="answerBy" data-track="answerBy" value="' + esc(d.answerBy || '') + '"></div></div>' +
      '<div class="field" style="margin-top:12px"><label for="notes">' + t('ds.notes') + '</label><textarea class="textarea" id="notes" data-track="notes" maxlength="3000">' + esc(d.notes || '') + '</textarea></div>' +
      '<button type="button" class="btn-link" style="margin-top:22px;color:var(--orange-deep)" id="delDossier">' + Lerna.icon('trash', 'ic-sm') + ' ' + t('ds.delete') + '</button>';
  }

  /* ---------------- Interactions ---------------- */
  var saveLater = Lerna.debounce(function (fn) { fn(); }, 400);
  function flashSaved() { var e = $('savedLbl'); if (e) { e.textContent = t('ds.saved') + ' ✓'; setTimeout(function () { if (e) e.textContent = ''; }, 1400); } }
  function coach(kind, content, context, outId, onReply) {
    var out = $(outId);
    if (!Lerna.config.live) { out.innerHTML = '<div class="notice" style="margin-top:12px">' + Lerna.icon('info') + '<div>' + t('ds.offline') + '</div></div>'; return; }
    if (Lerna.config.premiumEnabled && quota(kind) <= 0) { out.innerHTML = '<div class="notice" style="margin-top:12px">' + Lerna.icon('lock') + '<div>' + t('ds.quotaOut') + ' <a class="orange bold" href="premium.html?src=dossier">Premium →</a></div></div>'; return; }
    out.innerHTML = '<div class="feedback"><div class="feedback-h">' + Lerna.seal() + t('ds.lernaSays') + '</div>' + Lerna.thinking('inline') + '</div>';
    Lerna.api('/api/chat', { mode: kind, lang: Lerna.lang, context: context, messages: [{ role: 'user', content: content }] }, { timeout: 45000 }).then(function (r) {
      if (r.ok && r.data && r.data.reply) { bump(kind); onReply(r.data.reply); out.innerHTML = feedbackHTML(r.data.reply); Lerna.sound.play('success'); Lerna.track(kind === 'lettre' ? 'letter_review' : 'interview_review', id); }
      else if (r.status === 429) { var q = store.get('lerna_coach', null) || { d: Lerna.today() }; q.d = Lerna.today(); q[kind] = COACH_FREE; store.set('lerna_coach', q); out.innerHTML = '<div class="notice" style="margin-top:12px">' + Lerna.icon('lock') + '<div>' + t('ds.quotaOut') + '</div></div>'; }
      else out.innerHTML = '<div class="notice" style="margin-top:12px">' + Lerna.icon('alert') + '<div>' + t('ds.aiError') + '</div></div>';
      var ql = $(kind === 'lettre' ? 'quotaL' : 'quotaI'); if (ql) ql.textContent = quotaLine(kind);
    });
  }
  function bindPanel() {
    var P = $('panel'), s = school();
    if (tab === 'etapes') {
      var gs = $('guideSel'); if (gs) gs.addEventListener('change', function () { var d = dossier(); d.guide = gs.value; save(d); renderDossier(); });
    }
    if (tab === 'lettre') {
      var ta = $('draft');
      ta.addEventListener('input', function () {
        $('wc').textContent = t('ds.words', { n: (ta.value.trim().match(/\S+/g) || []).length });
        $('checks').outerHTML = checksHTML(ta.value, s);
        saveLater(function () { var d = dossier(); d.letter = Object.assign(d.letter || {}, { draft: ta.value }); save(d); flashSaved(); });
      });
      $('askLetter').addEventListener('click', function () {
        var txt = ta.value.trim(); if ((txt.match(/\S+/g) || []).length < 40) { Lerna.toast(Lerna.lang === 'en' ? 'Write at least a few paragraphs first.' : 'Écris d’abord quelques paragraphes.'); return; }
        coach('lettre', txt, s.nom + ' (' + window.LERNA_COUNTRY_NAME(s.pays, 'fr') + ')', 'fbLetter', function (rep) { var d = dossier(); d.letter = Object.assign(d.letter || {}, { draft: ta.value, feedback: rep }); save(d); });
      });
    }
    if (tab === 'entretien') {
      var an = $('answer');
      an.addEventListener('input', function () { saveLater(function () { var d = dossier(); d.interview = d.interview || {}; d.interview['q' + qIdx] = Object.assign(d.interview['q' + qIdx] || {}, { answer: an.value }); save(d); }); });
      $('askInterview').addEventListener('click', function () {
        var txt = an.value.trim(); if ((txt.match(/\S+/g) || []).length < 15) { Lerna.toast(Lerna.lang === 'en' ? 'Write a fuller answer first.' : 'Écris d’abord une réponse plus complète.'); return; }
        var q = L(window.LERNA_INTERVIEW_QS[qIdx]);
        coach('entretien', 'Question : ' + q + '\nMa réponse : ' + txt, s.nom, 'fbInterview', function (rep) { var d = dossier(); d.interview = d.interview || {}; d.interview['q' + qIdx] = { answer: an.value, feedback: rep }; save(d); });
      });
    }
    if (tab === 'cv') {
      P.addEventListener('input', function (e) {
        var k = e.target.getAttribute('data-cv'); if (!k) return;
        var cv = cvData(); cv[k] = e.target.value; store.set('lerna_cv', cv); $('cvHost').innerHTML = cvSheet(cv);
      });
      $('cvPrint').addEventListener('click', function () { Lerna.track('cv_print'); window.print(); });
    }
    if (tab === 'reco') {
      P.addEventListener('input', function (e) {
        var k = e.target.getAttribute('data-reco'); if (!k) return;
        var d = dossier(); d.reco = Object.assign(d.reco || {}, {}); d.reco[k] = e.target.value; save(d);
        var txt = recoText(d.reco, s); $('recoTpl').textContent = txt;
        $('recoMail').href = 'mailto:?subject=' + encodeURIComponent((Lerna.lang === 'en' ? 'Reference letter — ' : 'Lettre de recommandation — ') + s.nom) + '&body=' + encodeURIComponent(txt);
      });
      $('recoCopy').addEventListener('click', function () {
        var txt = $('recoTpl').textContent;
        var ok = function () { Lerna.toast(t('ds.copied')); Lerna.sound.play('select'); };
        if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function () {}); else ok();
      });
    }
    if (tab === 'budget' && Lerna.isPremium()) {
      P.addEventListener('input', function (e) {
        var k = e.target.getAttribute('data-bg'); if (!k) return;
        var d = dossier(), v = budgetVals(), n = parseFloat(String(e.target.value).replace(',', '.'));
        v[k] = n >= 0 ? n / rate() : 0;
        d.budget = v; save(d);
        $('bgTotal').textContent = Lerna.money(budgetTotals(v).total);
        $('bgVerdict').innerHTML = verdictHTML(v);
      });
      Lerna.track('budget_open', id);
    }
    if (tab === 'suivi') {
      P.addEventListener('input', function (e) {
        var k = e.target.getAttribute('data-track'); if (!k) return;
        saveLater(function () { var d = dossier(); d[k] = e.target.value; save(d); });
      });
      $('delDossier').addEventListener('click', function () {
        if (!confirm(t('ds.deleteConfirm'))) return;
        Lerna.dossiers.remove(id); location.href = 'dossier.html';
      });
    }
  }

  /* Sans compte : tout ce qui modifie le dossier envoie vers l'inscription (lecture du guide libre) */
  function guestGuard(e) {
    if (!id || Lerna.isLogged()) return;
    var hit = e.type === 'focusin' ? e.target.closest('#panel textarea, #panel input') : e.target.closest('[data-step], [data-doc], [data-status], #askLetter, #askInterview, #cvPrint, #recoCopy, #recoMail, #delDossier, #guideSel');
    if (!hit) return;
    e.preventDefault(); e.stopPropagation();
    if (e.type === 'focusin') hit.blur();
    Lerna.requireAccount({ type: 'dossier', id: id });
  }
  document.addEventListener('click', guestGuard, true);
  document.addEventListener('focusin', guestGuard, true);

  Lerna.ready(function () {
    var coffre = !!Lerna.param('coffre');
    if (window.LERNA_OPPS_SYNC) window.LERNA_OPPS_SYNC().then(function (changed) { if (changed && !coffre && (!id || tab === 'etapes')) render(); });
    function render() { if (coffre) window.LERNA_COFFRE.open($('root')); else if (id) renderDossier(); else renderList(); }
    render();
    document.addEventListener('click', function (e) {
      var el;
      if ((el = e.target.closest('[data-pick]'))) return startDossier(el.getAttribute('data-pick'));
      if ((el = e.target.closest('[data-pickreco]'))) return startAny(fromReco(+el.getAttribute('data-pickreco')));
      if ((el = e.target.closest('[data-rmvoeu]'))) {
        var dv = dossier(), k = el.getAttribute('data-rmvoeu');
        dv.voeux = (dv.voeux || []).filter(function (x) { return x.k !== k; }); save(dv);
        Lerna.sound.play('click'); renderDossier(); return;
      }
      if (e.target.closest('#guestStart')) { e.preventDefault(); Lerna.requireAccount({ type: 'dossier', id: id }); return; }
      if ((el = e.target.closest('[data-tab]'))) {
        tab = el.getAttribute('data-tab'); history.replaceState(null, '', '#' + tab);
        Lerna.qsa('[data-tab]').forEach(function (b) { var on = b === el; b.classList.toggle('active', on); b.setAttribute('aria-selected', String(on)); });
        Lerna.sound.play('click'); renderPanel(); return;
      }
      if ((el = e.target.closest('[data-step]'))) {
        Lerna.pop(el);
        var d = dossier(), k = el.getAttribute('data-step'); d.steps = d.steps || {};
        var now = !(d.steps[k] && d.steps[k].done);
        d.steps[k] = Object.assign(d.steps[k] || {}, { done: now, at: now ? new Date().toISOString() : null });
        save(d);
        if (now) { Lerna.track('dossier_step', id + ':' + k); Lerna.sound.play('success'); }
        var g = guide(d), p = progress(d, g);
        if (now && p.done === p.total) Lerna.celebrate({ img: 'trophy', title: t('ds.allDone'), text: '' });
        renderDossier(); return;
      }
      if ((el = e.target.closest('[data-doc]'))) {
        var d2 = dossier(); d2.docs = d2.docs || {}; d2.docs[el.getAttribute('data-doc')] = el.getAttribute('data-v'); save(d2);
        Lerna.sound.play('select'); renderPanel(); return;
      }
      if ((el = e.target.closest('[data-q]'))) { qIdx = +el.getAttribute('data-q'); renderPanel(); return; }
      if ((el = e.target.closest('[data-status]'))) {
        var d3 = dossier(), st = el.getAttribute('data-status'); d3.status = st; save(d3);
        Lerna.track('dossier_status', id + ':' + st);
        if (st === 'accepted') Lerna.celebrate({ img: 'party', title: t('ds.accepted'), text: t('ds.acceptedText') });
        else Lerna.sound.play('select');
        renderPanel(); return;
      }
    });
    document.addEventListener('change', function (e) {
      var el;
      if ((el = e.target.closest('#pickAll')) && el.value) return startDossier(el.value);
      if ((el = e.target.closest('[data-mydate]'))) {
        var d = dossier(), k = el.getAttribute('data-mydate'); d.steps = d.steps || {}; d.steps[k] = Object.assign(d.steps[k] || {}, { date: el.value }); save(d);
        Lerna.toast(t('ds.saved'));
      }
    });
    Lerna.onLang(render);
    Lerna.on('lerna:dossier', Lerna.debounce(function () { if (!id && !coffre) renderList(); }, 200));
  });
})();
</script>
</body>
</html>
