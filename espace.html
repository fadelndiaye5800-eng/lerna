<style>
  .sp { padding: 30px 0 70px; }
  .gate { min-height: 50vh; display: flex; align-items: center; justify-content: center; }
  .prof { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .prof .avatar { width: 72px; height: 72px; font-size: 1.6rem; }
  .prof-info { flex: 1; min-width: 180px; }
  .prof-info h1 { font-size: clamp(1.5rem, 4.4vw, 2.1rem); }
  .prof-info p { color: var(--muted); font-size: .92rem; margin-top: 4px; }
  .complete { margin-top: 18px; }
  .complete-top { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
  .complete-top strong { color: var(--orange); }
  .tabs-wrap { position: sticky; top: var(--nav-h); z-index: 40; background: var(--bg); margin: 22px 0 6px; }
  .blk { margin-top: 22px; }
  .blk-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .blk-head h2 { font-size: clamp(1.25rem, 3.4vw, 1.6rem); display: flex; align-items: center; gap: 10px; }
  .blk-head h2 .ic { color: var(--orange); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row-item { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--white); border: 1.5px solid var(--cream-dark); border-radius: 16px; }
  .row-item .grow { flex: 1; min-width: 0; }
  .row-item h4 { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; }
  .row-item .sub { font-size: .82rem; color: var(--muted); margin-top: 2px; }
  .score-pill { font-family: var(--font-head); font-weight: 800; color: var(--orange); font-size: 1.15rem; flex-shrink: 0; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: var(--brown); flex-shrink: 0; }
  .icon-btn:hover { background: var(--cream-dark); }
  .flag { font-size: 1.5rem; flex-shrink: 0; }
  .row-item .flag-img { width: 34px; height: 34px; }
  .gridx { display: grid; gap: 16px; }
  @media (min-width: 900px) { .gridx { grid-template-columns: 1fr 1fr; } }
  .mini-cal { display: flex; flex-direction: column; gap: 8px; font-size: .92rem; }
  .mini-cal li { list-style: none; display: flex; gap: 10px; }
  .mini-cal li::before { content: '●'; color: var(--orange); font-size: .7rem; margin-top: 4px; }
  .news li { list-style: none; padding: 10px 0; border-bottom: 1px solid var(--cream-dark); font-size: .92rem; }
  .news li:last-child { border-bottom: none; }
  .res-links a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--cream-dark); text-decoration: none; font-weight: 600; }
  .res-links a:last-child { border-bottom: none; }
  .res-links a:hover { color: var(--orange-deep); }

  /* Chat */
  .chat { display: flex; flex-direction: column; height: min(68vh, 620px); background: var(--white); border: 1.5px solid var(--cream-dark); border-radius: 20px; overflow: hidden; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
  .msg { max-width: 86%; padding: 12px 16px; border-radius: 18px; font-size: .94rem; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot { background: var(--cream); border: 1px solid var(--cream-dark); align-self: flex-start; border-bottom-left-radius: 6px; }
  .msg.me { background: var(--orange); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
  .msg.typing { color: var(--muted); font-style: italic; display: flex; align-items: center; gap: 8px; }
  .chat-sugg { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; border-top: 1px solid var(--cream-dark); scrollbar-width: none; }
  .chat-sugg::-webkit-scrollbar { display: none; }
  .chat-sugg button { flex-shrink: 0; font-size: .82rem; font-weight: 600; padding: 8px 12px; border-radius: 99px; background: var(--cream); border: 1.5px solid var(--cream-dark); white-space: nowrap; }
  .chat-sugg button:hover { border-color: var(--orange); }
  .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--cream-dark); background: var(--cream); }
  .chat-form .input { padding: 12px 16px; border-radius: 99px; }
  .chat-form .btn { padding: 0; width: 48px; height: 48px; min-height: 48px; border-radius: 50%; flex-shrink: 0; }
  .chat-quota { font-size: .8rem; color: var(--muted); margin-top: 8px; text-align: right; }

  .cmp-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .cmp-table th, .cmp-table td { padding: 11px 10px; border-bottom: 1px solid var(--cream-dark); text-align: left; vertical-align: top; }
  .cmp-table th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; width: 30%; }
  .cmp-table td { width: 35%; }
  .cmp-table .win { color: var(--orange-deep); font-weight: 700; }
  .prem-lock { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--cream-dark); border-radius: 16px; padding: 16px 18px; }
  .prem-lock .grow { flex: 1; min-width: 180px; font-size: .92rem; }
  .status-sel { border: 1.5px solid var(--cream-darker); border-radius: 99px; padding: 6px 10px; font-size: .8rem; font-weight: 600; background: var(--white); color: var(--brown); }
  .form-inline { display: grid; gap: 10px; grid-template-columns: 1fr; margin-top: 12px; }
  @media (min-width: 640px) {
    .form-inline { grid-template-columns: 2fr 1fr 1fr auto; align-items: end; }
    .form-inline.cmp-form { grid-template-columns: 1fr 1fr auto; }
    .form-inline.rem-form { grid-template-columns: 2fr 1fr auto; }
  }
  .cmp-table { table-layout: fixed; word-break: break-word; }
  @media (max-width: 560px) {
    .cmp-table { font-size: .8rem; }
    .cmp-table th, .cmp-table td { padding: 9px 6px; }
    .cmp-table th { width: 28%; font-size: .66rem; letter-spacing: .02em; }
  }
  .acc-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--cream-dark); flex-wrap: wrap; }
  .acc-row:last-child { border-bottom: none; }
  .danger { color: var(--orange-deep); border-color: rgba(184, 74, 6, .35); }
  .danger:hover { background: var(--orange-deep); color: var(--bg); border-color: var(--orange-deep); }
  .me-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0 6px; }
  .me-grid a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px 6px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--cream-dark); text-decoration: none; color: var(--brown); font-weight: 600; font-size: .78rem; text-align: center; line-height: 1.2; }
  .me-grid a .ic { width: 22px; height: 22px; color: var(--orange); }
  .me-grid a:active { transform: scale(.97); }
</style>

(function () {

    h += '<section class="blk"><div class="blk-head"><h2>' + Lerna.icon('bookmark') + t('sp.savedOpps') + '</h2></div>' +

  /* ---------- Assistant IA ---------- */
  function chatHistory() { return store.get('lerna_chat', []); }

  function localAnswer(q) {

    var pool = schoolPool();

      if (pool.length < 2 || !answers) return t('sp.a4none');
      var A = pool[0], B = pool[1], sa = window.LernaEngine.compat(A.id, answers, Lerna.lang), sb = window.LernaEngine.compat(B.id, answers, Lerna.lang);
      var dur = function (s) { return t('common.years', { n: s.duree[0] }) + (s.duree[1] !== s.duree[0] ? '–' + s.duree[1] : ''); };
      return t('sp.a4', { a: A.nom, b: B.nom, sa: sa, sb: sb, fa: feeTxt(A), fb: feeTxt(B), da: dur(A), db: dur(B), wa: L(A.faibles[0]).toLowerCase(), wb: L(B.faibles[0]).toLowerCase(), win: sa >= sb ? A.nom : B.nom });

    var h = '<section class="blk"><div class="blk-head"><h2>' + Lerna.icon('heart') + t('sp.favs') + '</h2><a class="btn-link" href="explorer.html">' + t('sp.explore') + '</a></div>';
    h += favs.length ? '<div class="list">' + favs.map(function (s) {
      return '<div class="row-item">' + Lerna.flag(s.pays, 'flag-img') + '<a class="grow" style="text-decoration:none" href="ecole.html?id=' + s.id + '"><h4>' + esc(s.nom) + '</h4><div class="sub">' + esc(s.ville) + ' · ' + feeTxt(s) + (fee(s) ? ' ' + t('common.perYear') : '') + '</div></a>' +
        '<button type="button" class="icon-btn" data-unfav="' + s.id + '" aria-label="' + esc(t('common.favRemoved')) + '">' + Lerna.icon('trash', 'ic-sm') + '</button></div>';
    }).join('') + '</div>' : '<div class="empty">' + Lerna.icon('heart') + '<h4>' + t('sp.noFavs') + '</h4><p>' + t('sp.noFavsSub') + '</p></div>';
    h += '</section>';
    // Comparateur
    var pool = schoolPool();
    h += '<section class="blk"><div class="blk-head"><h2>' + Lerna.icon('columns') + t('sp.cmpTitle') + '</h2></div>';
    if (!Lerna.isPremium()) {
      h += '<div class="prem-lock">' + Lerna.icon('lock', 'ic-lg') + '<div class="grow">' + t('sp.cmpPremium') + '</div><a class="btn btn-brown btn-sm" href="premium.html">' + t('sp.unlock') + '</a></div>';
    } else if (pool.length < 2) {
      h += '<p class="muted">' + t('sp.cmpNeed') + '</p>';
    } else {
      var opts = function (sel) { return pool.map(function (s) { return '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + esc(s.nom) + '</option>'; }).join(''); };
      h += '<div class="card"><div class="form-inline cmp-form">' +
        '<div class="field"><label for="cmpA">' + t('sp.cmpA') + '</label><select class="select" id="cmpA">' + opts(pool[0].id) + '</select></div>' +
        '<div class="field"><label for="cmpB">' + t('sp.cmpB') + '</label><select class="select" id="cmpB">' + opts(pool[1].id) + '</select></div>' +
        '<button type="button" class="btn btn-primary" id="cmpGo">' + t('sp.cmpGo') + '</button></div><div id="cmpOut" style="margin-top:18px;overflow-x:auto"></div></div>';
    }
    return h + '</section>';
  }
  function compareTable(a, b) {
    var A = window.LERNA_SCHOOL(a), B = window.LERNA_SCHOOL(b);
    if (!A || !B) return '';
    var tot = function (s) { return fee(s) === null ? null : fee(s) + (s.inscription || 0) + (s.type === 'online' ? 0 : 12 * (s.logement[0] + s.vie[0])); };
    var sa = answers ? window.LernaEngine.compat(A.id, answers, Lerna.lang) : null, sb = answers ? window.LernaEngine.compat(B.id, answers, Lerna.lang) : null;
    var typ = function (s) { return t(s.type === 'public' ? 'common.public' : s.type === 'private' ? 'common.private' : 'common.online'); };
    var langs = function (s) { return s.langues.map(function (l) { return ({ fr: 'FR', en: 'EN', de: 'DE', ar: 'AR' })[l] || l.toUpperCase(); }).join(' · '); };
    var row = function (label, va, vb, better) {
      return '<tr><th scope="row">' + label + '</th><td class="' + (better === 'a' ? 'win' : '') + '">' + va + '</td><td class="' + (better === 'b' ? 'win' : '') + '">' + vb + '</td></tr>';
    };
    var lower = function (x, y) { if (x === null || y === null) return ''; return x < y ? 'a' : y < x ? 'b' : ''; };
    var higher = function (x, y) { return x > y ? 'a' : y > x ? 'b' : ''; };
    return '<table class="cmp-table"><thead><tr><th></th><th>' + esc(A.nom) + '</th><th>' + esc(B.nom) + '</th></tr></thead><tbody>' +
      (sa !== null ? row(t('sp.cScore'), sa + '/100', sb + '/100', higher(sa, sb)) : '') +
      row(t('sp.cFee'), feeTxt(A), feeTxt(B), lower(fee(A), fee(B))) +
      row(t('sp.cTotal'), tot(A) === null ? t('sp.feeTodo') : t('sp.from') + ' ≈ ' + Lerna.money(tot(A)), tot(B) === null ? t('sp.feeTodo') : t('sp.from') + ' ≈ ' + Lerna.money(tot(B)), lower(tot(A), tot(B))) +
      row(t('sp.cDur'), A.duree[0] + '–' + A.duree[1], B.duree[0] + '–' + B.duree[1], '') +
      row(t('sp.cLang'), langs(A), langs(B), '') +
      row(t('sp.cType'), typ(A), typ(B), '') +
      row(t('sp.cCity'), esc(A.ville), esc(B.ville), '') +
      row(t('sp.cIntl'), t('sp.lvl' + A.intl), t('sp.lvl' + B.intl), higher(A.intl, B.intl)) +
      row(t('sp.cCampus'), t('sp.camp' + A.campus), t('sp.camp' + B.campus), higher(A.campus, B.campus)) +
      row(t('sp.cWeak'), esc(L(A.faibles[0])), esc(L(B.faibles[0])), '') +
      '</tbody></table>';
  }

  /* ---------- Candidatures + rappels (Premium) ---------- */
  function panelTrack() {
    var prem = Lerna.isPremium();
    var tr = store.get('lerna_tracker', []), rem = store.get('lerna_reminders', []);
    var stOpts = function (sel) { return [1, 2, 3, 4, 5].map(function (i) { return '<option value="st' + i + '"' + (sel === 'st' + i ? ' selected' : '') + '>' + t('sp.st' + i) + '</option>'; }).join(''); };
    var h = '<section class="blk"><div class="blk-head"><div><h2>' + Lerna.icon('file') + t('sp.trackTitle') + '</h2><p class="small muted" style="margin-top:4px">' + t('sp.trackSub') + '</p></div></div>';
    if (!prem) h += '<div class="prem-lock">' + Lerna.icon('lock', 'ic-lg') + '<div class="grow">' + t('sp.trackPremium') + '</div><a class="btn btn-brown btn-sm" href="premium.html">' + t('sp.unlock') + '</a></div>';
    else {
      h += tr.length ? '<div class="list">' + tr.map(function (x, i) {
        return '<div class="row-item"><div class="grow"><h4>' + esc(x.name) + '</h4><div class="sub">' + (x.date ? Lerna.fmtDate(x.date) : '—') + '</div></div>' +
          '<select class="status-sel" data-track-status="' + i + '" aria-label="Statut">' + stOpts(x.status) + '</select>' +
          '<button type="button" class="icon-btn" data-track-del="' + i + '" aria-label="Supprimer">' + Lerna.icon('trash', 'ic-sm') + '</button></div>';
      }).join('') + '</div>' : '<p class="muted">' + t('sp.noTrack') + '</p>';
      h += '<form class="form-inline" id="trackForm"><div class="field"><label for="trName">' + t('sp.trackName') + '</label><input class="input" id="trName" maxlength="120" placeholder="' + esc(t('sp.trackNamePh')) + '" required></div>' +
        '<div class="field"><label for="trDate">' + t('sp.trackDate') + '</label><input class="input" id="trDate" type="date"></div>' +
        '<div class="field"><label for="trStatus">Statut</label><select class="select" id="trStatus">' + stOpts('st1') + '</select></div>' +
        '<button class="btn btn-primary" type="submit">' + Lerna.icon('plus', 'ic-sm') + t('sp.trackAdd') + '</button></form>';
    }
    h += '</section><section class="blk"><div class="blk-head"><h2>' + Lerna.icon('bell') + t('sp.remTitle') + '</h2></div>';
    if (!prem) h += '<div class="prem-lock">' + Lerna.icon('lock', 'ic-lg') + '<div class="grow">' + t('sp.remPremium') + '</div><a class="btn btn-brown btn-sm" href="premium.html">' + t('sp.unlock') + '</a></div>';
    else {
      h += rem.length ? '<div class="list">' + rem.map(function (x, i) {
        return '<div class="row-item"><span class="icon-btn" aria-hidden="true">' + Lerna.icon('bell') + '</span><div class="grow"><h4>' + esc(x.title) + '</h4><div class="sub">' + Lerna.fmtDate(x.date) + '</div></div><button type="button" class="icon-btn" data-rem-del="' + i + '" aria-label="Supprimer">' + Lerna.icon('trash', 'ic-sm') + '</button></div>';
      }).join('') + '</div>' : '';
      h += '<form class="form-inline" id="remForm" style="grid-template-columns:2fr 1fr auto"><div class="field"><label class="sr-only" for="remTitle">' + t('sp.remTitle') + '</label><input class="input" id="remTitle" maxlength="120" placeholder="' + esc(t('sp.remPh')) + '" required></div>' +
        '<div class="field"><label class="sr-only" for="remDate">Date</label><input class="input" id="remDate" type="date" required></div><button class="btn btn-primary" type="submit">' + Lerna.icon('plus', 'ic-sm') + t('sp.trackAdd') + '</button></form>';
    }
    return h + '</section>';
  }

  /* ---------- Compte ---------- */
  function panelAccount() {
    var prem = Lerna.isPremium() && user.is_premium;
    var until = user.premium_expiry ? t('sp.accUntil', { d: Lerna.fmtDate(user.premium_expiry) }) : '';
    return '<section class="blk"><div class="card">' +
      '<div class="acc-row"><div><h4>' + t('sp.accPlan') + '</h4><p class="small muted">' + (prem ? t('sp.accPrem', { until: until }) : t('sp.accFree')) + '</p></div>' +
        (prem ? (user.portal_url ? '<a class="btn btn-ghost btn-sm" href="' + esc(user.portal_url) + '" target="_blank" rel="noopener">' + t('sp.manage') + '</a>' : '') : '<a class="btn btn-primary btn-sm" href="premium.html">' + t('sp.upgrade') + '</a>') + '</div>' +
      '<div class="acc-row"><h4>' + t('sp.accLang') + '</h4><div class="lang-switch"><button type="button" data-lang="fr" class="' + (Lerna.lang === 'fr' ? 'active' : '') + '">FR</button><button type="button" data-lang="en" class="' + (Lerna.lang === 'en' ? 'active' : '') + '">EN</button></div></div>' +
      '<div class="acc-row"><h4>' + t('sp.accSound') + '</h4><button type="button" class="chip" id="soundBtn">' + Lerna.icon(Lerna.sound.enabled ? 'volume' : 'volumeX', 'ic-sm') + ' ' + t(Lerna.sound.enabled ? 'sp.on' : 'sp.off') + '</button></div>' +
      (Lerna.auth.mode === 'supabase' ? '<div class="acc-row"><h4>' + t('sp.accPw') + '</h4><button type="button" class="btn btn-ghost btn-sm" id="pwBtn">' + t('sp.accPwBtn') + '</button></div>' : '') +
      '<div class="acc-row"><h4>' + t('sp.accExport') + '</h4><button type="button" class="btn btn-ghost btn-sm" id="exportBtn">' + Lerna.icon('download', 'ic-sm') + t('sp.accExportBtn') + '</button></div>' +
      '<div class="acc-row"><h4>' + t('sp.accLogout') + '</h4><button type="button" class="btn btn-ghost btn-sm" data-logout>' + Lerna.icon('logout', 'ic-sm') + t('sp.accLogout') + '</button></div>' +
      '<div class="acc-row"><h4>' + t('sp.accDelete') + '</h4><button type="button" class="btn btn-ghost btn-sm danger" id="delBtn">' + Lerna.icon('trash', 'ic-sm') + t('sp.accDelete') + '</button></div>' +
      '</div>' + (Lerna.auth.mode === 'demo' ? '<div class="notice" style="margin-top:16px">' + Lerna.icon('info') + '<div class="small">' + t('common.demoNotice') + '</div></div>' : '') + '</section>';
  }

  var TABS = [['home', 'sp.tHome', panelHome], ['ia', 'sp.tIA', panelIA], ['ecoles', 'sp.tSchools', panelSchools], ['suivi', 'sp.tTrack', panelTrack], ['compte', 'sp.tAccount', panelAccount]];

  function renderPanel() {
    var def = TABS.filter(function (x) { return x[0] === tab; })[0] || TABS[0]; tab = def[0];
    Lerna.qsa('.tab').forEach(function (b) { var on = b.getAttribute('data-tab') === tab; b.classList.toggle('active', on); b.setAttribute('aria-selected', String(on)); });
    var p = $('panel'); p.innerHTML = def[2](); p.classList.remove('active'); void p.offsetWidth; p.classList.add('active');
    if (tab === 'ia') { var m = $('msgs'); if (m) m.scrollTop = m.scrollHeight; }
    if (tab === 'ecoles' && $('cmpGo')) $('cmpOut').innerHTML = compareTable($('cmpA').value, $('cmpB').value);
  }
  function render() {
    var c = completion();
    var where = [user.pays ? window.LERNA_COUNTRY_NAME(user.pays) : '', user.niveau].filter(Boolean).join(' · ');
    $('root').innerHTML =
      '<section class="card"><div class="prof"><span class="avatar">' + esc(Lerna.initials(user)) + '</span><div class="prof-info">' +
        '<h1>' + esc(Lerna.greeting(Lerna.displayName(user) || user.email.split('@')[0])) + '</h1>' +
        '<p>' + esc(where || user.email) + ' · <span class="badge ' + (Lerna.isPremium() && user.is_premium ? 'badge-orange' : 'badge-cream') + '" style="vertical-align:middle">' + t(Lerna.isPremium() && user.is_premium ? 'sp.premium' : 'sp.free') + '</span></p></div>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="editBtn">' + Lerna.icon('edit', 'ic-sm') + t('sp.edit') + '</button></div>' +
        '<div class="complete"><div class="complete-top"><span>' + t('sp.complete') + '</span><strong>' + c + '%</strong></div><div class="bar"><span style="width:' + c + '%"></span></div></div>' +
        (Lerna.auth.mode === 'supabase' && user.verified === false ? '<div class="notice" style="margin-top:14px">' + Lerna.icon('mail') + '<div class="small">' + t('sp.verifyMail') + '</div></div>' : '') +
      '</section>' +
      /* Raccourcis du compte, comme l'onglet « Moi » des grandes applis */
      '<nav class="me-grid" aria-label="' + esc(t('nav.account')) + '">' +
        [['dossier.html', 'folder', 'nav.dossiers'], ['premium.html', 'gem', 'nav.premium'], ['parametres.html', 'settings', 'nav.settings'], ['contact.html', 'help', 'nav.help']].map(function (x) {
          return '<a href="' + x[0] + '">' + Lerna.icon(x[1]) + '<span>' + esc(t(x[2])) + '</span></a>';
        }).join('') + '</nav>' +
      '<div class="tabs-wrap"><div class="tabs" role="tablist">' + TABS.map(function (x) { return '<button type="button" class="tab" role="tab" data-tab="' + x[0] + '">' + t(x[1]) + '</button>'; }).join('') + '</div></div>' +
      '<div class="tab-panel active" id="panel" role="tabpanel"></div>';
    renderPanel();
  }

  function editProfile() {
    Lerna.modal('<div class="modal-head"><h3>' + t('sp.editTitle') + '</h3><button class="modal-close" data-close aria-label="' + t('common.close') + '">' + Lerna.icon('x') + '</button></div>' +
      '<form id="editForm" class="stack">' +
        '<div class="field"><label for="ePrenom">' + t('sp.prenom') + '</label><input class="input" id="ePrenom" maxlength="60" value="' + esc(user.prenom) + '"></div>' +
        '<div class="field"><label for="eNom">' + t('sp.nom') + '</label><input class="input" id="eNom" maxlength="60" value="' + esc(user.nom) + '"></div>' +
        '<div class="field"><label for="ePseudo">' + t('sp.pseudo') + '</label><input class="input" id="ePseudo" maxlength="24" autocomplete="nickname" value="' + esc(user.pseudo || '') + '" placeholder="' + esc(t('sp.pseudoPh')) + '"></div>' +
        '<div class="field"><label for="ePays">' + t('sp.pays') + '</label><select class="select" id="ePays"><option value="">—</option>' + window.LERNA_COUNTRY_OPTIONS(Lerna.lang, user.pays) + '</select></div>' +
        '<div class="field"><label for="eNiveau">' + t('sp.niveau') + '</label><input class="input" id="eNiveau" maxlength="60" value="' + esc(user.niveau) + '"></div>' +
        '<div class="field"><label for="eBio">' + t('sp.bio') + '</label><textarea class="textarea" id="eBio" maxlength="150" style="min-height:90px" placeholder="' + esc(t('sp.bioPh')) + '">' + esc(user.bio || '') + '</textarea></div>' +
        '<button type="submit" class="btn btn-primary btn-block">' + t('common.save') + '</button></form>', function (m, close) {
      m.querySelector('#editForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var v = function (id) { return m.querySelector(id).value.trim(); };
        Lerna.auth.updateProfile({ prenom: v('#ePrenom'), nom: v('#eNom'), pseudo: v('#ePseudo').slice(0, 24), pays: v('#ePays'), niveau: v('#eNiveau'), bio: v('#eBio').slice(0, 150) })
          .then(function () { user = Lerna.auth.user; close(); render(); Lerna.toast(t('sp.saved')); Lerna.sound.play('success'); })
          .catch(function () { Lerna.toast(t('common.error')); });
      });
    });
  }
  function exportData() { Lerna.account.exportData(); }
  function wipeLocal() { Lerna.account.wipeLocal(); }
  function deleteAccount() {
    Lerna.modal('<div class="modal-head"><h3>' + t('sp.delTitle') + '</h3><button class="modal-close" data-close aria-label="' + t('common.close') + '">' + Lerna.icon('x') + '</button></div><p>' + t('sp.delText') + '</p>' +
      '<div class="row" style="margin-top:22px"><button type="button" class="btn btn-ghost" data-close>' + t('common.cancel') + '</button><button type="button" class="btn btn-brown" id="delYes">' + t('sp.delConfirm') + '</button></div>', function (m) {
      m.querySelector('#delYes').addEventListener('click', function () { Lerna.account.remove(this, t('sp.deleted')); });
    });
  }
  /* Synchronisation : un compte fraîchement créé récupère les résultats faits avant inscription */
  function syncToCloud() {
    var A = Lerna.auth; if (A.mode !== 'supabase' || !A.user) return;
    Lerna.favs.pull().then(function () { if (tab === 'ecoles') renderPanel(); });
    window.LERNA_OPPS_UNLOCK().then(function (ok) { if (ok && tab === 'home') renderPanel(); });
  }

  Lerna.ready(function () {
    Lerna.requireAuth('espace.html').then(function (ok) {
      if (!ok) return;
      user = Lerna.auth.user;
      render();
      syncToCloud();
      var pending = Lerna.store.sget('lerna_ask', null);
      if (pending && tab === 'ia') { Lerna.store.sset('lerna_ask', null); setTimeout(function () { ask(pending); }, 300); }
    });
    document.addEventListener('click', function (e) {
      var el;
      if ((el = e.target.closest('.tab'))) { tab = el.getAttribute('data-tab'); history.replaceState(null, '', '#' + tab); renderPanel(); Lerna.sound.play('click'); return; }
      if ((el = e.target.closest('[data-goto]'))) { tab = el.getAttribute('data-goto'); history.replaceState(null, '', '#' + tab); renderPanel(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (e.target.closest('#editBtn')) return editProfile();
      if ((el = e.target.closest('[data-ask]'))) return ask(el.getAttribute('data-ask'));
      if ((el = e.target.closest('[data-unfav]'))) { Lerna.favs.toggle(el.getAttribute('data-unfav')); renderPanel(); return; }
      if (e.target.closest('#cmpGo')) { $('cmpOut').innerHTML = compareTable($('cmpA').value, $('cmpB').value); Lerna.sound.play('click'); Lerna.track('compare'); return; }
      if ((el = e.target.closest('[data-track-del]'))) { var tr = store.get('lerna_tracker', []); tr.splice(+el.getAttribute('data-track-del'), 1); store.set('lerna_tracker', tr); renderPanel(); return; }
      if ((el = e.target.closest('[data-rem-del]'))) { var rm = store.get('lerna_reminders', []); rm.splice(+el.getAttribute('data-rem-del'), 1); store.set('lerna_reminders', rm); renderPanel(); return; }
      if (e.target.closest('#soundBtn')) { Lerna.sound.toggle(); renderPanel(); return; }
      if (e.target.closest('#exportBtn')) return exportData();
      if (e.target.closest('#delBtn')) return deleteAccount();
      if (e.target.closest('#pwBtn')) { Lerna.auth.resetPassword(user.email).then(function () { Lerna.toast(t('sp.accPwSent', { email: user.email }), 4000); }, function () { Lerna.toast(t('common.error')); }); }
    });
    document.addEventListener('change', function (e) {
      var s = e.target.closest('[data-track-status]');
      if (s) { var tr = store.get('lerna_tracker', []); tr[+s.getAttribute('data-track-status')].status = s.value; store.set('lerna_tracker', tr); if (s.value === 'st4') Lerna.sound.play('success'); }
    });
    document.addEventListener('submit', function (e) {
      if (e.target.id === 'chatForm') { e.preventDefault(); ask($('chatIn').value); }
      if (e.target.id === 'trackForm') {
        e.preventDefault(); var n = $('trName').value.trim(); if (!n) return;
        var tr = store.get('lerna_tracker', []); tr.push({ name: n.slice(0, 120), date: $('trDate').value, status: $('trStatus').value }); store.set('lerna_tracker', tr); renderPanel();
        Lerna.track('tracker_add');
      }
      if (e.target.id === 'remForm') {
        e.preventDefault(); var ti = $('remTitle').value.trim(), d = $('remDate').value; if (!ti || !d) return;
        var rm = store.get('lerna_reminders', []); rm.push({ title: ti.slice(0, 120), date: d }); rm.sort(function (a, b) { return a.date < b.date ? -1 : 1; }); store.set('lerna_reminders', rm); renderPanel();
      }
    });
    Lerna.onLang(function () { if (user) render(); });
    window.addEventListener('hashchange', function () {
      var h = (location.hash || '').replace('#', '');
      if (user && h && h !== tab) { tab = h; renderPanel(); }
    });
  });
})();
</script>
</body>
