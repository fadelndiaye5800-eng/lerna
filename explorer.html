        return q.every(function (w) { return hay.indexOf(w) !== -1; });
      });
      if (first) list.sort(function (a, b) { return (norm(b.n).indexOf(first) === 0) - (norm(a.n).indexOf(first) === 0); });
      return list.map(function (r) { return { k: 'A', r: r }; });
    });
  }

  /* ---------- Cartes ---------- */
  function avatar(sg, cc) { sg = String(sg || '·').slice(0, 5); return '<span class="u-av' + (sg.length > 3 ? ' sm' : '') + '" aria-hidden="true">' + esc(sg) + Lerna.flag(cc) + '</span>'; }
  function lernaCard(s) {
    var f = fee(s), fav = Lerna.favs.has(s.id), link = 'ecole.html?id=' + encodeURIComponent(s.id);
    var typeTxt = s.type === 'public' ? t('ex.bPub') : s.type === 'private' ? t('ex.bPriv') : t('ex.bOnline');
    var doms = s.domaines.slice(0, 3).map(function (d) { var x = window.LERNA_DOMAINS.filter(function (o) { return o.id === d; })[0]; return '<span>' + esc(x ? L(x.label) : d) + '</span>'; }).join('');
    return '<article class="card ucard"><div class="u-top">' + avatar(window.LERNA_SIGLE(s), s.pays) +
      '<div class="u-id"><h3><a href="' + link + '">' + esc(s.nom) + '</a></h3><div class="loc">' + esc(s.ville + (s.type === 'online' ? '' : ', ' + window.LERNA_COUNTRY_NAME(s.pays))) + '</div></div>' +
      '<button type="button" class="u-fav' + (fav ? ' on' : '') + '" data-fav="' + s.id + '" aria-pressed="' + fav + '" aria-label="' + esc(t('ex.fav')) + '">' + Lerna.icon('heart') + '</button></div>' +
      '<div class="u-tags"><span class="ok">' + esc(t('ex.ok')) + '</span><span>' + esc(typeTxt) + '</span>' + (f !== null ? '<span class="fee">' + esc(f === 0 ? t('common.free') : t('ex.from', { f: Lerna.money(f) })) + '</span>' : '') + doms + '</div>' +
      '<div class="acts"><a class="btn btn-brown btn-sm" href="' + link + '">' + esc(t('ex.see')) + '</a></div></article>';
  }
  function srcOf(r) {
    var x = r.x || {};
    if (r.s === 'officiel') { var l = A.idx && A.idx.listes && A.idx.listes[x.l]; return l ? L(l.autorite) : ''; }
    return { deqar: t('ex.sDeqar'), scorecard: x.acc ? x.acc : t('ex.sScore'), ofs: t('ex.sOfs'), cricos: t('ex.sCricos') }[r.s] || '';
  }
  function annCard(r) {
    var link = 'fiche.html?cc=' + encodeURIComponent(r.cc) + '&id=' + encodeURIComponent(r.i) + '&n=' + encodeURIComponent(r.n);
    var typeTxt = r.t === 'public' ? t('ex.bPub') : /^prive/.test(r.t || '') ? t('ex.bPriv') : '';
    var s = srcOf(r);
    return '<article class="card ucard"><div class="u-top">' + avatar(sigleOf(r.n), r.cc) +
      '<div class="u-id"><h3><a href="' + link + '">' + esc(r.n) + '</a></h3><div class="loc">' + esc([r.v, window.LERNA_COUNTRY_NAME(r.cc)].filter(Boolean).join(', ')) + '</div></div></div>' +
      '<div class="u-tags"><span class="ok">' + esc(t('ex.ok')) + '</span>' + (typeTxt ? '<span>' + esc(typeTxt) + '</span>' : '') + '</div>' +
      (s ? '<p class="u-src">' + esc(t('ex.src', { s: s })) + '</p>' : '') +
      '<div class="acts"><a class="btn btn-brown btn-sm" href="' + link + '">' + esc(t('ex.see')) + '</a></div></article>';
  }

  /* ---------- Partie 1 : écoles et universités (une seule liste ; les fiches les plus complètes d'abord) ---------- */
  function renderEcoles() {
    var my = ++A.seq;
    var lerna = lernaList();
    A.items = lerna;
    paintEcoles();
    annList().then(function (ann) {
      if (my !== A.seq) return;
      A.items = lerna.concat(ann);
      paintEcoles();
    }).catch(function () { if (my === A.seq && !lerna.length) $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('alert') + '<h4>' + esc(t('ex.mErr')) + '</h4></div>'; });
  }
  function paintEcoles() {
    var items = A.items, n = items.length;
    $('count').textContent = st.pays === 'ALL' ? t('ex.countN', { n: nf(n) }) : t('ex.countNc', { n: nf(n), c: window.LERNA_COUNTRY_NAME(st.pays) });
    $('note').hidden = !detailFilters();
    $('note').textContent = t('ex.detailNote');
    $('grid').innerHTML = n ? items.slice(0, st.show).map(function (it) { return it.k === 'L' ? lernaCard(it.s) : annCard(it.r); }).join('') :
      '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('search') + '<h4>' + esc(t('ex.none')) + '</h4><p>' + esc(t('ex.noneSub')) + '</p></div>';
    $('more').hidden = n <= st.show;
  }
  function sel(id, label, opts) {
    var v = st[id];
    return '<select class="fsel' + (v ? ' on' : '') + '" data-f="' + id + '" aria-label="' + esc(label) + '"><option value="">' + esc(label) + '</option>' +
      opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  }
  function budgetOpts() {
    if (Lerna.currency() === 'USD') return [['b1', t('ex.b1')], ['b2', t('ex.b2')], ['b3', t('ex.b3')], ['b4', t('ex.b4')], ['b5', t('ex.b5')]];
    var m = function (n) { return Lerna.money(n); }, en = Lerna.lang === 'en';
    return [['b1', (en ? 'Under ' : 'Moins de ') + m(500)], ['b2', m(500) + ' – ' + m(2000)], ['b3', m(2000) + ' – ' + m(5000)], ['b4', m(5000) + ' – ' + m(15000)], ['b5', (en ? 'Over ' : 'Plus de ') + m(15000)]];
  }
  /* Pays : fiches complètes + listes officielles ; le pays de la personne juste après « Tous les pays » */
  function countryOpts() {
    var set = { FR: 1 };
    S.forEach(function (s) { if (s.type !== 'online') set[s.pays] = 1; });
    if (A.idx) Object.keys(A.idx.countries).forEach(function (c) { set[c] = 1; });
    var me = Lerna.country();
    var list = Object.keys(set).map(function (c) { return [c, window.LERNA_COUNTRY_NAME(c)]; }).sort(function (a, b) { return a[1].localeCompare(b[1], Lerna.lang); });
    if (me && set[me]) list = [[me, window.LERNA_COUNTRY_NAME(me)]].concat(list.filter(function (x) { return x[0] !== me; }));
    return [['ALL', t('ex.allCountries')]].concat(list);
  }
  function renderFilters() {
    var c = countryOpts();
    $('filters').innerHTML =
      '<select class="fsel on" data-f="pays" aria-label="' + esc(t('ex.fCountry')) + '">' + c.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === st.pays ? ' selected' : '') + '>' + esc((o[0] === 'ALL' ? '🌍 ' : '') + o[1]) + '</option>'; }).join('') + '</select>' +
      sel('type', t('ex.fType'), [['public', t('common.public')], ['private', t('common.private')], ['online', t('common.online')]]) +
      sel('dom', t('ex.fDomain'), window.LERNA_DOMAINS.map(function (d) { return [d.id, L(d.label)]; })) +
      sel('budget', t('ex.fBudget'), budgetOpts()) +
      sel('duree', t('ex.fDuration'), [['2', t('ex.d2')], ['3', t('ex.d3')], ['4', t('ex.d4')], ['5', t('ex.d5')], ['6', t('ex.d6')]]) +
      sel('lang', t('ex.fLang'), [['fr', t('ex.lFr')], ['en', t('ex.lEn')], ['ar', t('ex.lAr')], ['other', t('ex.lOther')]]) +
      '<button type="button" class="reset" id="reset">' + t('ex.reset') + '</button>';
  }

  /* ---------- Partie 2 : formations en France (données ouvertes du ministère de l'Enseignement supérieur) ---------- */
  var DS = 'https://data.enseignementsup-recherche.gouv.fr/api/explore/v2.1/catalog/datasets/fr-esr-cartographie_formations_parcoursup';
  var F = { year: null, tf: '', reg: '', app: false, offset: 0, total: 0, facets: null, seq: 0, groups: [] };
  var FPER = 100;
  /* Établissement français qui a déjà sa fiche complète LERNA : on ouvre cette fiche-là */
  var lernaFR = (function () {
    var k = {}, h = {};
    S.forEach(function (s) { if (s.pays !== 'FR') return; String(s.nom).split(/\s+[—–-]\s+/).forEach(function (p) { var x = nkey(p); if (x.length >= 4) k[x] = s.id; }); var d = host(s.site); if (d) h[d] = s.id; });
    return function (g) { return k[nkey(g.n)] || (g.w && h[host(g.w)]) || null; };
  })();
  function odsq(v) { return '"' + String(v).replace(/\\/g, '').replace(/"/g, '') + '"'; }
  function fWhere() {
    var w = ['annee=' + odsq(F.year)];
    norm(st.q).replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/).filter(function (x) { return x.length > 1; }).slice(0, 5).forEach(function (x) { w.push(odsq(x)); });
    if (F.tf) w.push('tf=' + odsq(F.tf));
    if (F.reg) w.push('region=' + odsq(F.reg));
    if (F.app) w.push('app is not null');
    return w.join(' and ');
  }
  function fGet(path) { return fetch(DS + path, { headers: { Accept: 'application/json' } }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }); }
  function fInit() {
    if (F.facets) return Promise.resolve();
    return fGet('/facets?facet=annee').then(function (j) {
      var ys = (j.facets[0].facets || []).filter(function (x) { return x.count > 10000; }).map(function (x) { return x.value; }).sort();
      F.year = ys[ys.length - 1] || String(new Date().getFullYear());
      return fGet('/facets?facet=tf&facet=region&where=' + encodeURIComponent('annee=' + odsq(F.year)));
    }).then(function (j) {
      F.facets = {};
      j.facets.forEach(function (f) { F.facets[f.name] = f.facets.map(function (x) { return x.value; }); });
    });
  }
  function frFilters() {
    var f = F.facets || {};
    var opt = function (k, lbl, list) {
      return '<select class="fsel' + (F[k] ? ' on' : '') + '" data-fr="' + k + '" aria-label="' + esc(t(lbl)) + '"><option value="">' + esc(t(lbl)) + '</option>' +
        (list || []).map(function (v) { return '<option value="' + esc(v) + '"' + (F[k] === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>';
    };
    $('frFilters').innerHTML = opt('tf', 'ex.pAllTf', (f.tf || []).slice().sort(function (a, b) { return a.localeCompare(b, 'fr'); })) + opt('reg', 'ex.pAllReg', f.region) +
      '<button type="button" class="fsel btnf' + (F.app ? ' on' : '') + '" data-frapp>' + esc(t('ex.pApp')) + '</button>';
  }
  function frInfo() {
    var g = window.LERNA_GUIDE_FOR && window.LERNA_GUIDE_FOR({ adm: 'fr-public' }, Lerna.country(), answers);
    var d = Lerna.dossiers && Lerna.dossiers.get('p-france');
    if (d && d.guide && window.LERNA_GUIDES[d.guide]) g = window.LERNA_GUIDES[d.guide];
    var n = d ? (d.voeux || []).length : 0;
    $('frInfo').innerHTML = (g ? t('ex.frInfo', { g: esc(L(g.label).replace(/^France — /, '')) }) : '') +
      (d ? '<div style="margin-top:8px"><a href="dossier.html?ecole=p-france">' + esc(t('ex.frDossier', { n: n })) + '</a></div>' : '');
  }
  var arr1 = function (v) { return Array.isArray(v) ? v.join(' · ') : (v || ''); };
  function tcKind(tc) { return !tc ? '' : /^Public/.test(tc) ? 'public' : /contrat/i.test(tc) ? 'ctr' : 'prive'; }
  function frGroup(rows) {
    rows.forEach(function (r) {
      var key = r.etab_uai || r.etab_nom, last = F.groups[F.groups.length - 1];
      if (last && last.k === key) { last.f++; if (r.tf) last.tf[arr1(r.tf)] = 1; if (r.app) last.app = 1; return; }
      var g = { k: key, uai: r.etab_uai, n: r.etab_nom || '', v: [r.commune, r.departement !== r.commune ? r.departement : ''].filter(Boolean).join(', '), tc: r.tc, w: r.etab_url, f: 1, tf: {}, app: r.app ? 1 : 0 };
      if (r.tf) g.tf[arr1(r.tf)] = 1;
      F.groups.push(g);
    });
  }
  function frCard(g) {
    var kind = tcKind(g.tc), lid = lernaFR(g);
    var link = g.uai ? 'fiche.html?uai=' + encodeURIComponent(g.uai) : lid ? 'ecole.html?id=' + encodeURIComponent(lid) : '';   // la fiche « formations » permet d'ajouter des vœux
    var tfs = Object.keys(g.tf).slice(0, 3);
    return '<article class="card ucard"><div class="u-top">' + avatar(sigleOf(g.n), 'FR') +
      '<div class="u-id"><h3>' + (link ? '<a href="' + link + '">' + esc(g.n) + '</a>' : esc(g.n)) + '</h3><div class="loc">' + esc(g.v) + '</div></div></div>' +
      '<div class="u-tags"><span class="ok">' + esc(t('ex.ok')) + '</span>' + (kind === 'public' ? '<span>' + esc(t('ex.pPub')) + '</span>' : kind === 'ctr' ? '<span>' + esc(t('ex.pCtr')) + '</span>' : kind ? '<span>' + esc(t('ex.pPriv')) + '</span>' : '') +
        tfs.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + (g.app ? '<span>' + esc(t('ex.pAppB')) + '</span>' : '') + '</div>' +
      '<p class="u-src">' + esc(t('ex.frForm', { n: g.f })) + '</p>' +
      (link ? '<div class="acts"><a class="btn btn-brown btn-sm" href="' + link + '">' + esc(t('ex.see')) + '</a></div>' : '') + '</article>';
  }
  function frRender() {
    $('count').textContent = t('ex.frCount', { n: nf(F.total) });
    $('grid').innerHTML = F.groups.length ? F.groups.map(frCard).join('') : '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('search') + '<h4>' + t('ex.pNone') + '</h4><p>' + t('ex.pNoneSub') + '</p></div>';
    $('more').hidden = F.offset >= F.total;
  }
  function frSearch(append) {
    var my = ++F.seq;
    if (!append) { F.offset = 0; F.groups = []; $('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px 0">' + Lerna.thinking('inline') + '</div>'; $('more').hidden = true; }
    return fInit().then(function () {
      if (!append) frFilters();
      return fGet('/records?limit=' + FPER + '&offset=' + F.offset + '&order_by=etab_nom,etab_uai&select=etab_uai,etab_nom,tc,tf,app,commune,departement,etab_url&where=' + encodeURIComponent(fWhere()));
    }).then(function (j) {
      if (my !== F.seq || st.vue !== 'france') return;
      F.total = j.total_count || 0; F.offset += (j.results || []).length;
      frGroup(j.results || []); frRender(); Lerna.track('fr_search');
    }).catch(function () {
      if (my !== F.seq || st.vue !== 'france') return;
      $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('alert') + '<h4>' + esc(t('ex.frErr')) + '</h4></div>';
    });
  }

  /* ---------- Affichage selon la partie choisie ---------- */
  function render() {
    var fr = st.vue === 'france';
    Lerna.qsa('#seg [data-vue]').forEach(function (b) { var on = b.getAttribute('data-vue') === st.vue; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
    $('q').placeholder = t(fr ? 'ex.searchPhFr' : 'ex.searchPh');
    $('qLbl').textContent = t(fr ? 'ex.searchPhFr' : 'ex.searchPh');
    $('filters').hidden = fr; $('frFilters').hidden = !fr; $('frInfo').hidden = !fr; $('sortWrap').hidden = fr;
    if (fr) { $('note').hidden = true; frInfo(); return frSearch(); }
    st.show = PER;
    renderEcoles();
  }
  function credit() { $('credit').textContent = t('ex.credit', { d: A.idx && A.idx.maj ? Lerna.fmtDate(A.idx.maj) : '—' }); $('fxNote').textContent = t('ex.fxNote') + ' ' + (Lerna.moneyNote ? Lerna.moneyNote() : ''); }

  Lerna.ready(function () {
    $('q').value = st.q;
    renderFilters(); render(); credit();
    annIdx().then(function () { renderFilters(); credit(); }).catch(function () {});
    $('seg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-vue]'); if (!b || b.getAttribute('data-vue') === st.vue) return;
      st.vue = b.getAttribute('data-vue'); Lerna.sound.play('click'); render();
    });
    $('q').addEventListener('input', Lerna.debounce(function (e) { st.q = e.target.value; render(); }, 300));
    $('filters').addEventListener('change', function (e) {
      var s = e.target.closest('[data-f]'); if (!s) return;
      var k = s.getAttribute('data-f'); st[k] = s.value || (k === 'pays' ? 'ALL' : '');
      s.classList.toggle('on', k === 'pays' || !!s.value);
      Lerna.sound.play('click'); render();
    });
    $('filters').addEventListener('click', function (e) {
      if (!e.target.closest('#reset')) return;
      ['budget', 'dom', 'type', 'duree', 'lang'].forEach(function (k) { st[k] = ''; });
      st.q = ''; $('q').value = ''; st.pays = 'ALL'; renderFilters(); render();
    });
    $('frFilters').addEventListener('change', function (e) { var s = e.target.closest('[data-fr]'); if (!s) return; F[s.getAttribute('data-fr')] = s.value; frSearch(); });
    $('frFilters').addEventListener('click', function (e) { if (!e.target.closest('[data-frapp]')) return; F.app = !F.app; frSearch(); });
    $('moreBtn').addEventListener('click', function () {
      if (st.vue === 'france') { frSearch(true); return; }
      st.show += PER; paintEcoles();
    });
    $('sort').addEventListener('change', function (e) { st.sort = e.target.value; render(); });
    $('grid').addEventListener('click', function (e) {
      var f = e.target.closest('[data-fav]'); if (!f) return;
      var on = Lerna.favs.toggle(f.getAttribute('data-fav'));
      if (on === null) return;
      if (on) Lerna.pop(f);
      f.classList.toggle('on', on); f.setAttribute('aria-pressed', String(on));
    });
    Lerna.onLang(function () { renderFilters(); render(); credit(); });
  });
})();
</script>
</body>
</html>
