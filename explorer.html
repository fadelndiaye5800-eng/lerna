    position: relative; height: 128px;
    background: var(--cream-dark);
    display: flex; align-items: flex-end; padding: 16px 20px;

  .scard-img .ini { font-family: var(--font-head); font-weight: 800; font-size: 2.6rem; color: rgba(255, 255, 255, 0.75); letter-spacing: -0.02em; line-height: 1; }

  .scard .loc { font-size: .88rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .scard .loc .ic { width: 15px; height: 15px; color: var(--orange); }
  .scard .doms { display: flex; flex-wrap: wrap; gap: 6px; }
  .scard .doms .tag { background: var(--cream-dark); color: var(--brown); font-size: .72rem; padding: 3px 10px; }
  .fee-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .fee { font-family: var(--font-head); font-weight: 800; font-size: 1.35rem; color: var(--brown); }

  .rating { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .pager { display: flex; justify-content: center; gap: 8px; margin: 34px 0 10px; flex-wrap: wrap; }
  .pager button { min-width: 44px; height: 44px; border-radius: 12px; background: var(--cream-dark); font-weight: 700; color: var(--brown); padding: 0 12px; }
  .pager button.active { background: var(--orange); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .src-tabs { display: inline-flex; background: var(--cream-dark); border-radius: 99px; padding: 4px; margin-top: 18px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }

  .psup-note { display: flex; gap: 10px; align-items: flex-start; font-size: .86rem; color: var(--muted); margin-top: 12px; }

  .pcard .loc { font-size: .85rem; color: var(--muted); }
  .pcard .badges { display: flex; flex-wrap: wrap; gap: 6px; }

<main>
  <section class="ex-head">
    <div class="container">
      <span class="eyebrow" data-i18n="ex.eyebrow">Base d'établissements</span>
      <h1 data-i18n="ex.title">Explorer les écoles</h1>
      <p data-i18n="ex.sub">Partout dans le monde, avec des coûts réels dans ta devise et leurs points de vigilance — LERNA ne cache rien.</p>
      <div class="search">
        <label class="sr-only" for="q" data-i18n="ex.searchPh">Recherche une école, une ville, un pays…</label>
        <input class="input" id="q" type="search" autocomplete="off" data-i18n-ph="ex.searchPh" placeholder="Recherche une école, une ville, un pays…">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div class="src-tabs" role="tablist" id="srcTabs">
        <button type="button" class="active" data-src="lerna" role="tab" data-i18n="ex.srcLerna">Sélection LERNA</button>
        <button type="button" data-src="psup" role="tab" data-i18n="ex.srcPsup">France · Parcoursup</button>
        <button type="button" data-src="monde" role="tab" data-i18n="ex.srcMonde">Monde</button>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filtres"></div>
      <div class="filters" id="pFilters" role="group" aria-label="Filtres Parcoursup" hidden></div>
      <p class="psup-note" id="psupNote" hidden></p>
      <div class="filters" id="mFilters" role="group" aria-label="Filtres Monde" hidden></div>
      <p class="psup-note" id="mNote" hidden></p>
    </div>
  </section>

  <section class="container">
    <div class="count-row">
      <span id="count" aria-live="polite"></span>
      <label id="sortWrap"><span class="sr-only" data-i18n="ex.sort">Trier</span>
        <select class="sort" id="sort">
          <option value="fee" data-i18n="ex.sortFee">Frais croissants</option>
          <option value="name" data-i18n="ex.sortName">Nom A → Z</option>
          <option value="intl" data-i18n="ex.sortIntl">Reconnaissance internationale</option>
        </select>
      </label>
    </div>
    <div class="sgrid" id="grid"></div>
    <nav class="pager" id="pager" aria-label="Pagination"></nav>
    <div class="more-wrap" id="mMore" hidden><button type="button" class="btn btn-ghost" id="mMoreBtn" data-i18n="ex.pMore">Voir plus</button></div>
    <p class="disclaimer" id="mCredit" hidden></p>
    <div class="more-wrap" id="pMore" hidden><button type="button" class="btn btn-ghost" id="pMoreBtn" data-i18n="ex.pMore">Voir plus de formations</button></div>
    <p class="disclaimer" id="fxNote">Frais indicatifs en USD — vérifie toujours sur le site officiel de l’établissement.</p>
  </section>
</main>

<div id="lerna-footer"></div>

      '<p class="rec' + (bad ? ' bad' : '') + '">' + esc(rec) + '</p>' + mFacts(r) +
      '<div class="acts">' + (https(r.w) ? '<a class="btn btn-primary btn-sm" href="' + esc(r.w) + '" target="_blank" rel="noopener nofollow">' + esc(t('ex.lSite')) + ' ↗</a>' : '') +
      (src ? '<a class="btn btn-ghost btn-sm" href="' + esc(src) + '" target="_blank" rel="noopener">' + esc(t(wd ? 'ex.lWd' : r.s === 'officiel' ? 'ex.lList' : 'ex.lSrc')) + ' ↗</a>' : '') + '</div></article>';
  }
  function mList() {
    var q = norm(st.q).split(/\s+/).filter(Boolean);
    return (M.rows || []).filter(function (r) {
      if (M.off && r.s === 'wikidata') return false;
      if (!q.length) return true;
      var hay = norm([r.n, r.a, r.v, r.r].join(' '));
      return q.every(function (w) { return hay.indexOf(w) !== -1; });
    });
  }
  function mRender() {
    var list = mList(), off = M.off && (M.rows || []).length && !(M.rows || []).some(function (r) { return r.s !== 'wikidata'; });
    $('count').textContent = t('ex.mCount', { n: list.length.toLocaleString(Lerna.lang === 'en' ? 'en-US' : 'fr-FR'), c: window.LERNA_COUNTRY_NAME(M.cc) });
    $('grid').innerHTML = list.length ? list.slice(0, M.show).map(mCard).join('') :
      '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('search') + '<h4>' + t('ex.mNone') + '</h4>' + (off ? '<p>' + t('ex.mNoneOff') + '</p>' : '') + '</div>';
    $('mMore').hidden = list.length <= M.show;
    var hidden = M.off ? (M.rows || []).filter(function (r) { return r.s === 'wikidata'; }).length : 0;
    if (hidden && list.length <= M.show) $('grid').insertAdjacentHTML('beforeend', '<div class="notice" style="grid-column:1/-1">' + Lerna.icon('info') + '<div>' + esc(t('ex.mHidden', { n: hidden })) + ' <a href="#" class="orange bold" data-mshow>' + esc(t('ex.mShowAll')) + '</a></div></div>');
  }
  function mLoad(cc) {
    M.cc = cc; M.show = 30;
    if (M.cache[cc]) { M.rows = M.cache[cc]; mRender(); return Promise.resolve(); }
    $('count').textContent = t('ex.mLoading'); $('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px 0">' + Lerna.thinking('inline') + '</div>';
    return fetch('assets/annuaire/' + cc + '.json').then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (rows) {
      M.cache[cc] = rows; if (M.cc !== cc) return; M.rows = rows;
      /* Un pays sans registre officiel ouvert : on montre l'annuaire public (signalé « à vérifier ») plutôt qu'une page vide */
      if (!rows.some(function (r) { return r.s !== 'wikidata'; })) M.off = false;
      mFilters(); mRender(); Lerna.track('annuaire_pays', cc);
    }).catch(function () { $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('alert') + '<h4>' + t('ex.mErr') + '</h4></div>'; });
  }
  function mStart() {
    $('count').textContent = t('ex.mLoading'); $('grid').innerHTML = '';
    mIdx().then(function () {
      var me = Lerna.country(), list = Object.keys(M.idx.countries);
      if (!list.length) throw new Error('vide');
      var cc = M.cc || (list.indexOf(me) !== -1 ? me : list.indexOf('SN') !== -1 ? 'SN' : list[0]);
      M.cc = cc; mFilters(); return mLoad(cc);
    }).catch(function () { $('count').textContent = ''; $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('info') + '<h4>' + t('ex.mSoon') + '</h4></div>'; });
  }
  function setSrc(v) {
    src = v;
    Lerna.qsa('[data-src]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-src') === v); b.setAttribute('aria-selected', String(b.getAttribute('data-src') === v)); });
    var ps = v === 'psup', mo = v === 'monde', lo = v === 'lerna';
    $('filters').hidden = !lo; $('sortWrap').hidden = !lo; $('pager').hidden = !lo; $('fxNote').hidden = !lo;
    $('pFilters').hidden = !ps; $('psupNote').hidden = !ps; $('pMore').hidden = true;
    $('mFilters').hidden = !mo; $('mNote').hidden = !mo; $('mCredit').hidden = !mo; $('mMore').hidden = true;
    $('q').placeholder = t(ps ? 'ex.pSearchPh' : mo ? 'ex.searchPh' : 'ex.searchPh');
    if (ps) pSearch(); else if (mo) mStart(); else render();
  }

  Lerna.ready(function () {
    $('q').value = st.q;
    renderFilters(); render();
    $('q').addEventListener('input', Lerna.debounce(function (e) { st.q = e.target.value; st.page = 1; if (src === 'psup') pSearch(); else if (src === 'monde') { M.show = 30; mRender(); } else render(); }, 260));
    $('mFilters').addEventListener('change', function (e) { var s = e.target.closest('[data-m]'); if (s) mLoad(s.value); });
    $('mFilters').addEventListener('click', function (e) { if (!e.target.closest('[data-moff]')) return; M.off = !M.off; mFilters(); mRender(); });
    $('mMoreBtn').addEventListener('click', function () { M.show += 30; mRender(); });
    $('grid').addEventListener('click', function (e) { if (!e.target.closest('[data-mshow]')) return; e.preventDefault(); M.off = false; mFilters(); mRender(); });
    $('srcTabs').addEventListener('click', function (e) { var b = e.target.closest('[data-src]'); if (b && b.getAttribute('data-src') !== src) { Lerna.sound.play('click'); setSrc(b.getAttribute('data-src')); } });
    $('pFilters').addEventListener('change', function (e) { var s = e.target.closest('[data-p]'); if (!s) return; P[s.getAttribute('data-p')] = s.value; pSearch(); });
    $('pFilters').addEventListener('click', function (e) { if (!e.target.closest('[data-papp]')) return; P.app = !P.app; pSearch(); });
    $('pMoreBtn').addEventListener('click', function () { pSearch(true); });
    if (src !== 'lerna') setSrc(src);
    $('filters').addEventListener('change', function (e) {
      var s = e.target.closest('[data-f]'); if (!s) return;
      st[s.getAttribute('data-f')] = s.value; st.page = 1;
      s.classList.toggle('on', !!s.value);
      render();
    });
    $('filters').addEventListener('click', function (e) {
      if (!e.target.closest('#reset')) return;
      ['pays', 'budget', 'dom', 'type', 'duree', 'lang'].forEach(function (k) { st[k] = ''; });
      st.q = ''; $('q').value = ''; st.page = 1; renderFilters(); render();
    });
    $('sort').addEventListener('change', function (e) { st.sort = e.target.value; render(); });
    $('pager').addEventListener('click', function (e) {
      var b = e.target.closest('[data-page]'); if (!b || b.disabled) return;
      st.page = parseInt(b.getAttribute('data-page'), 10); render();
      window.scrollTo({ top: $('grid').getBoundingClientRect().top + window.scrollY - 120, behavior: 'smooth' });
    });
    $('grid').addEventListener('click', function (e) {
      var f = e.target.closest('[data-fav]'); if (!f) return;
      var on = Lerna.favs.toggle(f.getAttribute('data-fav'));
      if (on === null) return;
      if (on) Lerna.pop(f);
      f.classList.toggle('on', on); f.setAttribute('aria-pressed', String(on));
    });
    var fxNote = function () { $('fxNote').textContent = Lerna.moneyNote(); };
    fxNote();
    Lerna.onLang(function () { renderFilters(); render(); fxNote(); });
  });
})();
</script>
</body>
</html>
