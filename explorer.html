    display: flex; align-items: flex-end; padding: 16px 20px;

  .scard .loc .ic { width: 15px; height: 15px; color: var(--orange); }
  .scard .doms { display: flex; flex-wrap: wrap; gap: 6px; }

  .pager button.active { background: var(--orange); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .sec-h { font-size: 1.15rem; margin: 6px 0 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sec-h .n { font-family: var(--font-body); font-size: .8rem; font-weight: 700; color: var(--muted); background: var(--cream-dark); border-radius: 99px; padding: 3px 10px; }

  .pcard .loc { font-size: .85rem; color: var(--muted); }

<main>
  <section class="ex-head">
    <div class="container">
      <span class="eyebrow" data-i18n="ex.eyebrow">Base d'établissements</span>
      <h1 data-i18n="ex.title">Explorer les écoles</h1>
      <p data-i18n="ex.sub">Partout dans le monde, avec des coûts réels dans ta devise et leurs points de vigilance — LERNA ne cache rien.</p>

        <label class="sr-only" for="q" data-i18n="ex.searchPh">Recherche une école, une ville, un pays…</label>

      </div>
      <div class="filters" id="filters" role="group" aria-label="Filtres"></div>

  </section>

  <section class="container">
    <div class="count-row">

          <option value="name" data-i18n="ex.sortName">Nom A → Z</option>
          <option value="intl" data-i18n="ex.sortIntl">Reconnaissance internationale</option>
        </select>
      </label>
    </div>
    <h2 class="sec-h" id="hA"></h2>
    <div class="sgrid" id="grid"></div>
    <nav class="pager" id="pager" aria-label="Pagination"></nav>
    <div id="bWrap" hidden>
      <h2 class="sec-h" id="hB"></h2>
      <p class="sec-sub" id="bSub"></p>
      <div class="filters" id="frFilters" role="group" aria-label="Filtres France" hidden></div>
      <div class="sgrid" id="bGrid"></div>
      <div class="more-wrap" id="bMore" hidden><button type="button" class="btn btn-ghost" id="bMoreBtn" data-i18n="ex.pMore">Voir plus</button></div>
      <div id="bHidden"></div>
    </div>

    <p class="disclaimer" id="credit"></p>
  </section>
</main>

    var f = F.facets || {};
    var opt = function (k, lbl, list) {
      return '<select class="fsel' + (F[k] ? ' on' : '') + '" data-fr="' + k + '" aria-label="' + esc(t(lbl)) + '"><option value="">' + esc(t(lbl)) + '</option>' +
        (list || []).map(function (v) { return '<option value="' + esc(v) + '"' + (F[k] === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>';
    };
    $('frFilters').innerHTML = opt('tf', 'ex.pAllTf', (f.tf || []).slice().sort(function (a, b) { return a.localeCompare(b, 'fr'); })) + opt('reg', 'ex.pAllReg', f.region) +
      '<button type="button" class="fsel' + (F.app ? ' on' : '') + '" data-frapp style="padding-right:16px;background-image:none">' + esc(t('ex.pApp')) + '</button>';
    $('bSub').textContent = t('ex.subFR', { y: F.year || '' });
  }
  var arr1 = function (v) { return Array.isArray(v) ? v.join(' · ') : (v || ''); };
  function tcKind(tc) { return !tc ? '' : /^Public/.test(tc) ? 'public' : /contrat/i.test(tc) ? 'ctr' : 'prive'; }
  function frGroup(rows) {
    rows.forEach(function (r) {
      var key = r.etab_uai || r.etab_nom, last = F.groups[F.groups.length - 1];
      if (last && last.k === key) { last.f++; if (r.tf) last.tf[arr1(r.tf)] = 1; if (r.app) last.app = 1; return; }
      var g = { k: key, uai: r.etab_uai, n: r.etab_nom || '', v: [r.commune, r.departement].filter(Boolean).join(', '), tc: r.tc, w: r.etab_url, f: 1, tf: {}, app: r.app ? 1 : 0 };
      if (r.tf) g.tf[arr1(r.tf)] = 1;
      F.groups.push(g);
    });
  }
  function frCard(g) {
    var kind = tcKind(g.tc), fiche = g.uai ? 'fiche.html?uai=' + encodeURIComponent(g.uai) : '';
    var tfs = Object.keys(g.tf).slice(0, 3);
    return '<article class="card pcard"><h3>' + (fiche ? '<a class="plink" href="' + fiche + '">' + esc(g.n) + '</a>' : esc(g.n)) + '</h3>' +
      '<div class="loc">' + Lerna.flag('FR', 'stk-xs') + ' ' + esc(g.v) + '</div>' +
      '<div class="badges"><span class="pub">' + esc(t('ex.bState')) + '</span>' + (kind === 'public' ? '<span>' + esc(t('ex.pPub')) + '</span>' : kind === 'ctr' ? '<span class="ctr">' + esc(t('ex.pCtr')) + '</span>' : kind ? '<span>' + esc(t('ex.pPriv')) + '</span>' : '') +
        tfs.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + (g.app ? '<span>' + esc(t('ex.pAppB')) + '</span>' : '') + '</div>' +
      '<p class="rec">' + esc(t('ex.frForm', { n: g.f })) + '</p>' +
      (fiche ? '<div class="acts"><a class="btn btn-primary btn-sm" href="' + fiche + '">' + esc(t('ex.see')) + '</a></div>' : '') + '</article>';
  }
  function frRender() {
    var list = F.groups.filter(function (g) {
      if (lernaFR(g)) return false;
      if (st.type === 'public') return tcKind(g.tc) === 'public';
      if (st.type === 'private') return tcKind(g.tc) !== 'public';
      return true;
    });
    $('bN').textContent = t('ex.frCount', { n: nf(F.total) });
    $('bGrid').innerHTML = list.length ? list.map(frCard).join('') : '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('search') + '<h4>' + t('ex.pNone') + '</h4><p>' + t('ex.pNoneSub') + '</p></div>';
    $('bMore').hidden = F.offset >= F.total;
    $('bHidden').innerHTML = '';
  }
  function frSearch(append) {
    var my = ++F.seq;
    if (!append) { F.offset = 0; F.groups = []; bLoading(); }
    return fInit().then(function () {
      if (!append) frFilters();
      return fGet('/records?limit=' + FPER + '&offset=' + F.offset + '&order_by=etab_nom,etab_uai&select=etab_uai,etab_nom,tc,tf,app,commune,departement,etab_url&where=' + encodeURIComponent(fWhere()));
    }).then(function (j) {
      if (my !== F.seq) return;
      F.total = j.total_count || 0; F.offset += (j.results || []).length;
      frGroup(j.results || []); frRender(); Lerna.track('fr_search');
    }).catch(function () {
      if (my !== F.seq) return;
      bEmpty(t('ex.frErr'));
    });
  }

  function credit() {
    $('credit').textContent = t('ex.credit', { d: A.idx && A.idx.maj ? Lerna.fmtDate(A.idx.maj) : '—' });
  }
  function refresh() { st.page = 1; renderFilters(); render(); }

  Lerna.ready(function () {
    $('q').value = st.q;
    /* Pays de départ : celui demandé, sinon la France si on vient d'un ancien lien, sinon tous les pays pour une recherche, sinon le pays de la personne */
    var want = (Lerna.param('pays') || '').toUpperCase();
    st.pays = /^[A-Z]{2}$|^ALL$/.test(want) ? want : srcP === 'psup' ? 'FR' : st.q ? 'ALL' : '';
    renderFilters(); render(); credit();
    annIdx().then(function () {
      if (!st.pays) {
        var me = Lerna.country(), ok = me && (me === 'FR' || A.idx.countries[me] || S.some(function (s) { return s.pays === me; }));
        st.pays = ok ? me : 'SN';
      }
      renderFilters(); render(); credit();
    }).catch(function () { if (!st.pays) { st.pays = 'ALL'; renderFilters(); render(); } });

    $('q').addEventListener('input', Lerna.debounce(function (e) { st.q = e.target.value; st.page = 1; A.show = 30; render(); }, 280));
    $('filters').addEventListener('change', function (e) {
      var s = e.target.closest('[data-f]'); if (!s) return;
      st[s.getAttribute('data-f')] = s.value || (s.getAttribute('data-f') === 'pays' ? 'ALL' : '');
      st.page = 1; A.show = 30;
      if (s.getAttribute('data-f') === 'pays') { F.tf = ''; F.reg = ''; F.app = false; }
      s.classList.toggle('on', !!s.value);
      Lerna.sound.play('click');
      render();
    });
    $('filters').addEventListener('click', function (e) {
      if (e.target.closest('[data-off]')) { st.off = !st.off; renderFilters(); render(); return; }
      if (!e.target.closest('#reset')) return;
      ['budget', 'dom', 'type', 'duree', 'lang'].forEach(function (k) { st[k] = ''; });
      st.q = ''; $('q').value = ''; st.off = true; refresh();
    });
    $('frFilters').addEventListener('change', function (e) { var s = e.target.closest('[data-fr]'); if (!s) return; F[s.getAttribute('data-fr')] = s.value; frSearch(); });
    $('frFilters').addEventListener('click', function (e) { if (!e.target.closest('[data-frapp]')) return; F.app = !F.app; frSearch(); });
    $('bMoreBtn').addEventListener('click', function () {
      if (st.pays === 'FR') { frSearch(true); return; }
      A.show += 30;
      if (allCountries() && A.global) { $('bGrid').innerHTML = A.global.slice(0, A.show).map(annCard).join(''); $('bMore').hidden = A.global.length <= A.show; return; }
      if (A.cache[A.cc]) annRender(A.cache[A.cc]);
    });
    $('bHidden').addEventListener('click', function (e) { if (!e.target.closest('[data-mshow]')) return; e.preventDefault(); st.off = false; renderFilters(); if (A.cache[A.cc]) annRender(A.cache[A.cc]); });
    $('sort').addEventListener('change', function (e) { st.sort = e.target.value; render(); });
    $('pager').addEventListener('click', function (e) {
      var b = e.target.closest('[data-page]'); if (!b || b.disabled) return;
      st.page = parseInt(b.getAttribute('data-page'), 10); render();
      window.scrollTo({ top: $('grid').getBoundingClientRect().top + window.scrollY - 120, behavior: 'smooth' });
    });
    $('grid').addEventListener('click', function (e) {
      var f = e.target.closest('[data-fav]'); if (!f) return;
      var on = Lerna.favs.toggle(f.getAttribute('data-fav'));
      if (on === null) return;
      if (on) Lerna.pop(f);
      f.classList.toggle('on', on); f.setAttribute('aria-pressed', String(on));
    });
    var fxNote = function () { $('fxNote').textContent = Lerna.moneyNote(); };
    fxNote();
    Lerna.onLang(function () { renderFilters(); render(); fxNote(); credit(); });
  });
})();
</script>
</body>
</html>
