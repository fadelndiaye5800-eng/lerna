<style>
  main { padding-bottom: 90px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; font-size: .9rem; text-decoration: none; margin: 22px 0 14px; background: none; border: 0; padding: 0; cursor: pointer; }
  .back:hover { color: var(--orange); }
  /* En-tête : le même que les fiches LERNA */
  .banner { height: 150px; border-radius: 22px; background: var(--cream-dark); position: relative; overflow: hidden; }
  .banner .flg { position: absolute; right: 18px; top: 14px; width: 54px; height: 54px; }
  .id-row { display: flex; gap: 18px; align-items: flex-end; margin-top: -46px; padding: 0 22px; position: relative; }
  .s-logo { width: 92px; height: 92px; border-radius: 22px; background: var(--panel); color: var(--on-panel); border: 4px solid var(--bg); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 800; font-size: 1.4rem; flex-shrink: 0; text-align: center; line-height: 1; padding: 6px; word-break: break-all; }
  .s-title { padding: 18px 0 6px; }
  .s-title h1 { font-size: clamp(1.6rem, 4.6vw, 2.5rem); line-height: 1.15; margin-top: 8px; }
  .s-sub { margin-top: 6px; font-weight: 700; color: var(--muted); }
  .s-sub a { color: var(--orange); text-decoration: none; }
  .s-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .s-meta .tag { background: var(--white); border: 1.5px solid var(--cream-dark); }
  .lvl { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 800; border-radius: 99px; padding: 4px 11px; }
  .lvl-off { background: #E8F3E9; color: #2E7D32; }
  .lvl-bad { background: #FBE3E3; color: #C62828; }
  .lvl-wd { background: #EEE; color: #666; }
  .tabs-wrap { position: sticky; top: var(--nav-h); z-index: 40; background: var(--bg); margin-top: 22px; }
  .panel { padding: 24px 0 30px; }
  .panel h3 { margin-bottom: 12px; }
  .two { display: grid; gap: 14px; }
  @media (min-width: 768px) { .two { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 768px) {
    .banner { height: 120px; border-radius: 0; margin: 0 -20px; }
    .id-row { padding: 0 4px; }
    .s-logo { width: 78px; height: 78px; font-size: 1.15rem; }
  }
  /* Chiffres */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .kpi { background: var(--white); border: 1.5px solid var(--cream-dark); border-radius: 16px; padding: 14px; }
  .kpi .v { font-family: var(--font-head); font-weight: 800; font-size: 1.45rem; color: var(--brown); line-height: 1.1; }
  .kpi .l { font-size: .76rem; color: var(--muted); font-weight: 600; margin-top: 6px; line-height: 1.35; }
  .kpi.hl { background: var(--orange-soft, #FDEBDD); border-color: transparent; }
  .kpi.hl .v { color: var(--orange-deep, #B84D06); }
  .fbs { display: grid; gap: 10px; }
  .fb .top { display: flex; justify-content: space-between; font-size: .86rem; font-weight: 600; margin-bottom: 4px; gap: 10px; }
  .fb .top b { color: var(--brown); }
  .fb .trk { height: 10px; border-radius: 99px; background: var(--cream-dark); overflow: hidden; }
  .fb .fill { height: 100%; border-radius: 99px; background: var(--orange); }
  .rows { display: grid; }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--cream-dark); font-size: .92rem; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); font-weight: 600; }
  .row .v { font-weight: 700; color: var(--brown); text-align: right; }
  .row.col { flex-direction: column; gap: 4px; align-items: stretch; }
  .row.col .v { text-align: left; font-weight: 600; line-height: 1.5; }
  .list-dot { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .map { width: 100%; height: 230px; border: 0; border-radius: 16px; background: var(--cream-dark); }
  .others { display: grid; gap: 8px; }
  .others a { display: block; padding: 12px 14px; border-radius: 14px; background: var(--white); border: 1.5px solid var(--cream-dark); text-decoration: none; color: var(--brown); font-weight: 600; font-size: .92rem; }
  .others a small { display: block; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .others a:hover { border-color: var(--orange); }
  .fgroup { margin-top: 18px; }
  .fgroup h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .fitem { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .fitem .k { font-size: .74rem; font-weight: 800; color: #2E7D32; background: #E8F3E9; border-radius: 8px; padding: 3px 8px; white-space: nowrap; flex-shrink: 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .note { font-size: .82rem; color: var(--muted); line-height: 1.55; }
  .warn { background: #FBE3E3; color: #8E1C1C; border-radius: 16px; padding: 14px 16px; font-weight: 600; font-size: .92rem; line-height: 1.5; }
  .accred-steps { margin: 12px 0 0 18px; display: grid; gap: 8px; }
  .steps { list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 14px; padding: 0; }
  .steps li { counter-increment: st; display: flex; gap: 14px; align-items: flex-start; }
  .steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: .86rem; }
  .steps li span { padding-top: 4px; line-height: 1.5; }
  .todo { border: 1.5px dashed var(--cream-darker, #c9b391); border-radius: 18px; padding: 16px 18px; background: var(--surface); line-height: 1.55; }
  .todo b { color: var(--brown); }
  .asked { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; color: #2E7D32; font-size: .9rem; }
  .fee-warn { display: flex; gap: 10px; align-items: flex-start; background: var(--cream); border-radius: 14px; padding: 14px 16px; font-size: .88rem; color: var(--brown); line-height: 1.55; }
  .fee-warn .ic { width: 18px; height: 18px; color: var(--orange); flex-shrink: 0; margin-top: 2px; }
  .rate-grid { display: grid; gap: 12px; }
  .rate-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .star-input { display: inline-flex; gap: 2px; }
  .star-input button { font-size: 1.6rem; color: var(--cream-darker); line-height: 1; padding: 2px; }
  .star-input button.on { color: var(--orange); }
  .loading { text-align: center; padding: 60px 0; }
  /* Candidature : bouton collé en bas de l'écran, et choix de la démarche (France) */
  .apply-bar { position: sticky; bottom: 14px; z-index: 30; background: var(--bg); border: 1.5px solid var(--cream-dark); border-radius: 20px; padding: 12px; box-shadow: 0 10px 30px rgba(61,31,0,.12); margin-top: 8px; }
  .apply-bar small { display: block; text-align: center; font-size: .78rem; color: var(--muted); margin-top: 6px; }
  body.has-bottom-nav .apply-bar { bottom: calc(var(--bottom-h) + var(--safe-b) + 10px); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(42,22,6,.55); z-index: 120; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 20px 20px calc(22px + var(--safe-b)); }
  @media (min-width: 769px) { .sheet-bg { align-items: center; } .sheet { border-radius: 24px; } }
  .sheet h3 { margin-bottom: 8px; } .sheet p { line-height: 1.55; margin-bottom: 10px; }
  .sheet .acts { margin-top: 14px; }
</style>

    bg.className = 'sheet-bg'; bg.id = 'sheet';
    bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><h3 id="shT">' + esc(t('fi.howApply')) + '</h3>' +
      '<p>' + esc(t('fi.sheetFR', { g: L(g.label) })) + '</p><p class="note">' + esc(L(g.who)) + '</p>' +
      (n ? '<p class="note"><strong>' + esc(t('fi.sheetN', { n: n })) + '</strong></p>' : '') +
      '<p class="note">' + esc(t('fi.sheetSwitch')) + '</p>' +
      '<div class="acts"><button type="button" class="btn btn-primary" id="addVoeu">' + esc(t('fi.addVoeu')) + '</button><button type="button" class="btn btn-ghost" data-sheet-close>' + esc(t('fi.cancel')) + '</button></div></div>';
    document.body.appendChild(bg);
    var b = $('addVoeu'); if (b) b.focus();
  }
  function closeSheet() { var x = $('sheet'); if (x) x.remove(); }
  function addVoeu() {
    var a = F.apply;
    closeSheet();
    go(window.LERNA_DOSSIER_FR({ gta: a.gta, nm: a.nm, etab: a.etab, ville: a.ville }, t('fi.frDossier')));
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  Lerna.ready(function () {
    var gta = Lerna.param('psup'), uai = Lerna.param('uai'), cc = (Lerna.param('cc') || '').toUpperCase(), id = Lerna.param('id');
    root.querySelector('.loading').innerHTML = Lerna.thinking('inline');
    if (gta && /^\d{1,7}$/.test(gta)) formationFiche(gta);
    else if (uai && /^[0-9A-Za-z]{6,10}$/.test(uai)) etabFiche(uai);
    else if (/^[A-Z]{2}$/.test(cc) && id) mondeFiche(cc, id);
    else notFound();
    document.addEventListener('click', function (e) {
      var tb = e.target.closest('.tab[data-tab]');
      if (tb && F) { F.tab = tb.getAttribute('data-tab'); renderPanel(); Lerna.sound.play('click'); return; }
      if (e.target.closest('#backBtn')) { if (history.length > 1) history.back(); else location.href = 'explorer.html'; return; }
      if (e.target.closest('#applyBtn') && F) { apply(); return; }
      if (e.target.closest('[data-sheet-close]') || e.target.classList.contains('sheet-bg')) { closeSheet(); return; }
      if (e.target.closest('#addVoeu') && F) { addVoeu(); return; }
      if (e.target.closest('[data-ask]') && F) {
        var a = asked(); a[F.key] = Date.now(); Lerna.store.set('lerna_asked', a);
        try { Lerna.stats.log('fiche_ask', { k: String(F.key).slice(0, 80), n: String(F.title).slice(0, 90), cc: F.cc }); } catch (er) {}
        Lerna.toast(t('fi.askThanks'), 3000); Lerna.sound.play('success'); renderPanel(); return;
      }
      var st = e.target.closest('[data-cat]');
      if (st) { draft[st.getAttribute('data-cat')] = parseInt(st.getAttribute('data-v'), 10); renderPanel(); return; }
      if (e.target.closest('#shareBtn')) {
        var d = { title: document.title, url: location.href };
        if (navigator.share) navigator.share(d).catch(function () {}); else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { Lerna.toast && Lerna.toast('✓'); });
      }
    });
    document.addEventListener('submit', function (e) {
      if (!F || e.target.id !== 'revForm') return;
      e.preventDefault();
      if (CATS.some(function (c) { return !draft[c[0]]; })) { $('revErr').textContent = t('fi.needStars'); Lerna.sound.play('error'); return; }
      var rev = { cours: draft.cours, campus: draft.campus, prix: draft.prix, insertion: draft.insertion, commentaire: $('revTxt').value.trim().slice(0, 1500), date: new Date().toISOString() };
      var all = Lerna.store.get('lerna_reviews', {}) || {}; all[F.key] = rev; Lerna.store.set('lerna_reviews', all);
      var A = Lerna.auth;
      if (A.mode === 'supabase' && A.user) A.sb.from('avis').insert({ user_id: A.user.id, ecole_id: F.key, note_cours: rev.cours, note_campus: rev.campus, note_prix: rev.prix, note_insertion: rev.insertion, commentaire: rev.commentaire }).then(function () {}, function () {});
      Lerna.toast(t('fi.thanks'), 3500); Lerna.sound.play('success'); renderPanel();
    });
    Lerna.onLang(function () { if (F) shell(); });
  });
})();
</script>
</body>
</html>
