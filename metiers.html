<style>
  .mt-head { padding: 26px 0 8px; }
  .mt-head h1 { font-size: clamp(1.9rem, 5.4vw, 2.6rem); }
  .mt-head p { color: var(--muted); margin-top: 8px; max-width: 620px; }
  .search { position: relative; margin-top: 16px; }
  .search .input { padding: 17px 56px 17px 20px; font-size: 1.05rem; border-radius: 18px; }
  .search .ic { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--brown); width: 22px; height: 22px; }
  .mt-filters { display: grid; gap: 10px; margin-top: 14px; }
  .mt-selects { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .mt-mine { margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: var(--cream); }
  .mt-mine p { font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
  .count-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; color: var(--muted); font-size: .9rem; }
  .mt-list { display: grid; gap: 10px; }
  @media (min-width: 760px) { .mt-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mcard { display: block; text-decoration: none; color: inherit; padding: 16px 18px; }
  .mcard h3 { font-size: 1.02rem; line-height: 1.35; }
  .mcard .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mcard .meta span { font-size: .76rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--cream-dark); color: var(--brown); }
  .mcard .meta .lv { background: var(--orange-soft); color: var(--orange-deep); }
  .more { display: flex; justify-content: center; margin: 18px 0 30px; }
  .ci-intro { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  /* Fiche métier */
  .mf { padding: 18px 0 60px; display: grid; gap: 14px; }
  .mf h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; }
  .mf > * { min-width: 0; }
  .mf .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mf .badges .badge { white-space: normal; text-align: left; line-height: 1.3; max-width: 100%; }
  .mf .card h3 { font-size: 1.05rem; margin-bottom: 10px; }
  .mf .intro { font-size: 1.02rem; margin-bottom: 12px; }
  .mf .aka { font-size: .86rem; color: var(--muted); margin-top: 8px; }
  .mf .ctx { display: grid; gap: 10px; }
  .mf .ctx h4 { font-size: .86rem; color: var(--muted); margin-bottom: 4px; }
  .mf .ctx p { font-size: .94rem; }
  .near { display: grid; gap: 8px; }
  .near a { display: block; padding: 12px 14px; border-radius: 14px; background: var(--cream); text-decoration: none; color: var(--brown); font-weight: 700; font-size: .94rem; }
  .near a small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .mf .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .src-note { font-size: .8rem; color: var(--muted); }
  .mt-h4 { font-size: .92rem; margin-top: 12px; }
  .mt-dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .94rem; }
  .mt-dl dt { color: var(--muted); font-size: .86rem; }
  .mt-dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) { .mt-dl { grid-template-columns: 1fr; gap: 2px; } .mt-dl dd { margin-bottom: 8px; } }
  .mf .chips .chip { white-space: normal; text-align: left; }
  .mt-fr { margin-top: 14px; border: 1.5px solid var(--cream-dark); border-radius: 14px; padding: 10px 14px; }
  .mt-fr summary { cursor: pointer; font-weight: 700; font-size: .94rem; }
  .mf .acts .btn { white-space: normal; }
  .mt-note { margin-top: 10px; font-size: .88rem; color: var(--muted); }
</style>

      if ((b = e.target.closest('[data-dom]'))) { var d = b.getAttribute('data-dom'); st.dom = st.dom === d ? '' : d; st.autoDom = false; st.show = PER; Lerna.sound.play('select'); paintList(); return; }
      if (e.target.closest('#moreBtn')) { st.show += PER; paintList(); return; }
      if (e.target.closest('#retry')) { route(); }
    });
    /* Une recherche porte sur tous les métiers : le domaine choisi automatiquement (d'après le test) est retiré */
    document.addEventListener('input', Lerna.debounce(function (e) { if (e.target.id === 'mq') { st.q = e.target.value; if (st.autoDom && st.q) { st.dom = ''; st.autoDom = false; } st.show = PER; paintList(); } }, 160));
    document.addEventListener('change', function (e) {
      if (e.target.id === 'mci') { st.ci = e.target.value; st.show = PER; paintList(); }
      if (e.target.id === 'mlv') { st.lv = e.target.value; st.show = PER; paintList(); }
    });
    Lerna.onLang(function () { if (IX) { if (Lerna.param('code')) renderFiche(Lerna.param('code')); else renderList(); } });
  });
})();
</script>
</body>
</html>
