<meta name="lerna-title" content="mt.docTitle">
<meta name="description" content="Des milliers de métiers expliqués pour tous les pays : ce qu’on fait chaque jour, les qualités demandées, le niveau d’études et le chemin pour y arriver. Sources : classifications ROME et ESCO.">

<link rel="manifest" href="manifest.json">

<style>
  .mt-head { padding: 26px 0 8px; }
  .mt-head h1 { font-size: clamp(1.9rem, 5.4vw, 2.6rem); }
  .mt-head p { color: var(--muted); margin-top: 8px; max-width: 620px; }
  .search { position: relative; margin-top: 16px; }
  .search .input { padding: 17px 56px 17px 20px; font-size: 1.05rem; border-radius: 18px; }
  .search .ic { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--brown); width: 22px; height: 22px; }
  .mt-filters { display: grid; gap: 10px; margin-top: 14px; }
  .mt-selects { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .mt-mine { margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: var(--cream); }
  .mt-mine p { font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
  .count-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; color: var(--muted); font-size: .9rem; }
  .mt-list { display: grid; gap: 10px; }
  @media (min-width: 760px) { .mt-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mcard { display: block; text-decoration: none; color: inherit; padding: 16px 18px; }
  .mcard h3 { font-size: 1.02rem; line-height: 1.35; }
  .mcard .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mcard .meta span { font-size: .76rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--cream-dark); color: var(--brown); }
  .mcard .meta .lv { background: var(--orange-soft); color: var(--orange-deep); }
  .more { display: flex; justify-content: center; margin: 18px 0 30px; }
  .ci-intro { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  /* Fiche métier */
  .mf { padding: 18px 0 60px; display: grid; gap: 14px; }
  .mf h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; }
  .mf > * { min-width: 0; }
  .mf .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mf .badges .badge { white-space: normal; text-align: left; line-height: 1.3; max-width: 100%; }
  .mf .card h3 { font-size: 1.05rem; margin-bottom: 10px; }
  .mf .intro { font-size: 1.02rem; margin-bottom: 12px; }
  .mf .aka { font-size: .86rem; color: var(--muted); margin-top: 8px; }
  .mf .ctx { display: grid; gap: 10px; }
  .mf .ctx h4 { font-size: .86rem; color: var(--muted); margin-bottom: 4px; }
  .mf .ctx p { font-size: .94rem; }
  .near { display: grid; gap: 8px; }
  .near a { display: block; padding: 12px 14px; border-radius: 14px; background: var(--cream); text-decoration: none; color: var(--brown); font-weight: 700; font-size: .94rem; }
  .near a small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .mf .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .src-note { font-size: .8rem; color: var(--muted); }
  .mt-h4 { font-size: .92rem; margin-top: 12px; }
  .mt-dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .94rem; }
  .mt-dl dt { color: var(--muted); font-size: .86rem; }
  .mt-dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) { .mt-dl { grid-template-columns: 1fr; gap: 2px; } .mt-dl dd { margin-bottom: 8px; } }
  .mf .chips { flex-wrap: wrap; overflow: visible; }
  .mf span.chip { background: var(--cream-dark); border-color: transparent; font-weight: 500; cursor: default; }
  .mf .chips .chip { flex-shrink: 1; max-width: 100%; white-space: normal; text-align: left; border-radius: 14px; padding: 7px 12px; font-size: .86rem; line-height: 1.35; }
  .mt-fr { margin-top: 14px; border: 1.5px solid var(--cream-dark); border-radius: 14px; padding: 10px 14px; }
  .mt-fr summary { cursor: pointer; font-weight: 700; font-size: .94rem; }
  .mf .acts .btn { white-space: normal; }
  .mt-note { margin-top: 10px; font-size: .88rem; color: var(--muted); }
  .mt-ccsel { width: 100%; max-width: 420px; }
  .mt-cc { margin-top: 12px; display: grid; gap: 10px; }
  .mt-rule { padding: 12px 14px; border-radius: 14px; background: var(--cream); }
  .mt-rule p { margin-top: 4px; font-size: .94rem; }
  .mt-fit .mt-score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 2px 0 10px; }
  .mt-fit .mt-score b { font-size: 2rem; color: var(--orange-deep); line-height: 1; }
  .mt-fit .mt-score span { font-weight: 700; }
  .mt-why { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .mt-why li { position: relative; padding-left: 26px; font-size: .94rem; }
  .mt-why li::before { position: absolute; left: 0; top: 0; font-weight: 800; }
  .mt-why li.ok::before { content: '✓'; color: var(--olive); }
  .mt-why li.mid::before { content: '~'; color: var(--orange-deep); }
  .mt-why li.ko::before { content: '!'; color: var(--orange-deep); }
  .mt-path { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 8px; font-size: .94rem; }
</style>

          '<div class="badges"><span class="badge badge-soft">' + esc(lvBadge(m)) + '</span>' + (f.dp ? '<span class="badge badge-cream">' + esc(f.dp) + '</span>' : '') +
            (tr.e ? '<span class="badge badge-olive">🌱 ' + esc(t('mt.trE')) + '</span>' : '') + (tr.n ? '<span class="badge badge-outline">💻 ' + esc(t('mt.trN')) + '</span>' : '') + '</div>' +
          (f.ap && f.ap.length && !(isE && en) ? '<p class="aka">' + esc(t('mt.aka', { n: f.ap.slice(0, 4).map(cap).join(' · ') })) + '</p>' : '') + '</div>' +
        (d.length ? '<section class="card"><h3>' + t('mt.do') + '</h3><p class="intro">' + esc(d[0]) + '</p>' + (d.length > 1 ? ul(d.slice(1), 'list-arrow') : '') + '</section>' : '') +
        fitCard(f, m) +
        reachHtml(f, m, dom) +
        (f.se && f.se.length ? '<section class="card"><h3>' + t('mt.qual') + '</h3><p class="small muted" style="margin:-4px 0 10px">' + t('mt.qualSub') + '</p>' + ul(f.se) + '</section>' : '') +
        (skills.length ? '<section class="card"><h3>' + t('mt.skills') + '</h3>' + ul(skills.map(cap)) + '</section>' : '') +
        (know.length ? '<section class="card"><h3>' + t(isE ? 'mt.opt' : 'mt.know') + '</h3><p>' + esc(know.join(' · ')) + '</p></section>' : '') +
        (f.sec && f.sec.length ? '<section class="card"><h3>' + t('mt.secs') + '</h3><p class="small muted" style="margin:-4px 0 10px">' + t('mt.secsSub') + '</p><div class="chips">' + f.sec.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('') + '</div></section>' : '') +
        (ctx ? '<section class="card"><h3>' + t('mt.ctx') + '</h3><div class="ctx">' + ctx + '</div></section>' : '') +
        (ints.length ? '<section class="card"><h3>' + t('mt.ints') + '</h3><div class="chips">' + ints.map(function (c) { return '<a class="chip" href="metiers.html?ci=' + encodeURIComponent(c.id) + '">' + esc(c.l) + '</a>'; }).join('') + '</div></section>' : '') +
        (EL ? '<section class="card mt-intl"><h3>🌍 ' + t(isE ? 'mt.intlE' : 'mt.intl') + '</h3><p class="small muted" style="margin:-4px 0 12px">' + t(isE ? 'mt.intlESub' : 'mt.intlSub') + '</p>' +
          '<dl class="mt-dl"><dt>' + t('mt.intlName') + '</dt><dd>' + esc(cap(EL.t)) + (!en && E.en && E.en.t ? ' <span class="muted">(' + esc(E.en.t) + ')</span>' : '') + '</dd>' +
          (EL.i ? '<dt>' + t('mt.intlGroup') + '</dt><dd>' + esc(EL.i) + (EL.il ? ' — ' + esc(EL.il) : '') + '</dd>' : '') + '</dl>' +
          (!isE && EL.d ? '<h4 class="mt-h4">' + t('mt.intlDesc') + '</h4><p>' + esc(EL.d) + '</p>' : '') +
          (!isE && EL.s && EL.s.length ? '<h4 class="mt-h4">' + t('mt.intlSkills') + '</h4><div class="chips" style="margin-top:6px">' + EL.s.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
          '<p class="small muted" style="margin-top:12px">' + (isE ? '' : t('mt.intlApprox') + ' ') + '<a class="orange" href="' + esc(E.u) + '" target="_blank" rel="noopener">' + t('mt.intlOpen') + ' ↗</a></p></section>' : '') +
        (near.length ? '<section class="card"><h3>' + t(isE ? 'mt.nearE' : 'mt.near') + '</h3><p class="small muted" style="margin:-4px 0 10px">' + t(isE ? 'mt.nearESub' : 'mt.nearSub') + '</p><div class="near">' + near.map(function (n) {
          return '<a href="metiers.html?code=' + encodeURIComponent(n[0]) + '">' + esc(cap(en && n[5] ? n[5] : n[1])) + '<small>' + esc(lvBadge(n)) + '</small></a>';
        }).join('') + '</div></section>' : '') +
        '<p class="src-note">' + (isE ? esc(t('mt.srcE', { d: Lerna.fmtDate((IX.monde && IX.monde.maj) || IX.maj) })) :
          esc(t('mt.src', { v: IX.version || 'ROME', d: Lerna.fmtDate(IX.maj) })) + (E ? ' ' + esc(t('mt.srcEsco')) : '') + ' ' + esc(t('mt.srcWarn'))) + '</p>' +
      '</div>';
      window.scrollTo(0, 0);
    }, showErr);
  }
  function showErr() {
    root.innerHTML = '<div class="empty" style="margin-top:40px">' + Lerna.icon('info') + '<h4>' + t('mt.err') + '</h4><button type="button" class="btn btn-primary" style="margin-top:14px" id="retry">' + t('mt.retry') + '</button></div>';
  }
  function route() {
    var code = Lerna.param('code');
    loadIndex().then(function () { if (code) renderFiche(code); else renderList(); }, showErr);
  }

  Lerna.ready(function () {
    /* Les métiers sont classés selon le profil (test d'orientation) : aucun filtre ni pays imposé */
    PROF = profileInfo();
    root.querySelector('.loading').innerHTML = Lerna.thinking('inline');
    route();
    document.addEventListener('click', function (e) {
      var b;
      if ((b = e.target.closest('[data-dom]'))) { var d = b.getAttribute('data-dom'); st.dom = st.dom === d ? '' : d; st.autoDom = false; st.show = PER; Lerna.sound.play('select'); paintList(); return; }
      if (e.target.closest('#moreBtn')) { st.show += PER; paintList(); return; }
      if (e.target.closest('#retry')) { route(); }
    });
    /* Une recherche porte sur tous les métiers : le domaine choisi automatiquement (d'après le test) est retiré */
    document.addEventListener('input', Lerna.debounce(function (e) { if (e.target.id === 'mq') { st.q = e.target.value; if (st.autoDom && st.q) { st.dom = ''; st.autoDom = false; } st.show = PER; paintList(); } }, 160));
    document.addEventListener('change', function (e) {
      if (e.target.id === 'mci') { st.ci = e.target.value; st.show = PER; paintList(); }
      if (e.target.id === 'mlv') { st.lv = e.target.value; st.show = PER; paintList(); }
      if (e.target.id === 'mcc' && CUR) {
        var cc = e.target.value;
        Lerna.store.set('lerna_mt_cc', cc);
        $('ccBox').innerHTML = countryBox(CUR.f, CUR.m, (CUR.m[4] || [])[0] || '', cc);
        Lerna.track('metier_pays', cc || '-');
      }
    });
    /* Premium activé ou perdu pendant la visite : la carte « Ce métier et toi » est réaffichée */
    Lerna.onAccessChange(function () { if (CUR && Lerna.param('code')) renderFiche(CUR.code); });
    Lerna.onLang(function () { if (IX) { if (Lerna.param('code')) renderFiche(Lerna.param('code')); else renderList(); } });
  });
})();
</script>
</body>
</html>
