# Annuaire mondial des établissements : reconstruit chaque mois à partir des registres officiels
# (DEQAR, College Scorecard, Office for Students, CRICOS, Wikidata) puis publié par Vercel au prochain déploiement.
name: Annuaire mondial
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 2 * *'        # le 2 de chaque mois à 3 h 17 UTC
  push:
    branches: [main]
    paths: ['scripts/annuaire/**', '.github/workflows/annuaire.yml']
permissions:
  contents: write
concurrency:
  group: annuaire
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dépendances de lecture (CSV, Excel)
        run: npm install --no-save --no-package-lock csv-parse@5 xlsx@0.18.5 cheerio@1 pdf-parse@1.1.1
      - name: Construire l'annuaire
        run: node scripts/annuaire/build.mjs
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "lerna-annuaire[bot]"
          git config user.email "annuaire@users.noreply.github.com"
          git add assets/annuaire
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Annuaire mondial : mise à jour automatique ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push origin HEAD:main
