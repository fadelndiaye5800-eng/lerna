# Annuaire mondial des établissements : reconstruit chaque mois à partir des registres officiels
# (DEQAR, College Scorecard, Office for Students, CRICOS, Wikidata) puis publié par Vercel au prochain déploiement.
name: Annuaire mondial
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 2 * *'        # le 2 de chaque mois à 3 h 17 UTC
  push:
    branches: [main]
    paths: ['scripts/annuaire/build.mjs', '.github/workflows/annuaire.yml']
permissions:
  contents: write
concurrency:
  group: annuaire
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dépendances de lecture (CSV, Excel)
        run: npm install --no-save --no-package-lock csv-parse@5 xlsx@0.18.5 cheerio@1 pdf-parse@1.1.1
      - name: Construire l'annuaire
        run: |
          set -o pipefail
          node scripts/annuaire/build.mjs 2>&1 | tee scripts/annuaire/build-log.txt
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
      - name: Publier si quelque chose a changé
        if: always()
        run: |
          git config user.name "lerna-annuaire[bot]"
          git config user.email "annuaire@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r assets/annuaire /tmp/out/ && cp scripts/annuaire/build-log.txt /tmp/out/ 2>/dev/null || true
          git fetch -q origin main && git reset -q --hard origin/main
          rm -rf assets/annuaire && cp -r /tmp/out/annuaire assets/annuaire && cp /tmp/out/build-log.txt scripts/annuaire/ 2>/dev/null || true
          git add -A assets/annuaire scripts/annuaire/build-log.txt
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Annuaire mondial : mise à jour automatique ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
