# Métiers et débouchés : fiches métiers officielles de l'Onisep (Idéo, licence ODbL), reliées aux domaines LERNA.
# Reconstruit chaque mois, puis publié par Vercel au prochain déploiement.
name: Métiers et débouchés
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 3 * *'        # le 3 de chaque mois à 4 h 41 UTC
  push:
    branches: [main]
    paths: ['scripts/metiers/*.mjs', '.github/workflows/metiers.yml']
permissions:
  contents: write
concurrency:
  group: metiers
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspecter les fichiers Onisep
        run: |
          node scripts/metiers/inspect.mjs > scripts/metiers/inspect-log.txt 2>&1 || true
          tail -c 3000 scripts/metiers/inspect-log.txt
      - name: Publier le journal
        if: always()
        run: |
          git config user.name "lerna-metiers[bot]"
          git config user.email "metiers@users.noreply.github.com"
          cp scripts/metiers/inspect-log.txt /tmp/log.txt
          git fetch -q origin main && git reset -q --hard origin/main
          cp /tmp/log.txt scripts/metiers/inspect-log.txt
          git add scripts/metiers/inspect-log.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Métiers : journal d'inspection"
          git push origin HEAD:main
