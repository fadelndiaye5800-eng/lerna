# Métiers et débouchés : fiches métiers officielles de l'Onisep (Idéo, licence ODbL), reliées aux domaines LERNA.
# Reconstruit chaque mois, puis publié par Vercel au prochain déploiement.
name: Métiers et débouchés
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 3 * *'        # le 3 de chaque mois à 4 h 41 UTC
  push:
    branches: [main]
    paths: ['scripts/metiers/*.mjs', '.github/workflows/metiers.yml']
permissions:
  contents: write
concurrency:
  group: metiers
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspecter les fichiers Onisep
        run: node scripts/metiers/inspect.mjs
