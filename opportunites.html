  .fact .ic { width: 17px; height: 17px; color: var(--orange); margin-top: 2px; }
  .ocard .foot { margin-top: auto; padding-top: 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .ocard.closed { opacity: .72; }
  .ocard.locked .ghost-line { display: block; height: 14px; border-radius: 8px; background: linear-gradient(90deg, var(--cream-darker), var(--cream-dark)); filter: blur(3px); }
  .ocard.locked .ghost-title { height: 22px; width: 82%; margin-top: 8px; }
  .ocard.locked .ghost-org { width: 46%; }
  .ocard .hidden-note { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--orange-deep); }
  .save-opp { display: inline-flex; align-items: center; gap: 6px; }

  .verified { font-size: .8rem; color: var(--muted); text-align: center; margin: 30px auto 60px; max-width: 560px; }
  .prem-banner { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: var(--panel-grad); color: var(--on-panel); border-radius: 20px; padding: 22px 24px; margin-bottom: 18px; }

  var ME = {};

    var lockedCount = shown.filter(function (o) { return o.masked; }).length;
    $('premBanner').innerHTML = lockedCount
      ? '<div class="prem-banner">' + Lerna.icon('gem', 'ic-lg') + '<div><h3>' + t(st.tab === 'investisseur' ? 'op.premInvTitle' : 'op.premTitle') + '</h3><p>' + t(st.tab === 'investisseur' ? 'op.premInvText' : 'op.premText') + '</p></div><a class="btn btn-primary btn-sm" href="premium.html">' + t('op.premBtn') + '</a></div>'
      : '';
    $('list').innerHTML = shown.length ? shown.map(card).join('') :
      '<div class="empty" style="grid-column:1/-1">' + Lerna.icon('star') + '<h4>' + t('op.none') + '</h4><p>' + t('op.noneSub') + '</p></div>';
    $('verified').textContent = t('op.verified', { d: Lerna.fmtDate(window.LERNA_OPPS_VERIFIED) });
    Lerna.initReveal();
  }

  function full() { renderTabs(); renderFilters(); render(); }

  Lerna.ready(function () {
    full();
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tab]'); if (!b) return;
      st.tab = b.getAttribute('data-tab'); st.dom = st.pays = st.niveau = st.access = '';
      history.replaceState(null, '', '?tab=' + ({ stage: 'stages', bourse: 'bourses', emploi: 'emplois', investisseur: 'investisseurs' })[st.tab]);
      Lerna.sound.play('click'); full();
    });
    $('filters').addEventListener('change', function (e) {
      var s = e.target.closest('[data-f]'); if (!s) return;
      st[s.getAttribute('data-f')] = s.value; if (s.getAttribute('data-f') !== 'sort') s.classList.toggle('on', !!s.value);
      render();
    });
    $('filters').addEventListener('click', function (e) {
      if (!e.target.closest('#reset')) return;
      st.dom = st.pays = st.niveau = st.access = ''; st.sort = 'soon'; renderFilters(); render();
    });
    $('showClosed').addEventListener('change', function (e) { st.closed = e.target.checked; render(); });
    $('guide').addEventListener('toggle', function (e) { if (e.target.id === 'gDet') G.open = e.target.open; }, true);
    $('guide').addEventListener('click', function (e) {
      if (e.target.closest('#projOpen')) { G.proj = true; G.open = true; $('guide').innerHTML = guideHTML(); var f = $('pq1'); if (f) f.focus(); return; }
      var sb = e.target.closest('[data-stade]');
      if (sb) { G.stade = sb.getAttribute('data-stade'); Array.prototype.forEach.call(document.querySelectorAll('[data-stade]'), function (x) { x.classList.toggle('on', x === sb); }); Lerna.sound.play('select'); return; }
      if (e.target.closest('#projGo')) runProj();
    });
    $('list').addEventListener('click', function (e) {
      var fb = e.target.closest('[data-fit]');
      if (fb) { askFit(fb.getAttribute('data-fit')); return; }
      var a = e.target.closest('[data-opp]');
      if (a) {
        var oo = ops().filter(function (x) { return x.id === a.getAttribute('data-opp'); })[0];
        if (oo) { Lerna.me.signal('type', oo.type); DOMS(oo).forEach(function (d) { Lerna.me.signal('dom', d); }); }
        Lerna.sound.play('opportunity'); Lerna.track('opp_open', a.getAttribute('data-opp')); return;
      }
      var r = e.target.closest('[data-report]');
      if (r) return Lerna.reportOpp(r.getAttribute('data-report'));
      var b = e.target.closest('[data-save]');
      if (b) {
        var on = Lerna.oppFavs.toggle(b.getAttribute('data-save'));
        if (on === null) return;
        if (on) Lerna.pop(b);
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
        b.querySelector('span').textContent = t(on ? 'op.saved' : 'op.save');
        Lerna.toast(t(on ? 'op.savedToast' : 'op.unsavedToast'));
      }
    });
    Lerna.onLang(full);
    Lerna.track('opps_visit');
    Lerna.auth.ready.then(function () { render(); window.LERNA_OPPS_UNLOCK().then(function (ok) { if (ok) full(); }); });
  });
})();
</script>
</body>
</html>
