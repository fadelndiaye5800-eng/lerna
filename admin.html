<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administration — LERNA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6EC">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<script src="assets/js/boot.js"></script>
<link rel="stylesheet" href="assets/css/lerna.css">
<style>
  .ad-wrap { padding-top: 26px; padding-bottom: 70px; }
  .ad-head .badge { white-space: normal; }
  .ad-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .ad-head h1 { font-size: clamp(1.6rem, 4.4vw, 2.2rem); }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
  @media (min-width: 760px) { .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .kpi.hot { border-color: var(--orange); }
  .pay-card .amt { font-size: 1.3rem; font-weight: 800; color: var(--brown); }
  .pay-card .det { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; margin: 10px 0 12px; }
  .pay-card .det span { color: var(--muted); }
  .pay-card .det b { font-weight: 700; word-break: break-word; }
  .pill-s.en_attente { background: var(--orange); color: #fff; }
  .pill-s.valide { background: var(--olive-bg); color: var(--olive); }
  .pill-s.refuse { background: var(--cream-dark); }
  .momo-set { max-width: 560px; margin-bottom: 18px; }
  .st-grid { display: grid; gap: 14px; }
  @media (min-width: 900px) { .st-grid.two { grid-template-columns: 1fr 1fr; } }
  .st-card { background: var(--surface); border: 1.5px solid var(--cream-dark); border-radius: 16px; padding: 16px; }
  .st-card h3 { font-size: 1rem; margin-bottom: 4px; }
  .st-card .sub { font-size: .8rem; color: var(--muted); margin-bottom: 12px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--cream-darker); padding-top: 8px; }
  .bars .b { flex: 1; min-width: 3px; background: var(--orange); border-radius: 4px 4px 0 0; position: relative; }
  .bars .b.zero { background: var(--cream-dark); height: 2px !important; border-radius: 2px; }
  .bars .b.err { background: var(--brown); }
  .bars .b:hover { filter: brightness(1.12); }
  .bars-x { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 6px; }
  .rank { display: grid; gap: 8px; }
  .rank .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: .88rem; }
  .rank .r b { font-weight: 700; color: var(--brown); text-align: right; }
  .rank .r .track { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--cream-dark); overflow: hidden; }
  .rank .r .track i { display: block; height: 100%; background: var(--orange); border-radius: 99px; }
  .seg-p { display: inline-flex; background: var(--cream-dark); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 12px; }
  .seg-p button { padding: 7px 12px; border-radius: 9px; font-weight: 700; font-size: .82rem; color: var(--muted); }
  .seg-p button.on { background: var(--surface); color: var(--brown); }
  .u-row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--cream-dark); }
  .u-row:last-child { border-bottom: none; }
  .u-row .who { min-width: 0; }
  .u-row .who strong { display: block; word-break: break-word; }
  .tab .cnt { display: inline-block; margin-left: 6px; background: var(--orange); color: #fff; border-radius: 99px; font-size: .68rem; padding: 1px 7px; }
  .momo-set .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: var(--surface); border: 1.5px solid var(--cream-dark); border-radius: 16px; padding: 14px; }
  .kpi b { display: block; font-size: 1.6rem; font-weight: 800; color: var(--orange); }
  .kpi span { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .tabs-wrap { position: sticky; top: var(--nav-h); z-index: 40; background: var(--bg); margin-bottom: 14px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
  .tbl th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px; border-bottom: 1.5px solid var(--cream-dark); }
  .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--cream-dark); vertical-align: top; }
  .tbl tr.stale td { background: var(--orange-soft); }
  .tbl tr.off td { opacity: .55; }
  .tbl-wrap { overflow-x: auto; background: var(--surface); border: 1.5px solid var(--cream-dark); border-radius: 16px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts .btn { min-height: 34px; padding: 6px 12px; font-size: .78rem; }
  .pill-s { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .72rem; font-weight: 700; background: var(--cream-dark); }
  .pill-s.open, .pill-s.rolling { background: var(--olive-bg); color: var(--olive); }
  .pill-s.urgent { background: var(--orange); color: #fff; }
  .pill-s.closed, .pill-s.stale, .pill-s.unverified, .pill-s.upcoming { background: var(--orange-soft); color: var(--orange-deep); }
  .msg-card { background: var(--surface); border: 1.5px solid var(--cream-dark); border-radius: 16px; padding: 14px 16px; }
  .msg-card + .msg-card { margin-top: 10px; }
  .msg-card .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
  .msg-card p { white-space: pre-wrap; margin: 8px 0 10px; font-size: .92rem; }
  .msg-card.nouveau { border-color: var(--orange); }
  .ab-card { display: grid; gap: 12px; }
  .ab-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--cream-dark); }
  .ab-bar span:first-child { background: #3D1F00; } .ab-bar span:last-child { background: var(--orange); }
  :root[data-theme="dark"] .ab-bar span:first-child { background: #F7EDDC; }
  .json { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; min-height: 320px; }
  .gate { text-align: center; padding: 60px 10px; }
</style>
</head>
<body data-page="admin" data-bottomnav="off">
<div id="lerna-nav"></div>
<main class="container ad-wrap" id="root"></main>

<script src="assets/js/core.js"></script>
<script src="assets/js/questions.js"></script>
<script src="assets/js/data-schools.js"></script>
<script src="assets/js/data-opps.js"></script>
<script>
/* Page réservée à l'équipe (rôle « admin » dans la table users). Toutes les écritures passent par
   Supabase avec la session de l'admin : les règles RLS (is_admin()) refusent tout autre compte. */
(function () {
  var esc = Lerna.esc, L = Lerna.L, A = Lerna.auth, today = new Date().toISOString().slice(0, 10);
  var $ = function (id) { return document.getElementById(id); };
  var tab = (location.hash || '#stats').slice(1), data = { opps: [], reps: [], msgs: [], ab: null, abHist: [], fx: null, momo: null, ai: null, pays: [], users: null, abCounts: null, stats: null, ulist: [], period: 30, uq: '' };
  var TABS = [['stats', 'Statistiques'], ['paiements', 'Paiements'], ['premium', 'Premium et comptes'], ['ia', 'Centre IA'], ['offres', 'Offres'], ['signalements', 'Signalements'], ['messages', 'Messages'], ['ab', 'Tests A/B'], ['fx', 'Taux de change']];
  var live = function () { return A.mode === 'supabase' && A.sb; };
  function toast(m) { Lerna.toast(m, 2200); }
  function days(iso) { var d = Lerna.daysUntil(iso); return d === null ? null : -d; }
  function oppStatus(row) {
    var o = Object.assign({}, row.data || {}, { id: row.slug, deadline: row.date_limite || (row.data && row.data.deadline), verifie: row.verifie || (row.data && row.data.verifie) });
    return window.LERNA_OPP_STATUS(o);
  }

  /* ---------- Chargement ---------- */
  function load() {
    if (!live()) {
      data.opps = window.LERNA_OPPS.map(function (o) { return { slug: o.id, type: o.type, titre: o.masked ? '(Premium, fiche dans Supabase)' : o.titre, organisation: o.organisation || '', date_limite: o.deadline || null, verifie: o.verifie, is_premium: !!o.premium, active: true, data: o }; });
      return Promise.resolve();
    }
    var sb = A.sb;
    return Promise.all([
      sb.from('opportunites').select('id,slug,type,titre,organisation,date_limite,verifie,ouverture,is_premium,active,data').order('date_limite', { ascending: true, nullsFirst: false }),
      sb.from('signalements').select('*').order('created_at', { ascending: false }).limit(200),
      sb.from('messages_contact').select('*').order('created_at', { ascending: false }).limit(200),
      sb.from('app_config').select('key,value,updated_at'),
      sb.from('users').select('id', { count: 'exact', head: true }),
      sb.from('users').select('ab').limit(10000),
      sb.from('paiements_momo').select('*').order('created_at', { ascending: false }).limit(300),
      sb.rpc('lerna_stats', { p_days: data.period }),
      sb.from('users').select('id,email,prenom,nom,pays,date_inscription,is_premium,premium_expiry,role').order('date_inscription', { ascending: false }).limit(1000),
      loadAsks()
    ]).then(function (r) {
      data.stats = r[7] && !r[7].error ? r[7].data : null;
      data.ulist = (r[8] && r[8].data) || [];
      data.opps = r[0].data || []; data.reps = r[1].data || []; data.msgs = r[2].data || [];
      (r[3].data || []).forEach(function (x) { if (x.key === 'ab') data.ab = x.value; if (x.key === 'fx') data.fx = x.value; if (x.key === 'momo') data.momo = x.value; if (x.key === 'ai') data.ai = x.value; if (x.key === 'ab_history') data.abHist = x.value || []; });
      data.pays = r[6].data || [];
      data.users = r[4].count;
      var c = {}; (r[5].data || []).forEach(function (u) { var v = u.ab && u.ab.couleurs; if (v) c[v] = (c[v] || 0) + 1; }); data.abCounts = c;
    });
  }

  /* ---------- Rendu ---------- */
  function render() {
    var u = A.user;
    if (live() && (!u || u.role !== 'admin')) {
      $('root').innerHTML = '<div class="gate">' + Lerna.sticker('lock', 'stk-lg') + '<h1 style="font-size:1.6rem;margin-top:10px">Accès réservé à l’équipe LERNA</h1><p class="muted" style="margin:8px 0 18px">Connecte-toi avec un compte administrateur.</p><a class="btn btn-primary" href="auth.html?redirect=admin.html">Se connecter</a></div>';
      return;
    }
    var stale = data.opps.filter(function (o) { return o.active && oppStatus(o) === 'stale'; }).length;
    var newReps = data.reps.filter(function (x) { return x.statut === 'nouveau'; }).length;
    var newMsgs = data.msgs.filter(function (x) { return x.statut === 'nouveau'; }).length;
    var since = Date.now() - 30 * 864e5;
    var S = data.stats || {};
    var premiumNow = data.ulist.filter(function (x) { return x.is_premium && (!x.premium_expiry || new Date(x.premium_expiry) > new Date()); }).length;
    var rev30 = data.pays.filter(function (x) { return x.statut === 'valide' && new Date(x.traite_at || x.created_at).getTime() > since; }).reduce(function (a, x) { return a + (x.montant || 0); }, 0);
    var h = '<div class="ad-head"><div><span class="eyebrow">Administration</span><h1>Tableau de bord LERNA</h1></div>' +
      (live() ? '<span class="small muted">Connecté : ' + esc(u.email) + '</span>' : '<span class="badge badge-soft">Mode aperçu — Supabase pas encore branché</span>') + '</div>' +
      '<div class="kpis"><div class="kpi"><b>' + (S.visitors_today == null ? '—' : S.visitors_today) + '</b><span>Visiteurs aujourd’hui</span></div>' +
      '<div class="kpi"><b>' + (S.visitors_7 == null ? '—' : S.visitors_7) + '</b><span>Visiteurs (7 jours)</span></div>' +
      '<div class="kpi"><b>' + (data.users === null ? '—' : data.users) + '</b><span>Comptes</span></div>' +
      '<div class="kpi"><b>' + premiumNow + '</b><span>Premium actifs</span></div>' +
      '<div class="kpi' + (rev30 ? ' hot' : '') + '"><b>' + fcfa(rev30) + '</b><span>Revenus (30 jours)</span></div></div>' +
      '<div class="tabs-wrap"><div class="tabs" role="tablist">' + TABS.map(function (x) { var n = { offres: stale, signalements: newReps, messages: newMsgs }[x[0]]; return '<button type="button" class="tab' + (x[0] === tab ? ' active' : '') + '" data-tab="' + x[0] + '">' + x[1] + (n ? '<span class="cnt">' + n + '</span>' : '') + '</button>'; }).join('') + '</div></div>' +
      '<div id="panel">' + ({ stats: pStats, premium: pPremium, ia: pAi, paiements: pPays, offres: pOffres, signalements: pReps, messages: pMsgs, ab: pAb, fx: pFx }[tab] || pOffres)() + '</div>';
    $('root').innerHTML = h;
  }
  /* ---------- Statistiques ---------- */
  var PAGES = { home: 'Accueil', today: 'Aujourd’hui', aujourdhui: 'Aujourd’hui', explorer: 'Explorer', ecole: 'Fiche école', opportunites: 'Opportunités', premium: 'Premium',
    parametres: 'Paramètres', espace: 'Mon espace', questionnaire: 'Questionnaire', resultats: 'Résultats', contact: 'Contact', auth: 'Connexion / inscription', loading: 'Analyse en cours',
    dossier: 'Mon dossier', legal: 'Règles et confidentialité', admin: 'Administration' };
  var FEATS = { questionnaire_done: 'Questionnaire terminé', profile_update: 'Orientation mise à jour', signup: 'Compte créé', premium_view: 'Page Premium ouverte',
    premium_pay_start: 'Paiement commencé', premium_paid: 'Paiement réussi', theme_change: 'Thème changé', data_export: 'Données téléchargées', fav: 'École ajoutée aux favoris', fiche_ask: 'Fiche à compléter demandée' };
  var pg = function (k) { return PAGES[k] || k || '—'; };
  var ft = function (k) { return FEATS[k] || String(k || '').replace(/_/g, ' '); };
  function dur(sec) { if (!sec && sec !== 0) return '—'; sec = +sec; return sec < 60 ? sec + ' s' : Math.floor(sec / 60) + ' min ' + (sec % 60 ? (sec % 60) + ' s' : ''); }
  /* Une barre par jour (jours sans visite compris), survol = détail du jour */
  function dayBars(rows, key, n, label, errKey) {
    var map = {}; (rows || []).forEach(function (r) { map[r.day] = r; });
    var list = [], max = 1;
    for (var i = n - 1; i >= 0; i--) { var d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); var r = map[d] || {}; list.push({ d: d, v: +(r[key] || 0), e: errKey ? +(r[errKey] || 0) : 0 }); max = Math.max(max, +(r[key] || 0)); }
    var fd = function (d) { return new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); };
    return '<div class="bars" role="img" aria-label="' + esc(label) + ' par jour">' + list.map(function (x) {
      var tip = fd(x.d) + ' : ' + x.v + ' ' + label + (errKey && x.e ? ' (' + x.e + ' erreurs)' : '');
      return x.v ? '<span class="b' + (errKey && x.e && x.e === x.v ? ' err' : '') + '" style="height:' + Math.max(4, Math.round(x.v * 100 / max)) + '%" title="' + esc(tip) + '"></span>' : '<span class="b zero" title="' + esc(tip) + '"></span>';
    }).join('') + '</div><div class="bars-x"><span>' + fd(list[0].d) + '</span><span>max ' + max + '</span><span>' + fd(list[list.length - 1].d) + '</span></div>';
  }
  function rank(rows, labelFn, key, sub) {
    if (!rows || !rows.length) return '<p class="small muted">Pas encore de données.</p>';
    var max = Math.max.apply(null, rows.map(function (r) { return +r[key] || 0; }).concat([1]));
    return '<div class="rank">' + rows.map(function (r) {
      return '<div class="r"><span>' + esc(labelFn(r)) + (sub ? ' <span class="xsmall muted">' + esc(sub(r)) + '</span>' : '') + '</span><b>' + (+r[key] || 0) + '</b><span class="track"><i style="width:' + Math.round((+r[key] || 0) * 100 / max) + '%"></i></span></div>';
    }).join('') + '</div>';
  }
  function periodSeg() { return '<div class="seg-p" role="group" aria-label="Période">' + [[7, '7 jours'], [30, '30 jours'], [90, '90 jours']].map(function (x) { return '<button type="button" data-period="' + x[0] + '" class="' + (data.period === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>'; }
  /* Fiches que les élèves demandent de compléter (bouton « Demander à LERNA de compléter cette fiche ») */
  function loadAsks() {
    return A.sb.from('events').select('sid,meta').eq('ev', 'fiche_ask').gte('at', new Date(Date.now() - data.period * 864e5).toISOString()).limit(5000).then(function (r) {
      if (r.error) return;
      var by = {};
      (r.data || []).forEach(function (e) {
        var m = e.meta || {}, k = m.k; if (!k) return;
        var x = by[k] || (by[k] = { k: k, name: m.n || k, cc: m.cc || '', who: {} });
        x.who[e.sid] = 1;
      });
      data.asks = Object.keys(by).map(function (k) { var x = by[k]; x.n = Object.keys(x.who).length; return x; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 30);
    }, function () {});
  }
  function askLink(x) {
    var k = String(x.k);
    if (/^fr-uai:/.test(k)) return 'fiche.html?uai=' + encodeURIComponent(k.slice(7));
    return x.cc ? 'fiche.html?cc=' + encodeURIComponent(x.cc) + '&id=' + encodeURIComponent(k) : '';
  }
  function pStats() {
    if (!live()) return '<p class="muted">Disponible une fois Supabase branché.</p>';
    var S = data.stats;
    if (!S) return '<p class="muted">Les statistiques s’affichent dès que la base est à jour (code SQL à coller dans Supabase).</p>';
    var n = data.period;
    return periodSeg() +
      '<div class="kpis"><div class="kpi"><b>' + S.visitors_n + '</b><span>Visiteurs (' + n + ' j)</span></div><div class="kpi"><b>' + S.views_n + '</b><span>Pages vues</span></div>' +
      '<div class="kpi"><b>' + dur(S.avg_seconds) + '</b><span>Temps moyen par page</span></div><div class="kpi"><b>' + S.signups_n + '</b><span>Inscriptions</span></div>' +
      '<div class="kpi"><b>' + S.payments_n + '</b><span>Paiements · ' + fcfa(S.revenue_n) + '</span></div></div>' +
      '<div class="st-grid"><div class="st-card"><h3>Visiteurs par jour</h3><p class="sub">Personnes différentes (appareils) ; survole une barre pour le détail.</p>' + dayBars(S.per_day, 'visitors', n, 'visiteurs') + '</div></div>' +
      '<div class="st-grid two" style="margin-top:14px"><div class="st-card"><h3>Pages les plus vues</h3><p class="sub">Nombre d’ouvertures</p>' + rank(S.top_pages, function (r) { return pg(r.page); }, 'n', function (r) { return r.people + ' pers.'; }) + '</div>' +
      '<div class="st-card"><h3>Pages de sortie</h3><p class="sub">Dernière page vue avant de quitter l’app</p>' + rank(S.exit_pages, function (r) { return pg(r.page); }, 'n') + '</div></div>' +
      '<div class="st-grid" style="margin-top:14px"><div class="st-card"><h3>Fonctions utilisées</h3><p class="sub">Actions faites dans l’app sur la période</p>' + rank(S.features, function (r) { return ft(r.ev); }, 'n', function (r) { return r.people + ' pers.'; }) + '</div></div>' +
      '<div class="st-grid" style="margin-top:14px"><div class="st-card"><h3>Fiches à compléter en premier</h3><p class="sub">Demandées par les élèves (bouton « Demander à LERNA de compléter cette fiche ») · nombre de personnes</p>' +
        (data.asks && data.asks.length ? '<div class="rank">' + data.asks.map(function (x) { var l = askLink(x), mx = data.asks[0].n || 1; return '<div class="r"><span>' + (l ? '<a href="' + esc(l) + '" target="_blank" rel="noopener">' + esc(x.name) + '</a>' : esc(x.name)) + (x.cc ? ' <span class="xsmall muted">' + esc(x.cc) + '</span>' : '') + '</span><b>' + x.n + '</b><span class="track"><i style="width:' + Math.round(x.n * 100 / mx) + '%"></i></span></div>'; }).join('') + '</div>' : '<p class="small muted">Pas encore de demande.</p>') + '</div></div>' +
      '<p class="xsmall muted" style="margin-top:10px">Tes propres visites ne sont pas comptées. Les personnes qui ont coupé « Statistiques » dans Paramètres non plus.</p>';
  }
  /* ---------- Centre IA ---------- */
  function pAi() {
    if (!live()) return '<p class="muted">Disponible une fois Supabase branché.</p>';
    var c = data.ai || { actif: true, plafond_jour: 3000 }, S = data.stats || {}, pv = Lerna.config.aiProviders || {};
    var tot = (S.ai_modes || []).reduce(function (a, x) { return a + x.n; }, 0), err = (S.ai_modes || []).reduce(function (a, x) { return a + x.errors; }, 0), gq = (S.ai_modes || []).reduce(function (a, x) { return a + x.groq; }, 0);
    var MODES = { chat: 'Assistant (chat)', analyse: 'Analyse d’orientation', admin_offre: 'Préparer une offre (admin)', offre: 'Analyse d’offre', projet: 'Projet', cv: 'CV', lettre: 'Lettre' };
    return periodSeg() +
      '<div class="kpis"><div class="kpi"><b>' + tot + '</b><span>Appels IA (' + data.period + ' j)</span></div><div class="kpi"><b>' + err + '</b><span>Erreurs</span></div>' +
      '<div class="kpi"><b>' + (tot ? Math.round(gq * 100 / tot) : 0) + ' %</b><span>Réponses par Groq (secours)</span></div>' +
      '<div class="kpi"><b>' + (pv.claude ? 'Oui' : 'Non') + '</b><span>Clé Claude</span></div><div class="kpi"><b>' + (pv.groq ? 'Oui' : 'Non') + '</b><span>Clé Groq</span></div></div>' +
      '<div class="st-grid two"><section class="st-card"><h3>Réglages</h3><p class="sub">Modèle principal : ' + esc(pv.model || 'claude-haiku-5-5') + '</p><div class="stack">' +

  }
  function setAb(test, v) {
    var ab = Object.assign({}, data.ab || {}); ab[test] = v;
    var hist = (data.abHist || []).concat([{ test: test, value: v, at: new Date().toISOString(), by: A.user.email }]).slice(-50);
    Promise.all([
      A.sb.from('app_config').upsert({ key: 'ab', value: ab, updated_at: new Date().toISOString(), updated_by: A.user.id }),
      A.sb.from('app_config').upsert({ key: 'ab_history', value: hist, updated_at: new Date().toISOString(), updated_by: A.user.id })
    ]).then(function (r) {
      if (r[0].error) return toast('Erreur : ' + r[0].error.message);
      try { sessionStorage.removeItem('lerna_cfg'); } catch (e) {}
      toast(v === 'test' ? 'Test relancé' : 'Version ' + v.toUpperCase() + ' donnée à tout le monde'); reload();
    });
  }

  Lerna.ready(function () {
    $('root').innerHTML = '<p class="muted" style="padding:40px 0">Chargement…</p>';
    A.ready.then(function () { return load(); }).then(render, function () { render(); });
    document.addEventListener('input', function (e) {
      if (e.target.id !== 'uSearch') return;
      data.uq = e.target.value; var pos = e.target.selectionStart; render();
      var i = $('uSearch'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} }
    });
    document.addEventListener('click', function (e) {
      var b;
      if ((b = e.target.closest('[data-tab]'))) { tab = b.getAttribute('data-tab'); history.replaceState(null, '', '#' + tab); render(); return; }
      if ((b = e.target.closest('[data-period]'))) {
        data.period = +b.getAttribute('data-period');
        Promise.all([A.sb.rpc('lerna_stats', { p_days: data.period }).then(function (r) { if (!r.error) data.stats = r.data; }), loadAsks()]).then(render, render);
        return;
      }
      if ((b = e.target.closest('[data-prem]'))) {
        var d = +b.getAttribute('data-d'), uid = b.getAttribute('data-prem'), who = data.ulist.filter(function (x) { return x.id === uid; })[0];
        if (!confirm((d ? 'Ajouter ' + (d >= 365 ? '1 an' : '1 mois') + ' de Premium à ' : 'Retirer le Premium de ') + (who ? who.email : 'ce compte') + ' ?')) return;
        A.sb.rpc('lerna_admin_premium', { p_user: uid, p_days: d }).then(function (r) { toast(r.error ? 'Erreur : ' + r.error.message : d ? 'Premium ajouté' : 'Premium retiré'); reload(); });
        return;
      }
      if (!live()) return;
      if ((b = e.target.closest('[data-act]'))) {
        var act = b.getAttribute('data-act'), o = find(b.getAttribute('data-id'));
        if (act === 'new') return editModal(null);
        if (act === 'edit' && o) return editModal(o);
        if (act === 'verify' && o) {
          var d = Object.assign({}, o.data || {}, { verifie: today });
          A.sb.from('opportunites').update({ verifie: today, data: d }).eq('id', o.id).then(function (r) { toast(r.error ? 'Erreur : ' + r.error.message : 'Marquée vérifiée aujourd’hui'); reload(); });
          return;
        }
        if (act === 'toggle' && o) { A.sb.from('opportunites').update({ active: o.active === false }).eq('id', o.id).then(function () { reload(); }); return; }
        if (act === 'ai') {
          var ai = { actif: $('aiOn').checked, plafond_jour: Math.max(0, parseInt($('aiCap').value, 10) || 0) };
          A.sb.from('app_config').upsert({ key: 'ai', value: ai, updated_at: new Date().toISOString(), updated_by: A.user.id }).then(function (r) { toast(r.error ? 'Erreur : ' + r.error.message : 'Réglages IA enregistrés (actifs sous 1 minute)'); reload(); });
          return;
        }
        if (act === 'paydiag') {
          var box = $('payDiag'); box.textContent = 'Test en cours…';
          Lerna.api('/api/pay', { action: 'diag' }, { timeout: 40000 }).then(function (r) {
            var d = r.data || {};
            if (!r.ok) { box.textContent = 'Erreur : ' + (d.error || 'pas de réponse du serveur'); return; }
            var ok = d.test && d.test.ok;
            var line = function (k, v) { return '<div><span class="muted">' + k + ' :</span> <b>' + esc(String(v)) + '</b></div>'; };
            box.innerHTML = '<div class="pill-s ' + (ok ? 'valide' : 'refuse') + '" style="display:inline-block;margin-bottom:8px">' + (ok ? 'Connexion OK' : 'Connexion refusée') + '</div>' +
              (d.ancien ? '<div style="margin-bottom:8px;padding:10px 12px;border-radius:12px;background:var(--orange-soft)"><b>Ancienne version du site :</b> ' + esc(String(d.site)) + '. Ouvre <a href="https://lerna-lilac.vercel.app/admin.html">lerna-lilac.vercel.app</a> et refais le test.</div>' : '') + line('Adresse testée', d.site) + (d.version ? line('Version du site', d.version) : '') + line('Service utilisé', d.provider) + line('Réglage PAY_PROVIDER', d.pay_provider_var) + line('Mode PayDunya', d.mode) +
              line('Clé MASTER', d.paydunya && d.paydunya.master) + line('Clé PRIVATE', d.paydunya && d.paydunya.private) + line('TOKEN', d.paydunya && d.paydunya.token) +
              line('Clé SasPay', d.saspay) +
              (d.test ? line('Réponse du service', (d.test.http ? 'HTTP ' + d.test.http + ' ' : '') + (d.test.code ? 'code ' + d.test.code + ' ' : '') + (d.test.message || (ok ? 'OK' : ''))) : '') +
              (d.test_paydunya ? line('Test PayDunya (secours)', 'HTTP ' + d.test_paydunya.http + (d.test_paydunya.code ? ' code ' + d.test_paydunya.code : '') + ' ' + (d.test_paydunya.message || '')) : '') +
              (d.conseil ? '<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--orange-soft)"><b>Que faire :</b> ' + esc(d.conseil) + '</div>' : '') +
              ((d.echecs || []).length ? '<div style="margin-top:12px"><b>Derniers échecs de paiement</b>' + d.echecs.map(function (e) { var m = e.meta || {}; return '<div style="padding:7px 0;border-top:1px solid var(--cream-dark)">' + dt(e.at) + ' · ' + esc(m.p || '') + ' · ' + esc(m.step || '') + (m.method ? ' (' + esc(m.method) + ')' : '') + '<br>' + esc(m.msg || '') + '</div>'; }).join('') + '</div>' : '');
          });
          return;
        }
        if (act === 'momo') {
          var mm = { prix_mois: parseInt($('mmPm').value, 10), prix_an: parseInt($('mmPa').value, 10), actif: $('mmOn').checked };
          var pk = parseInt($('mmPp').value, 10); if (pk >= 200) mm.prix_pack = pk;
          if (!(mm.prix_mois >= 200) || !(mm.prix_an >= 200)) return toast('Prix invalide');
          A.sb.from('app_config').upsert({ key: 'momo', value: mm, updated_at: new Date().toISOString(), updated_by: A.user.id }).then(function (r) {
            try { sessionStorage.removeItem('lerna_cfg'); } catch (e) {}
            toast(r.error ? 'Erreur : ' + r.error.message : 'Réglages enregistrés'); reload();
          });
          return;
        }
        if (act === 'fx') {
          var fx = { EUR: +$('fxEur').value, XOF: +$('fxXof').value, date: $('fxDate').value };
          if (!(fx.EUR > 0 && fx.XOF > 0 && /^\d{4}-\d{2}-\d{2}$/.test(fx.date))) return toast('Valeurs invalides');
          A.sb.from('app_config').upsert({ key: 'fx', value: fx, updated_at: new Date().toISOString(), updated_by: A.user.id }).then(function (r) { toast(r.error ? 'Erreur : ' + r.error.message : 'Taux enregistrés'); reload(); });
          return;
        }
      }
      if ((b = e.target.closest('[data-pay]'))) {
        var dec = b.getAttribute('data-v'), pid = b.getAttribute('data-pay');
        var pp = data.pays.filter(function (x) { return x.id === pid; })[0];
        if (!pp) return;
        var q = 'À faire seulement si tu vois ce paiement de ' + fcfa(pp.montant) + ' comme réussi dans ton compte ' + (pp.provider === 'saspay' ? 'SasPay' : 'PayDunya') + '.\n\nActiver le Premium de ' + (pp.email || 'cet élève') + ' pour ' + (pp.formule === 'an' ? '1 an' : pp.formule === 'pack' ? '6 mois (Pack Candidature)' : '1 mois') + ' ?';
        if (!confirm(q)) return;
        b.disabled = true;
        A.sb.rpc('lerna_momo_traiter', { p_id: pid, p_decision: dec }).then(function (r) {
          if (r.error) { b.disabled = false; return toast('Erreur : ' + r.error.message); }
          toast(dec === 'valide' ? 'Premium activé' : 'Paiement refusé'); reload();
        });
        return;
      }
      if ((b = e.target.closest('[data-rep]'))) { A.sb.from('signalements').update({ statut: b.getAttribute('data-v') }).eq('id', b.getAttribute('data-rep')).then(reload); return; }
      if ((b = e.target.closest('[data-msg]'))) { A.sb.from('messages_contact').update({ statut: b.getAttribute('data-v') }).eq('id', b.getAttribute('data-msg')).then(reload); return; }
      if ((b = e.target.closest('[data-ab]'))) {
        var v = b.getAttribute('data-v'), k = b.getAttribute('data-ab');
        if (v !== 'test' && !confirm('Arrêter le test « ' + k + ' » et donner la version ' + v.toUpperCase() + ' à tout le monde ?')) return;
        setAb(k, v);
      }
    });
  });
})();
</script>
</body>
</html>
