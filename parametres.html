<style>
  .st-wrap { padding: 28px 0 70px; display: grid; gap: 26px; }
  @media (min-width: 960px) { .st-wrap { grid-template-columns: 230px minmax(0, 1fr); align-items: start; } }
  .avs { display: flex; gap: 8px; flex-wrap: wrap; }
  .av { border: 1.5px solid var(--cream-darker); border-radius: 12px; padding: 9px 14px; background: var(--white); font-weight: 600; font-size: .86rem; color: var(--brown); cursor: pointer; }
  .av.on { border-color: var(--orange); background: var(--orange-soft); }
  .av.guess { border-style: dashed; }
  .st-nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; position: sticky; top: var(--nav-h); z-index: 30; background: var(--bg); padding: 10px 0; margin: 0 -4px; }
  .st-nav::-webkit-scrollbar { display: none; }
  .st-nav a { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 99px; border: 1.5px solid var(--cream-dark); text-decoration: none; font-weight: 600; font-size: .86rem; color: var(--brown); white-space: nowrap; }
  .st-nav a .ic { width: 16px; height: 16px; color: var(--orange); }
  .st-nav a.on { background: var(--orange-soft); color: var(--brown); border-color: var(--orange); }
  .st-nav a.on .ic { color: var(--orange); }
  @media (min-width: 960px) {
    .st-nav { flex-direction: column; top: calc(var(--nav-h) + 20px); padding: 0; margin: 0; background: none; }
    .st-nav a { border: none; border-radius: 12px; padding: 11px 12px; font-size: .92rem; }
    .st-nav a:hover { background: var(--cream-dark); }
  }
  .st-head h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); }
  .st-head p { color: var(--muted); margin-top: 6px; }
  .sec { scroll-margin-top: calc(var(--nav-h) + 70px); }
  .sec h2 { font-size: 1.25rem; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sec h2 .stk { width: 34px; height: 34px; }
  .group { background: var(--surface); border: 1.5px solid var(--cream-dark); border-radius: 20px; overflow: hidden; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--cream-dark); flex-wrap: wrap; }
  .item:last-child { border-bottom: none; }
  .item-txt { flex: 1; min-width: 200px; }
  .item-txt strong { display: block; font-size: .96rem; }
  .item-txt span { display: block; font-size: .82rem; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .item.col { flex-direction: column; align-items: stretch; }
  .switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch .tr { position: absolute; inset: 0; border-radius: 99px; background: var(--cream-darker); transition: background .2s; }
  .switch .tr::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
  .switch input:checked + .tr { background: var(--orange); }
  .switch input:checked + .tr::after { transform: translateX(20px); }
  .switch input:focus-visible + .tr { outline: 3px solid rgba(232, 100, 12, .5); outline-offset: 2px; }
  .segc { display: inline-flex; flex-wrap: wrap; background: var(--cream-dark); border-radius: 14px; padding: 4px; gap: 4px; }
  .segc button { padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: .86rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .segc button .ic { width: 16px; height: 16px; }
  .segc button.on { background: var(--surface); color: var(--brown); box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
  .sel-sm { width: auto; min-width: 140px; padding: 10px 40px 10px 14px; font-size: .9rem; }
  .acct { display: flex; gap: 14px; align-items: center; }
  .acct .avatar { width: 54px; height: 54px; font-size: 1.15rem; }
  .danger { color: var(--orange-deep) !important; border-color: var(--orange-deep) !important; }
  .two { display: grid; gap: 12px; }
  @media (min-width: 640px) { .two { grid-template-columns: 1fr 1fr; } }
  .ref-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; letter-spacing: .14em; font-size: 1.1rem; background: var(--cream); border-radius: 10px; padding: 6px 12px; }
  .ver { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 18px; }
  .ab-note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
  .st-search { position: relative; margin: 14px 0 8px; }
  .st-search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .st-search .input { padding-left: 42px; border-radius: 14px; }
  .st-empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .item-link { text-decoration: none; color: var(--brown); }
  .item-link .ic { color: var(--muted); }
  .item-link:hover { background: var(--cream); }

    /* Compte */

        '<form class="item col" id="acctForm"><div class="two"><div class="field"><label for="fPseudo">' + t('st.pseudo') + '</label><input class="input" id="fPseudo" maxlength="24" autocomplete="nickname" value="' + esc(u.pseudo || '') + '"></div>' +
          '<div class="field"><label for="fPrenom">' + t('st.prenom') + '</label><input class="input" id="fPrenom" maxlength="60" autocomplete="given-name" value="' + esc(u.prenom || '') + '"></div>' +
          '<div class="field"><label for="fNom">' + t('st.nom') + '</label><input class="input" id="fNom" maxlength="60" autocomplete="family-name" value="' + esc(u.nom || '') + '"></div></div>' +
          '<div><button type="submit" class="btn btn-primary btn-sm">' + t('st.save') + '</button></div></form>' +
        (u.role === 'admin' ? item('Tableau de bord propriétaire', '', '<a class="btn btn-primary btn-sm" href="admin.html">Ouvrir</a>') : '') +
        item(t('st.pw'), '', '<button type="button" class="btn btn-ghost btn-sm" id="pwBtn">' + t('st.pwBtn') + '</button>') +
        item(t('st.logout'), '', '<button type="button" class="btn btn-ghost btn-sm" data-logout>' + Lerna.icon('logout', 'ic-sm') + t('st.logout') + '</button>') +
        item(t('st.delete'), t('st.deleteSub'), '<button type="button" class="btn btn-ghost btn-sm danger" id="delBtn">' + t('st.delete') + '</button>'));
    } else {
      h += sec('compte', 'st.sCompte', 'unlock', item(t('st.guest'), t('st.guestSub'),
        '<div class="row"><a class="btn btn-primary btn-sm" href="auth.html?mode=signup&redirect=parametres.html">' + t('st.signup') + '</a><a class="btn btn-ghost btn-sm" href="auth.html?redirect=parametres.html">' + t('st.login') + '</a></div>'));
    }

    /* Apparence */
    var th = p.theme, shown = P.theme();
    var themeCur = th === 'light' || th === 'dark' || th === 'auto' ? th : shown;
    h += sec('apparence', 'st.sApparence', 'palette',
      item(t('st.theme'), '',
        seg('theme', themeCur, [['light', t('st.light'), 'sun'], ['dark', t('st.dark'), 'moon'], ['auto', t('st.auto'), 'settings']])) +
      item(t('st.text'), '', seg('textSize', p.textSize, [['normal', t('st.normal')], ['large', t('st.large')]])) +
      item(t('st.motion'), '', sw('reduceMotion', p.reduceMotion, t('st.motion'))));

    /* Langue */
    h += sec('langue', 'st.sLangue', 'speaking', item(t('st.lang'), '', seg('lang', Lerna.lang, [['fr', 'Français'], ['en', 'English']])));

    /* Notifications */
    var N = Lerna.notify, state;
    if (N.needsInstall()) state = '<span class="small muted">' + t('st.nIos') + '</span>';
    else if (!N.supported()) state = '<span class="small muted">' + t('st.nUnsupported') + '</span>';
    else if (Notification.permission === 'granted') state = '<span class="badge badge-olive">' + t('st.nOn') + '</span>';
    else if (Notification.permission === 'denied') state = '<span class="small muted" style="max-width:320px">' + t('st.nDenied') + '</span>';
    else state = '<button type="button" class="btn btn-primary btn-sm" id="notifOn">' + Lerna.icon('bell', 'ic-sm') + t('st.nEnable') + '</button>';
    var quietOk = function (hh) { var a = +p.quietStart, b = +p.quietEnd; return a > b ? !(hh >= a || hh < b) : !(hh >= a && hh < b); };
    var hours = [9, 12, 14, 18, 20].filter(quietOk);
    var hourOpts = function (list, cur) { return list.map(function (x) { return '<option value="' + x + '"' + (+cur === x ? ' selected' : '') + '>' + x + ' h</option>'; }).join(''); };
    h += sec('notifications', 'st.sNotif', 'bell',
      item(t('st.nState'), '', state) +
      '<div class="item col"><div class="item-txt"><strong>' + t('st.nTypes') + '</strong></div></div>' +
      [['bourses', 'st.nBourses'], ['deadlines', 'st.nDeadlines'], ['mission', 'st.nMission'], ['parcours', 'st.nParcours'], ['news', 'st.nNews']].map(function (x) {
        return item(t(x[1]), '', sw('notif.' + x[0], p.notif[x[0]], t(x[1])));
      }).join('') +
      item(t('st.nHour'), '', '<select class="select sel-sm" data-num="notifHour" aria-label="' + esc(t('st.nHour')) + '">' + hourOpts(hours, p.notifHour) + '</select>') +
      item(t('st.quiet'), '', '<div class="row" style="gap:8px"><span class="small muted">' + t('st.from') + '</span><select class="select sel-sm" style="min-width:96px" data-num="quietStart">' + hourOpts([20, 21, 22, 23], p.quietStart) + '</select><span class="small muted">' + t('st.to') + '</span><select class="select sel-sm" style="min-width:96px" data-num="quietEnd">' + hourOpts([5, 6, 7, 8, 9], p.quietEnd) + '</select></div>') +
      item(t('st.nMax'), '', seg('notifMax', p.notifMax, [['day', t('st.nMaxDay')], ['2w', t('st.nMax2w')], ['week', t('st.nMaxWeek')]])));

    /* Sons */
    h += sec('sons', 'st.sSons', 'headphones',
      item(t('st.sounds'), '', sw('sounds', Lerna.sound.enabled, t('st.sounds'))) +
      item(t('st.vib'), '', sw('vibrations', p.vibrations, t('st.vib'))));

    /* Mon orientation */
    var prof = store.get('lerna_profile', null), c = Lerna.country();
    var curLabel = { XOF: 'FCFA', EUR: 'Euro (€)', USD: 'Dollar ($)' };
    var autoC = p.currency, detected = Lerna.currencyAuto();
    var targets = prof && prof.answers ? window.LERNA_ANSWER_TEXT(window.LERNA_QUESTION('q13'), prof.answers, Lerna.lang) : '';
    h += sec('orientation', 'st.sOrientation', 'compass',
      item(t('st.oCountry'), '', '<strong>' + (c ? Lerna.flag(c, 'stk-xs') + ' ' + esc(window.LERNA_COUNTRY_NAME(c)) : '—') + '</strong>') +
      item(t('st.oCurrency'), '',
        '<select class="select sel-sm" data-str="currency" aria-label="' + esc(t('st.oCurrency')) + '">' +
          '<option value="auto"' + (autoC === 'auto' ? ' selected' : '') + '>' + esc(t('st.oAuto', { c: curLabel[detected] })) + '</option>' +
          ['XOF', 'EUR', 'USD'].map(function (k) { return '<option value="' + k + '"' + (autoC === k ? ' selected' : '') + '>' + curLabel[k] + '</option>'; }).join('') + '</select>') +
      (prof ? item(t('st.oTargets'), esc(targets || '—'), '<a class="btn btn-ghost btn-sm" href="questionnaire.html?update=1&go=1">' + t('st.change') + '</a>') +
        item(t('st.oUpdate'), '', '<a class="btn btn-primary btn-sm" href="questionnaire.html?update=1&go=1">' + t('st.go') + '</a>') +
        item(t('st.oRedo'), '', '<a class="btn btn-ghost btn-sm" href="questionnaire.html?start=1" id="redo">' + t('st.go') + '</a>')
        : item(t('st.oNone'), '', '<a class="btn btn-primary btn-sm" href="questionnaire.html">' + t('st.oStart') + '</a>')));

    /* Mon accueil */
    var hid = p.homeHidden || [];
    h += sec('accueil', 'st.sAccueil', 'house',
      item(t('st.hGoal'), '', seg('missionsGoal', p.missionsGoal, [[1, '1'], [3, '3'], [5, '5']])) +
      '<div class="item col"><div class="item-txt"><strong>' + t('st.hBlocks') + '</strong></div></div>' +
      [['parcours', 'st.hParcours'], ['dossier', 'st.hDossier'], ['bourse', 'st.hBourse'], ['mot', 'st.hMot'], ['ecoles', 'st.hEcoles'], ['invite', 'st.hInvite']].map(function (x) {
        return item(t(x[1]), '', '<label class="switch"><input type="checkbox" data-block="' + x[0] + '"' + (hid.indexOf(x[0]) === -1 ? ' checked' : '') + ' aria-label="' + esc(t(x[1])) + '"><span class="tr"></span></label>');
      }).join(''));

    /* Ce que LERNA sait de toi */
    var me = Lerna.me.get();
    var domName = function (d) { var x = (window.LERNA_DOMAINS || []).filter(function (z) { return z.id === d; })[0]; return x ? Lerna.L(x.label) : d; };
    h += sec('savoir', 'st.sKnow', 'thinking',
      item(t('st.kAvatar'), '', '<div class="avs">' + [['h', 'st.avH'], ['f', 'st.avF'], ['x', 'st.avX']].map(function (a) {
        return '<button type="button" class="av' + (me.genre === a[0] ? ' on' : '') + (me.genre === a[0] && me.genreDevine ? ' guess' : '') + '" data-av="' + a[0] + '" title="' + esc(t(a[1])) + '" aria-pressed="' + (me.genre === a[0]) + '">' + t(a[1]) + '</button>';
      }).join('') + '</div>', true) +
      item(t('st.kBirth'), me.age ? t('st.kAge', { n: me.age }) : '', '<input class="input" type="date" id="kBirth" style="max-width:190px" value="' + esc(me.naissance || '') + '" max="' + new Date().toISOString().slice(0, 10) + '">') +
      item(t('st.kCountry'), '', '<strong>' + esc(me.pays ? window.LERNA_COUNTRY_NAME(me.pays) : '—') + '</strong>') +
      item(t('st.kLevel'), '', '<strong>' + esc(me.niveau || '—') + '</strong>') +
      item(t('st.kDoms'), '', '<strong>' + esc(me.domaines.length ? me.domaines.map(domName).join(', ') : t('st.kNone')) + '</strong>') +
      item(t('st.kSeen'), '', me.vus.length ? '<div class="row" style="gap:8px;flex-wrap:wrap;justify-content:flex-end"><strong>' + esc(me.vus.map(domName).join(', ')) + '</strong><button type="button" class="btn btn-ghost btn-sm" id="kForget">' + t('st.kForget') + '</button></div>' : '<strong>' + t('st.kNone') + '</strong>'));

    /* Confidentialité */
    h += sec('confidentialite', 'st.sPrivacy', 'shield',
      item(t('st.pLoc'), '', seg('location', p.location, [['auto', t('st.pLocAuto')], ['never', t('st.pLocNever')]]), true) +
      item(t('st.pPublic'), '', sw('profilePublic', p.profilePublic !== false, t('st.pPublic'))) +
      item(t('st.pStats'), '', sw('analytics', p.analytics !== false, t('st.pStats'))) +
      item(t('st.pExport'), '', '<button type="button" class="btn btn-ghost btn-sm" id="exportBtn">' + Lerna.icon('download', 'ic-sm') + t('st.pExportBtn') + '</button>') +
      item(t('st.pClear'), '', '<button type="button" class="btn btn-ghost btn-sm" id="clearBtn">' + Lerna.icon('trash', 'ic-sm') + t('st.pClearBtn') + '</button>'));

    /* Abonnement et parrainage */
    var open = !Lerna.config.premiumEnabled, paid = u && Lerna.isPaidPremium && Lerna.isPaidPremium();
    h += sec('abonnement', 'st.sAbo', 'gem',
      item(t('st.aState'), '', '<span class="badge ' + (paid ? 'badge-orange' : 'badge-cream') + '">' + t(paid ? 'st.aPremium' : 'st.aFree') + '</span>') +
      (paid && u.portal_url ? item(t('st.aManage'), '', '<a class="btn btn-ghost btn-sm" href="' + esc(u.portal_url) + '" target="_blank" rel="noopener">' + t('st.go') + '</a>') : (!paid ? item(t('st.aSee'), '', '<a class="btn btn-primary btn-sm" href="premium.html?src=settings">' + t('st.aSee') + '</a>') : '')) +
      (u ? item(t('st.aRef'), t('st.aRefSub', { n: Math.min(3, Lerna.referral.confirmed()) }), '<div class="row" style="gap:8px"><span class="ref-code">' + esc(Lerna.referral.code()) + '</span><button type="button" class="btn btn-ghost btn-sm" data-share="native">' + Lerna.icon('share', 'ic-sm') + t('st.aShare') + '</button></div>')
         : item(t('st.aRef'), t('st.aRefGuest'), '<a class="btn btn-ghost btn-sm" href="auth.html?mode=signup&redirect=parametres.html">' + t('st.signup') + '</a>')));

    /* Aide */
    h += sec('aide', 'st.sAide', 'mailbox',
      item(t('st.help'), '', '<div class="row" style="gap:8px"><a class="btn btn-primary btn-sm" href="contact.html">' + t('st.contact') + '</a><a class="btn btn-ghost btn-sm" href="contact.html?sujet=probleme">' + t('st.report') + '</a></div>') +
      '<a class="item item-link" href="index.html?decouvrir=1"><div class="item-txt"><strong>' + t('nav.discover') + '</strong></div>' + Lerna.icon('arrowR', 'ic-sm') + '</a>' +
      (Lerna.install.available() ? item(t('st.install'), '', '<button type="button" class="btn btn-ghost btn-sm" id="installBtn">' + Lerna.icon('download', 'ic-sm') + t('st.installBtn') + '</button>') : ''));
    h += sec('legal', 'st.sLegal', 'scroll',
      [['conditions', 'st.lTerms'], ['abonnement', 'st.lSub'], ['confidentialite', 'st.lPrivacy'], ['cookies', 'st.lCookies'], ['ia', 'st.lAi'], ['mentions', 'st.lNotice']].map(function (x) {
        return '<a class="item item-link" href="legal.html#' + x[0] + '"><div class="item-txt"><strong>' + t(x[1]) + '</strong></div>' + Lerna.icon('arrowR', 'ic-sm') + '</a>';
      }).join(''));
    h += '<p class="ver">© ' + new Date().getFullYear() + ' LERNA' + (u && u.role === 'admin' ? ' · A/B : ' + Lerna.ab.variant('couleurs').toUpperCase() : '') + '</p>';

    $('root').innerHTML = h;
    $('stNav').innerHTML = SECS.map(function (x) { return '<a href="#' + x[0] + '" data-sec="' + x[0] + '">' + Lerna.icon(x[2]) + t(x[1]) + '</a>'; }).join('');
    spy();
    if (query) applySearch();
  }

  /* ---------- Recherche dans les réglages ---------- */
  var query = '';
  var norm = function (x) { return String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
  var SYN = { notifications: 'notif alerte rappel push message heure calme', apparence: 'theme sombre clair marron creme couleur dark light texte taille animation',
    langue: 'langue francais anglais english language', sons: 'son vibration bruit', compte: 'compte profil mot de passe email deconnexion supprimer pseudo nom prenom',
    orientation: 'pays devise fcfa euro dollar questionnaire destination', accueil: 'accueil aujourd hui missions blocs', savoir: 'genre naissance age pays niveau domaines',
    confidentialite: 'confidentialite donnees vie privee localisation statistiques telecharger effacer historique', abonnement: 'premium abonnement paiement parrainage code ami wave orange money',
    aide: 'aide contact probleme signaler installer', legal: 'legal conditions cgu regles politique confidentialite remboursement mentions abonnement paiement' };
  function applySearch() {
    var q = norm(query).trim(), any = false;
    Lerna.qsa('#root .sec').forEach(function (sec) {
      var head = norm(sec.querySelector('h2').textContent) + ' ' + (SYN[sec.id] || '');
      var secHit = !q || head.indexOf(q) !== -1, shown = 0;
      Lerna.qsa('.group > *', sec).forEach(function (it) {
        var ok = secHit || norm(it.textContent).indexOf(q) !== -1;
        it.hidden = !ok; if (ok) shown++;
      });
      sec.hidden = !shown; if (shown) any = true;
    });
    var e = $('stEmpty'); if (e) e.hidden = any;
    var nav = $('stNav'); if (nav) nav.hidden = !!q;
  }

  /* Section visible → puce active */
  var io = null;
  function spy() {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        Lerna.qsa('#stNav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-sec') === e.target.id); });
        var on = document.querySelector('#stNav a.on'); if (on && window.innerWidth < 960) on.scrollIntoView({ block: 'nearest', inline: 'center' });
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    Lerna.qsa('.sec').forEach(function (s) { io.observe(s); });
  }

  function setNotif(k, v) { var n = Object.assign({}, P.get('notif')); n[k] = v; P.set('notif', n); }
  function saved() { Lerna.toast(t('st.saved') + ' ✓', 1200); }

  Lerna.ready(function () {
    render();
    Lerna.auth.ready.then(render);
    Lerna.onLang(render);
    var R = $('root');
    R.addEventListener('input', function (e) {
      if (e.target.id !== 'stSearch') return;
      query = e.target.value; applySearch();
    });
    R.addEventListener('change', function (e) {
      if (e.target.id === 'kBirth') { Lerna.me.set({ naissance: e.target.value }); saved(); render(); return; }
      var el = e.target, k;
      if ((k = el.getAttribute('data-pref'))) {
        if (k.indexOf('notif.') === 0) setNotif(k.slice(6), el.checked);
        else if (k === 'sounds') Lerna.sound.set(el.checked);
        else if (k === 'analytics') {
          P.set('analytics', el.checked);
          try { if (window.posthog) { if (el.checked) window.posthog.opt_in_capturing(); else window.posthog.opt_out_capturing(); } } catch (err) {}
        } else P.set(k, el.checked);
        if (k === 'vibrations' && el.checked && navigator.vibrate) navigator.vibrate(30);
        saved(); return;
      }
      if ((k = el.getAttribute('data-num'))) {
        P.set(k, +el.value);
        if (k === 'quietStart' || k === 'quietEnd') render();
        saved(); return;
      }
      if ((k = el.getAttribute('data-str'))) { P.set(k, el.value); saved(); Lerna.emit('lerna:country', Lerna.country()); return; }
      if ((k = el.getAttribute('data-block'))) {
        var hid = (P.get('homeHidden') || []).filter(function (x) { return x !== k; });
        if (!el.checked) hid.push(k);
        P.set('homeHidden', hid); saved(); return;
      }
    });
    R.addEventListener('click', function (e) {
      var av = e.target.closest('[data-av]');
      if (av) { Lerna.me.set({ genre: av.getAttribute('data-av') }); Lerna.pop(av); Lerna.sound.play('select'); saved(); render(); return; }
      if (e.target.closest('#kForget')) { Lerna.store.del('lerna_signals'); Lerna.toast(t('st.kForgot')); render(); return; }
      var b = e.target.closest('[data-seg]');
      if (b) {
        var k = b.getAttribute('data-seg'), v = b.getAttribute('data-v');
        if (k === 'lang') { Lerna.setLang(v); return; }
        if (k === 'theme') {
          var from = P.theme();
          P.set('theme', v);
          Lerna.analytics.capture('theme_change', { from: from, to: v, ab_couleurs: Lerna.ab.variant('couleurs') });
        } else if (k === 'missionsGoal') P.set(k, +v);
        else if (k === 'location') { P.set(k, v); if (v === 'never') store.del('lerna_geo'); }
        else P.set(k, v);
        Lerna.sound.play('select');
        render(); saved(); return;
      }
      if (e.target.closest('#notifOn')) { Lerna.notify.ask().then(render); return; }
      if (e.target.closest('#exportBtn')) { Lerna.account.exportData(); return; }
      if (e.target.closest('#installBtn')) { Lerna.install.prompt(); return; }
      if (e.target.closest('#clearBtn')) {
        if (confirm(t('st.pClearConfirm'))) { Lerna.account.clearHistory(); Lerna.toast(t('st.pCleared')); }
        return;
      }
      if (e.target.closest('#pwBtn')) {
        var u = Lerna.auth.user; if (!u) return;
        Lerna.auth.resetPassword(u.email).then(function () { Lerna.toast(t('st.pwSent', { email: u.email }), 4000); }, function () { Lerna.toast(t('common.error')); });
        return;
      }
      if (e.target.closest('#redo')) { Lerna.store.del('lerna_progress'); return; }
      if (e.target.closest('[data-share]')) { Lerna.referral.share('native'); return; }
      if (e.target.closest('#delBtn')) {
        var user = Lerna.auth.user;
        Lerna.modal('<div class="modal-head"><h3>' + t('st.delTitle') + '</h3><button class="modal-close" data-close aria-label="' + t('common.close') + '">' + Lerna.icon('x') + '</button></div><p>' + t('st.delText') + '</p>' +
          '<div class="row" style="margin-top:22px"><button type="button" class="btn btn-ghost" data-close>' + t('common.cancel') + '</button><button type="button" class="btn btn-brown" id="delYes">' + t('st.delConfirm') + '</button></div>', function (m) {
          m.querySelector('#delYes').addEventListener('click', function () { Lerna.account.remove(this, t('st.deleted')); });
        });
      }
    });
    R.addEventListener('submit', function (e) {
      if (e.target.id !== 'acctForm') return;
      e.preventDefault();
      var v = function (id) { return $(id).value.trim(); };
      Lerna.auth.updateProfile({ pseudo: v('fPseudo').slice(0, 24), prenom: v('fPrenom'), nom: v('fNom') })
        .then(function () { Lerna.sound.play('success'); saved(); render(); }, function () { Lerna.toast(t('common.error')); });
    });
    Lerna.on('lerna:auth', render);
  });
})();
</script>
