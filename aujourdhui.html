<style>
  .td { padding: 22px 0 64px; }
  .td .container { max-width: 760px; }
  .td-stack { display: flex; flex-direction: column; gap: 16px; }

  /* En-tête */
  .hello { display: flex; align-items: center; gap: 14px; }
  .hello .stk { width: 58px; height: 58px; animation: wave 2.2s ease-in-out 1; transform-origin: 70% 80%; }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 15%, 45% { transform: rotate(14deg); } 30%, 60% { transform: rotate(-8deg); } }
  .hello h1 { font-size: clamp(1.7rem, 6vw, 2.4rem); }
  .hello p { color: var(--muted); font-size: .92rem; margin-top: 2px; }
  .hello .hello-sub { color: var(--orange-deep); font-weight: 700; }
  .chips-top { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--white); border: 1.5px solid var(--cream-dark); border-radius: 99px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: .86rem; text-decoration: none; }
  .pill .stk { width: 24px; height: 24px; }

  /* Bloc générique */
  .blk { background: var(--white); border: 1.5px solid var(--cream-dark); border-radius: 22px; padding: 20px; scroll-margin-top: calc(var(--nav-h) + 12px); }
  .blk-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .blk-h .stk { width: 46px; height: 46px; }
  .blk-h h2 { font-size: 1.25rem; line-height: 1.2; }
  .blk-h p { color: var(--muted); font-size: .84rem; margin-top: 2px; }
  .blk-h .grow { flex: 1; min-width: 0; }
  @media (max-width: 480px) { .blk { padding: 16px 14px; border-radius: 20px; } }

  /* Parcours (série de jours) + niveau */
  .journey { background: var(--panel-grad); color: var(--on-panel); border: none; position: relative; overflow: hidden; }
  .journey h2, .journey .big { color: var(--on-panel); }
  .journey .blk-h p { color: var(--on-panel-muted); }
  .journey .big { font-family: var(--font-head); font-weight: 800; font-size: 2.6rem; line-height: 1; }
  .journey .big small { font-family: var(--font-body); font-size: .95rem; font-weight: 600; color: var(--on-panel-muted); margin-left: 6px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 16px 0 6px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .7rem; font-weight: 700; color: var(--on-panel-muted); text-transform: uppercase; }
  .wd i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--on-panel-line); display: flex; align-items: center; justify-content: center; font-style: normal; }
  .wd.on i { background: var(--orange); border-color: var(--orange); }
  .wd.on i .stk { width: 22px; height: 22px; }
  .wd.today { color: var(--on-panel); }
  .wd.today i { box-shadow: 0 0 0 3px rgba(232, 100, 12, .35); }
  .level { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--on-panel-line); }
  .level .stk { width: 44px; height: 44px; }
  .level .grow { flex: 1; min-width: 0; }
  .level-top { display: flex; justify-content: space-between; gap: 8px; font-size: .86rem; font-weight: 700; margin-bottom: 6px; }
  .level-top span:last-child { color: var(--on-panel-muted); font-weight: 600; }
  .journey .bar { background: var(--on-panel-line); }
  .start-dots { display: flex; gap: 8px; margin-top: 12px; }
  .start-dots i { width: 40px; height: 8px; border-radius: 99px; background: var(--on-panel-line); }
  .start-dots i.on { background: var(--orange); }

  /* Missions */
  .mission { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1.5px solid var(--cream-dark); text-decoration: none; transition: border-color .15s, background .15s; }
  .mission + .mission { margin-top: 8px; }
  .mission .stk { width: 44px; height: 44px; }
  .mission .grow { flex: 1; min-width: 0; font-weight: 600; line-height: 1.35; }
  .mission .go { color: var(--orange); display: flex; }
  .mission .ck { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--cream-darker); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mission.done { background: rgba(232, 100, 12, .06); border-color: rgba(232, 100, 12, .35); }
  .mission.done .grow { text-decoration: line-through; color: var(--muted); }
  .mission.done .ck { background: var(--orange); border-color: var(--orange); color: #fff; }
  .mission.done .ck .ic { width: 16px; height: 16px; stroke-width: 3; }
  .mission.done .go { display: none; }
  .m-prog { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: .84rem; font-weight: 700; color: var(--muted); }
  .m-prog .bar { flex: 1; }

  /* Bourse du jour */
  .opp-day h3 { font-size: 1.15rem; margin: 2px 0 6px; }
  .opp-day .org { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .opp-day .facts { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 14px; font-size: .9rem; }
  .opp-day .facts span { display: flex; gap: 8px; align-items: flex-start; }
  .opp-day .facts .ic { width: 17px; height: 17px; color: var(--orange); margin-top: 2px; }

  /* Mot + quiz */
  .duo { display: grid; gap: 16px; }
  @media (min-width: 720px) { .duo { grid-template-columns: 1fr 1fr; } }
  .word-term { font-family: var(--font-head); font-weight: 800; font-size: 1.45rem; color: var(--brown); margin-bottom: 6px; }
  .word-def { color: var(--brown); line-height: 1.6; }
  .quiz-q { font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
  .quiz-a { display: flex; flex-direction: column; gap: 8px; }
  .quiz-a button { text-align: left; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--cream-darker); background: var(--white); font-weight: 600; transition: all .15s; }
  .quiz-a button:hover { border-color: var(--brown); }
  .quiz-a button.good { background: rgba(232, 100, 12, .12); border-color: var(--orange); color: var(--orange-deep); }
  .quiz-a button.bad { background: var(--cream-dark); border-color: var(--cream-darker); color: var(--muted); text-decoration: line-through; }
  .quiz-a button[disabled] { cursor: default; }
  .quiz-why { margin-top: 12px; font-size: .9rem; background: var(--cream); border-radius: 12px; padding: 10px 12px; }

  /* Écoles */
  .sch { display: flex; align-items: center; gap: 12px; padding: 10px 4px; text-decoration: none; border-bottom: 1px solid var(--cream-dark); }
  .sch:last-child { border-bottom: none; }
  .sch .flg { width: 36px; height: 36px; }
  .sch .grow { flex: 1; min-width: 0; }
  .sch h4 { font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sch .sub { font-size: .8rem; color: var(--muted); }
  .score { font-family: var(--font-head); font-weight: 800; color: var(--orange); font-size: 1.1rem; }
  .sch.lock .lk { width: 36px; height: 36px; border-radius: 12px; background: var(--cream-dark); display: flex; align-items: center; justify-content: center; }
  .dl { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: .9rem; }
  .dl .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Invitation, mise à jour, alertes */
  .inv-prog { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-weight: 700; }
  .soft { background: var(--cream-dark); border-color: var(--cream-dark); }
  .ask-form { display: flex; gap: 8px; }
  .ask-form .input { flex: 1; min-width: 0; }
  .ask-form .btn { padding-left: 18px; padding-right: 18px; }
</style>

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var t = Lerna.t, esc = Lerna.esc, L = Lerna.L, D = Lerna.daily, store = Lerna.store;
  var profile = store.get('lerna_profile', null);
  if (!profile) return;
  var answers = profile.answers || {};

  function results() { return store.get('lerna_results', null); }
  function topSchool() {
    var r = results(); if (!r || !r.recos) return null;
    for (var i = 0; i < r.recos.length; i++) {
      if (Lerna.recoAccess(i) !== 'open') continue;
      var s = window.LERNA_RECO_SCHOOL(r.recos[i]);
      if (s) return s;
    }
    return null;
  }
  function ctx() {
    return { top: topSchool(), results: results(), logged: Lerna.isLogged(), premium: Lerna.isPremium(), unlocked: Lerna.referral.unlocked(), favs: Lerna.favs.list().length,
      goal: +Lerna.prefs.get('missionsGoal') || 3, dossier: dossierToday() };
  }
  /* Étape de dossier du jour : choisie une fois par jour, pour que la mission ne change pas après l'avoir faite */
  function dossierToday() {
    if (!window.LERNA_DOSSIER_NEXT) return null;
    var k = store.get('lerna_dossier_day', null);
    if (k && k.d === Lerna.today()) {
      var sc = window.LERNA_SCHOOL(k.school), dd = Lerna.dossiers.get(k.school);
      if (sc && dd) {
        var g = dd.guide && window.LERNA_GUIDES[dd.guide] ? window.LERNA_GUIDES[dd.guide] : window.LERNA_GUIDE_FOR(sc, Lerna.country(), answers);
        var st = g && g.steps.filter(function (x) { return x.id === k.step; })[0];
        if (st) return { school: sc, step: st };
      }
    }
    var n = window.LERNA_DOSSIER_NEXT(Lerna.country(), answers);
    if (n) store.set('lerna_dossier_day', { d: Lerna.today(), school: n.school.id, step: n.step.id });
    return n;
  }
  function missionDone(m) {
    if (m.id === 'explore') { var top = topSchool(), l = D.log().ev.school_view || []; return l.some(function (x) { return !top || x !== top.id; }); }
    if (m.id === 'account') return Lerna.isLogged();
    return D.did(m.ev, m.needId || undefined);
  }

  /* ---------- En-tête ---------- */
  function header() {
    var u = Lerna.auth.user, s = D.streak(), lv = D.level();
    var date = new Date().toLocaleDateString(Lerna.lang === 'en' ? 'en-GB' : 'fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    /* Salutation selon l'heure, avec le pseudo une fois inscrit (« Tu ne dors pas encore, Fadel ? ») */
    var slot = Lerna.slot(), sub = Lerna.greetingSub();
    var img = { night: 'moon', late: 'moon', early: 'sunrise', morning: 'sun', noon: 'sun', afternoon: 'wave', evening: 'wave' }[slot] || 'wave';
    return '<section class="hello">' + Lerna.sticker(img) + '<div><h1>' + esc(Lerna.greeting(u ? Lerna.displayName(u) : '')) + '</h1><p>' + esc(date.charAt(0).toUpperCase() + date.slice(1)) + '</p>' +
      (sub ? '<p class="hello-sub">' + esc(sub) + '</p>' : '') + '</div></section>' +
      '<div class="chips-top">' +
        (s.started ? '<a class="pill" href="#parcours">' + Lerna.sticker('fire') + s.days + '</a>' : '') +
        '<a class="pill" href="#parcours">' + Lerna.sticker(lv.cur.img) + esc(L(lv.cur.label)) + '</a>' +
        '<a class="pill" href="#missions">' + Lerna.sticker('target') + t('td.mDone', { n: missionsDoneCount(), t: MISS.length }) + '</a>' +
      '</div>';
  }

  /* ---------- Parcours + niveau ---------- */
  function journey() {
    var s = D.streak(), lv = D.level(), v = D.visits();
    var h = '<section class="blk journey" id="parcours"><div class="blk-h">' + Lerna.sticker('fire') + '<div class="grow">';
    if (s.started) {
      h += '<h2 class="big">' + s.days + '<small>' + t('td.days') + '</small></h2><p>' + t('td.journeySub') + '</p></div></div>';
      var days = {}; v.days.forEach(function (d) { days[d] = 1; });
      var now = new Date(), dow = (now.getDay() + 6) % 7, monday = Lerna.addDays(Lerna.today(), -dow);
      var names = Lerna.lang === 'en' ? ['M', 'T', 'W', 'T', 'F', 'S', 'S'] : ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
      h += '<div class="week" aria-hidden="true">' + names.map(function (n, i) {
        var key = Lerna.addDays(monday, i), on = !!days[key];
        return '<div class="wd' + (on ? ' on' : '') + (key === Lerna.today() ? ' today' : '') + '"><i>' + (on ? Lerna.sticker('fire') : '') + '</i>' + n + '</div>';
      }).join('') + '</div>';
    } else {
      h += '<h2>' + t('td.journeyStart') + '</h2><p>' + t('td.journeyStartSub', { n: Math.min(3, v.days.length) }) + '</p>' +
        '<div class="start-dots">' + [0, 1, 2].map(function (i) { return '<i class="' + (i < v.days.length ? 'on' : '') + '"></i>'; }).join('') + '</div></div></div>';
    }
    h += '<div class="level">' + Lerna.sticker(lv.cur.img) + '<div class="grow"><div class="level-top"><span>' + t('td.level', { level: L(lv.cur.label) }) + '</span><span>' +
      (lv.next ? t('td.next', { n: lv.next.min - lv.xp, level: L(lv.next.label) }) : t('td.max')) + '</span></div>' +
      '<div class="bar"><span style="width:' + lv.pct + '%"></span></div></div></div></section>';
    return h;
  }

  /* ---------- Missions ---------- */
  var MISS = null;
  function missionsDoneCount() { if (!MISS) MISS = window.LERNA_DAILY.missions(ctx()); return MISS.filter(missionDone).length; }
  function missions() {
    MISS = window.LERNA_DAILY.missions(ctx());
    var done = MISS.filter(missionDone).length;
    return '<section class="blk" id="missions"><div class="blk-h">' + Lerna.sticker('target') + '<div class="grow"><h2>' + t('td.missions') + '</h2><p>' + (MISS.length === 1 ? t('td.missionsSub1') : t('td.missionsSub', { n: MISS.length })) + '</p></div></div>' +
      MISS.map(function (m) {
        var ok = missionDone(m);
        return '<a class="mission' + (ok ? ' done' : '') + '" href="' + esc(m.href) + '" data-mission="' + m.id + '">' + Lerna.sticker(m.img) +
          '<span class="grow">' + esc(L(m.title).replace('{school}', m.school || '')) + '</span><span class="go" aria-hidden="true">' + Lerna.icon('arrowR', 'ic-sm') + '</span>' +
          '<span class="ck" aria-hidden="true">' + (ok ? Lerna.icon('check') : '') + '</span></a>';
      }).join('') +
      '<div class="m-prog"><div class="bar"><span style="width:' + Math.round(done * 100 / Math.max(1, MISS.length)) + '%"></span></div><span>' + t('td.mDone', { n: done, t: MISS.length }) + '</span></div></section>';
  }
  function checkBonus() {
    if (!MISS) return;
    var done = MISS.filter(missionDone).length;
    if (done === MISS.length && !D.did('mission_bonus')) {
      Lerna.track('mission_bonus');
      setTimeout(function () { Lerna.celebrate({ img: 'trophy', title: t('td.allDone'), text: t('td.allDoneText') }); }, 400);
    }
  }

  /* ---------- Bourse du jour ---------- */
  function bourse() {
    var o = window.LERNA_DAILY.bourse(answers);
    var h = '<section class="blk opp-day" id="bourse"><div class="blk-h">' + Lerna.sticker('medal') + '<div class="grow"><h2>' + t('td.bourse') + '</h2><p>' + t('td.bourseSub') + '</p></div></div>';
    if (!o) return h + '<p class="muted">' + t('td.bourseNone') + '</p></section>';
    var dla = window.LERNA_OPP_DEADLINE(o), dl = dla ? Lerna.daysUntil(dla) : null;
    var lvTxt = window.LERNA_OPP_LEVELS(o).map(function (k) { return L(window.LERNA_LEVELS[k]); }).join(', ');
    if (o.masked) {
      h += '<h3>' + esc(window.LERNA_OPP_TITLE(o)) + '</h3><div class="facts">' +
        (lvTxt ? '<span>' + Lerna.icon('cap') + esc(lvTxt) + '</span>' : '') +
        (dla ? '<span>' + Lerna.icon('calendar') + Lerna.fmtDate(dla) + (dl !== null && dl <= 30 ? ' · J-' + dl : '') + '</span>' : '') + '</div>' +
        '<a class="btn btn-brown btn-sm" href="premium.html">' + Lerna.icon('lock', 'ic-sm') + t('td.unlock') + '</a></section>';
      return h;
    }
    var saved = Lerna.oppFavs.has(o.id);
    h += '<div class="org">' + esc(o.organisation) + '</div><h3>' + esc(o.titre) + '</h3><div class="facts">' +
      '<span>' + Lerna.icon('dollar') + esc(L(o.montant)) + '</span>' +
      (o.eligibles ? '<span>' + Lerna.icon('globe') + esc(L(o.eligibles)) + '</span>' : '') +
      '<span>' + Lerna.icon('calendar') + (dla ? Lerna.fmtDate(dla) + (dl !== null && dl <= 30 ? ' · J-' + dl : '') : esc(t('td.rolling'))) + '</span></div>' +
      '<div class="row">' + (o.lien ? '<a class="btn btn-primary btn-sm" href="' + esc(o.lien) + '" target="_blank" rel="noopener" data-oppopen="' + o.id + '">' + t('td.see') + '</a>' : '') +
      '<button type="button" class="btn btn-ghost btn-sm save-opp' + (saved ? ' on' : '') + '" data-save="' + o.id + '">' + Lerna.icon('bookmark', 'ic-sm') + '<span>' + t(saved ? 'td.saved' : 'td.save') + '</span></button>' +
      '<a class="btn-link" href="opportunites.html?tab=bourses">' + t('td.allOpps') + ' →</a></div></section>';
    return h;
  }

  /* ---------- Mot + quiz ---------- */
  function wordQuiz() {
    var w = window.LERNA_DAILY.word(), q = window.LERNA_DAILY.quiz();
    var read = D.did('word_read'), qs = store.get('lerna_quiz_day', null), answered = qs && qs.d === Lerna.today() ? qs : null;
    var h = '<div class="duo"><section class="blk" id="mot"><div class="blk-h">' + Lerna.sticker('bulb') + '<div class="grow"><h2>' + t('td.word') + '</h2><p>' + t('td.wordSub') + '</p></div></div>' +
      '<p class="word-term">' + esc(L(w.term)) + '</p><p class="word-def">' + esc(L(w.def)) + '</p>' +
      '<button type="button" class="btn ' + (read ? 'btn-ghost is-disabled' : 'btn-brown') + ' btn-sm" style="margin-top:14px" id="wordOk">' + t(read ? 'td.understoodDone' : 'td.understood') + '</button></section>';
    h += '<section class="blk" id="quiz"><div class="blk-h">' + Lerna.sticker('puzzle') + '<div class="grow"><h2>' + t('td.quiz') + '</h2><p>' + t('td.quizSub') + '</p></div></div>' +
      '<p class="quiz-q">' + esc(L(q.q)) + '</p><div class="quiz-a">' + q.a.map(function (a, i) {
        var cls = answered ? (i === q.ok ? 'good' : (i === answered.pick ? 'bad' : '')) : '';
        return '<button type="button" data-qa="' + i + '" class="' + cls + '"' + (answered ? ' disabled' : '') + '>' + esc(L(a)) + '</button>';
      }).join('') + '</div>' +
      (answered ? '<p class="quiz-why"><strong>' + t(answered.pick === q.ok ? 'td.right' : 'td.wrong') + '</strong> ' + esc(L(q.why)) + '</p>' : '') + '</section></div>';
    return h;
  }

  /* ---------- Écoles + échéances ---------- */
  function schools() {
    var r = results(), h = '<section class="blk" id="ecoles"><div class="blk-h">' + Lerna.sticker('cap') + '<div class="grow"><h2>' + t('td.schools') + '</h2><p>' + t('td.schoolsSub') + '</p></div></div>';
    if (r && r.recos) {
      h += r.recos.slice(0, 5).map(function (x, i) {
        if (Lerna.recoAccess(i) !== 'open') return '<a class="sch lock" href="resultats.html#reco-' + (i + 1) + '"><span class="lk">' + Lerna.icon('lock', 'ic-sm') + '</span><div class="grow"><h4>' + t('td.locked', { n: i + 1 }) + '</h4></div></a>';
        var s = window.LERNA_RECO_SCHOOL(x), rc = s ? s.pays : window.LERNA_RECO_CC(x);
        return '<a class="sch" href="' + esc(window.LERNA_RECO_LINK(x)) + '">' + (rc ? Lerna.flag(rc) : Lerna.sticker('cap', 'flg')) +
          '<div class="grow"><h4>' + esc(x.nom) + '</h4><div class="sub">' + esc([x.ville, x.pays].filter(Boolean).join(', ')) + '</div></div><span class="score">' + (parseInt(x.score, 10) || 0) + '%</span></a>';
      }).join('');
      h += '<a class="btn-link" href="resultats.html" style="display:inline-block;margin-top:10px">' + t('td.seeAll') + '</a>';
    }
    // Échéances : offres sauvegardées + candidatures + rappels
    var items = [], saved = Lerna.oppFavs.list();
    (window.LERNA_OPPS || []).forEach(function (o) {
      var dla = window.LERNA_OPP_DEADLINE(o);
      if (!dla || saved.indexOf(o.id) === -1) return;
      var d = Lerna.daysUntil(dla); if (d !== null && d >= 0 && d <= 60) items.push({ title: window.LERNA_OPP_TITLE(o), d: d, date: dla });
    });
    store.get('lerna_tracker', []).forEach(function (x) { if (x.date) { var d = Lerna.daysUntil(x.date); if (d !== null && d >= 0 && d <= 60) items.push({ title: x.name, d: d, date: x.date }); } });
    store.get('lerna_reminders', []).forEach(function (x) { var d = Lerna.daysUntil(x.date); if (d !== null && d >= 0 && d <= 60) items.push({ title: x.title, d: d, date: x.date }); });
    (window.LERNA_DOSSIER_DATES ? window.LERNA_DOSSIER_DATES(Lerna.country(), answers) : []).forEach(function (x) { var d = Lerna.daysUntil(x.date); if (d !== null && d >= 0 && d <= 60) items.push({ title: x.title, d: d, date: x.date }); });
    items.sort(function (a, b) { return a.d - b.d; });
    h += '<h3 style="font-size:1rem;margin:18px 0 6px">' + t('td.deadlines') + '</h3>' +
      (items.length ? items.slice(0, 4).map(function (x) {
        return '<div class="dl">' + Lerna.icon('calendar', 'ic-sm') + '<span class="grow">' + esc(x.title) + '</span><span class="badge ' + (x.d <= 7 ? 'badge-urgent' : 'badge-cream') + '">J-' + x.d + '</span></div>';
      }).join('') : '<p class="small muted">' + t('td.noDeadline') + '</p>');
    return h + '</section>';
  }

  /* ---------- Invitation ---------- */
  function invite() {
    var R = Lerna.referral, r = results();
    if (!r || !r.recos || r.recos.length < 3 || Lerna.isPaidPremium()) return '';
    if (R.unlocked()) return '';
    var conf = Math.min(R.confirmed(), R.needed);
    var dots = ''; for (var k = 0; k < R.needed; k++) dots += '<span class="ref-dot' + (k < conf ? ' on' : '') + '">' + (k < conf ? Lerna.sticker('check') : '') + '</span>';
    return '<section class="blk soft" id="invite"><div class="blk-h">' + Lerna.sticker('envelope') + '<div class="grow"><h2>' + t('td.invite') + '</h2><p>' + t(Lerna.config.premiumEnabled ? 'td.inviteSub' : 'td.inviteSubFree') + '</p></div></div>' +
      '<div class="inv-prog"><div class="ref-dots">' + dots + '</div><span>' + t('td.inviteCount', { n: conf }) + '</span></div>' +
      (Lerna.isLogged()
        ? '<div class="share-row"><a class="btn btn-wa btn-sm" href="' + esc(Lerna.referral.waHref()) + '" target="_blank" rel="noopener" data-share="whatsapp">' + Lerna.icon('chat', 'ic-sm') + t('ref.whatsapp') + '</a>' +
          (navigator.share ? '<button type="button" class="btn btn-white btn-sm" data-share="native">' + Lerna.icon('share', 'ic-sm') + t('ref.share') + '</button>' : '') +
          '<button type="button" class="btn btn-white btn-sm" data-share="copy">' + Lerna.icon('copy', 'ic-sm') + t('ref.copy') + '</button></div>'
        : '<a class="btn btn-brown btn-block" href="auth.html?mode=signup&redirect=aujourdhui.html">' + t('td.inviteSignup') + '</a>') +
      '</section>';
  }

  /* ---------- Mise à jour mensuelle, alertes, installation, assistant ---------- */
  function extras() {
    var h = '';
    var since = new Date(profile.updated || profile.completed || Date.now());
    var age = Math.floor((Date.now() - since.getTime()) / 864e5);
    if (age >= 30) {
      h += '<section class="blk soft"><div class="blk-h">' + Lerna.sticker('calendar-spiral') + '<div class="grow"><h2>' + t('td.update', { n: age }) + '</h2><p>' + t('td.updateSub') + '</p></div></div>' +
        '<a class="btn btn-primary btn-sm" href="questionnaire.html?update=1&go=1">' + t('td.updateBtn') + '</a></section>';
    }
    if (Lerna.notify.canAsk()) {
      var ios = Lerna.notify.needsInstall();
      h += '<section class="blk" id="alertes"><div class="blk-h">' + Lerna.sticker('bell') + '<div class="grow"><h2>' + t('td.notify') + '</h2><p>' + t('td.notifySub') + '</p></div></div>' +
        (ios ? '<p class="small muted" style="margin-bottom:12px">' + t('td.notifyIos') + '</p>' : '') +
        '<div class="row"><button type="button" class="btn btn-primary btn-sm" id="notifyYes">' + t('td.notifyYes') + '</button><button type="button" class="btn btn-ghost btn-sm" id="notifyLater">' + t('td.notifyLater') + '</button></div></section>';
    } else if (Lerna.install.available() && D.visits().days.length >= 2) {
      h += '<section class="blk"><div class="blk-h">' + Lerna.sticker('mobile') + '<div class="grow"><h2>' + t('td.install') + '</h2><p>' + t('td.installSub') + '</p></div></div>' +
        '<button type="button" class="btn btn-brown btn-sm" id="installBtn">' + t('td.installBtn') + '</button></section>';
    }
    h += '<section class="blk"><div class="blk-h">' + Lerna.sticker('speech') + '<div class="grow"><h2>' + t('td.ask') + '</h2><p>' + t('td.askSub') + '</p></div></div>' +
      '<form class="ask-form" id="askForm"><label class="sr-only" for="askIn">' + t('td.ask') + '</label><input class="input" id="askIn" maxlength="300" placeholder="' + esc(t('td.askPh')) + '" autocomplete="off"><button class="btn btn-primary" type="submit">' + t('td.askBtn') + '</button></form></section>';
    h += '<p class="center small"><a class="btn-link" href="questionnaire.html?start=1" id="redo">' + t('td.redo') + '</a></p>';
    return h;
  }

  /* ---------- Mon dossier ---------- */
  function dossierBlk() {
    var n = window.LERNA_DOSSIER_NEXT ? window.LERNA_DOSSIER_NEXT(Lerna.country(), answers) : null;
    var h = '<section class="blk" id="dossier"><div class="blk-h">' + Lerna.sticker('folder') + '<div class="grow"><h2>' + t('td.dossier') + '</h2><p>' + t('td.dossierSub') + '</p></div></div>';
    if (n) {
      var pct = Math.round(n.done * 100 / Math.max(1, n.total));
      return h + '<p class="small muted">' + esc(n.school.nom) + '</p><p style="margin:4px 0 10px"><strong>' + t('td.dossierNext') + ' :</strong> ' + esc(L(n.step.title)) + '</p>' +
        '<div class="m-prog"><div class="bar"><span style="width:' + pct + '%"></span></div><span>' + n.done + '/' + n.total + '</span></div>' +
        '<div class="row" style="margin-top:12px"><a class="btn btn-primary btn-sm" href="dossier.html?ecole=' + n.school.id + '#etapes">' + t('td.dossierGo') + '</a><a class="btn-link" href="dossier.html">' + t('td.dossierAll') + '</a></div></section>';
    }
    var top = topSchool();
    if (!top || Lerna.dossiers.ids().length) return Lerna.dossiers.ids().length ? h + '<a class="btn btn-ghost btn-sm" href="dossier.html">' + t('td.dossierAll') + '</a></section>' : '';
    return h + '<p>' + esc(t('td.dossierStart', { s: top.nom })) + '</p><a class="btn btn-primary btn-sm" style="margin-top:12px" href="dossier.html?ecole=' + top.id + '">' + t('td.dossierStartBtn') + '</a></section>';
  }

  /* Blocs que la personne a masqués dans Paramètres → Mon accueil */
  function render() {
    MISS = null;
    var hidden = Lerna.prefs.get('homeHidden') || [];
    var show = function (k, fn) { return hidden.indexOf(k) === -1 ? fn() : ''; };
    $('root').innerHTML = header() + show('parcours', journey) + missions() + show('dossier', dossierBlk) + show('bourse', bourse) + show('mot', wordQuiz) + show('ecoles', schools) + show('invite', invite) + extras();
    checkBonus();
  }

  Lerna.ready(function () {
    if (!window.LERNA_DAILY) return;
    render();
    var rr = Lerna.debounce(render, 120);
    Lerna.auth.ready.then(function () {
      render();
      Lerna.referral.refresh().then(rr);
      window.LERNA_OPPS_UNLOCK().then(function (ok) { if (ok) rr(); });
    });
    Lerna.onLang(render);
    Lerna.on('lerna:referral', rr);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) rr(); });
    document.addEventListener('click', function (e) {
      var el;
      if ((el = e.target.closest('[data-share]'))) { Lerna.referral.share(el.getAttribute('data-share'), el.tagName === 'A'); setTimeout(rr, 300); return; }
      if ((el = e.target.closest('[data-qa]'))) {
        var q = window.LERNA_DAILY.quiz(), pick = +el.getAttribute('data-qa'), good = pick === q.ok;
        store.set('lerna_quiz_day', { d: Lerna.today(), pick: pick });
        Lerna.track('quiz_answer'); if (good) Lerna.track('quiz_correct');
        Lerna.sound.play(good ? 'success' : 'error');
        render();
        var qq = $('quiz'); if (qq) qq.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return;
      }
      if (e.target.closest('#wordOk')) { if (!D.did('word_read')) { Lerna.track('word_read'); Lerna.sound.play('select'); render(); } return; }
      if ((el = e.target.closest('[data-save]'))) {
        var on = Lerna.oppFavs.toggle(el.getAttribute('data-save'));
        if (on === null) return;
        Lerna.pop(el);
        Lerna.toast(t(on ? 'td.savedToast' : 'td.unsavedToast'));
        render(); return;
      }
      if ((el = e.target.closest('[data-oppopen]'))) { Lerna.track('opp_open', el.getAttribute('data-oppopen')); setTimeout(render, 400); return; }
      if (e.target.closest('#notifyYes')) { Lerna.notify.ask().then(render); return; }
      if (e.target.closest('#notifyLater')) { Lerna.notify.later(); render(); return; }
      if (e.target.closest('#installBtn')) { Lerna.install.prompt().then(render); return; }
      if (e.target.closest('#redo')) { store.del('lerna_progress'); return; }
      var m = e.target.closest('[data-mission]');
      if (m && m.getAttribute('href').charAt(0) === '#') {
        e.preventDefault();
        var target = document.querySelector(m.getAttribute('href'));
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    document.addEventListener('submit', function (e) {
      if (e.target.id !== 'askForm') return;
      e.preventDefault();
      var q = $('askIn').value.trim(); if (!q) return;
      store.sset('lerna_ask', q);
      Lerna.go(Lerna.isLogged() ? 'espace.html#ia' : 'auth.html?mode=signup&redirect=' + encodeURIComponent('espace.html#ia'));
    });
  });
})();
</script>
</body>
</html>
